[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccmm-invenio"
version = "2.5.5"
description = "CCMM (Czech Core Metadata Model) components for NRP Invenio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "oarepo[rdm,tests]>=14.0.0,<15.0.0",
    "oarepo-model>=6.0.0,<7.0.0",
    # 9.1.1: RDMSubject is a subjects vocabulary (the subjects relation; before, only {"id"} was stored)
    "oarepo-rdm>=9.1.1,<10.0.0",
    # imported directly; 7.5.0: InternalRelation, which oarepo-model 6 imports but declares only >=7.0.0
    "oarepo-runtime>=7.5.0,<8.0.0",
    "langdetect>=1.0.9",
    "idutils",
    "pycountry",
    "pygml>=0.3.2",
    "pyproj>=3.8.0",
    "shapely>=2.1.2",
    "xmlschema>=4.2.0,<5.0.0",
    "oarepo-related-resources>=6.0.0,<7.0.0",

    # invenio dependencies
    "invenio-rdm-records>=32.0.1,<33.0.0",
]

[project.urls]
Homepage = "https://github.com/NRP-CZ/ccmm-invenio"

[project.optional-dependencies]
compile-vocabularies = [
    "click",
    "idutils",
    "pycountry",
    "pygml>=0.3.2",
    "pyproj>=3.8.0",
    "shapely>=2.1.2",
    "pyyaml",
    "rdflib",
    "tqdm",
]

oarepo14= [
    "oarepo>=14.0.0,<15.0.0",
]

tests = [
    "pytest-invenio>=4.0.0,<5.0.0",
]

[project.entry-points."invenio_config.module"]
ccmm_invenio = "ccmm_invenio.initial_config"

[project.entry-points."invenio_rdm_records.fixtures"]
ccmm_invenio = "ccmm_invenio.fixtures"

[project.entry-points."invenio_assets.webpack"]
ccmm_invenio_ui = "ccmm_invenio.ui.webpack:theme"
ccmm_invenio_i18n = "ccmm_invenio.i18n.webpack:theme"

[project.entry-points."invenio_i18n.translations"]
ccmm_invenio_messages = "ccmm_invenio.i18n"

[project.entry-points."invenio_base.blueprints"]
ccmm_invenio_ui = "ccmm_invenio.ui.views:create_blueprint"

[tool.hatch.build.targets.sdist]
include = [
    "/src/ccmm_invenio",
]
