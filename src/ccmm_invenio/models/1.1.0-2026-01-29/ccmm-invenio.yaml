#
# The CCMM dataset in Invenio (CCMMDataset). RDM fields are used wherever RDM has an
# equivalent, so that we do not have to reimplement the whole validation/ui logic;
# the rest takes its types from CCMM (ccmm.yaml).
#
# The IRIs are stored and exported to CCMM XML as they came, but they are not shown on
# the UI detail page nor are they editable in the UI forms.
#
CCMMRootRecord:
  type: object
  properties:
    ccmm_xml:
      type: keyword
      index: false

CCMMInvenioRelatedResource:
  type: object
  ui_marshmallow_schema_class: ccmm_invenio.resources.serializers.ui.related_resources.CCMMRelatedResourceUISchema
  properties:
    publication_date:
      type: RDMPublicationDate
      label:
        en: Publication date
        cs: Datum publikace

    title:
      type: RDMTitle
      required: true
      label:
        en: Title
        cs: Název

    publisher:
      type: RDMPublisher
      label:
        en: Publisher
        cs: Vydavatel
      hint:
        en: The entity responsible for making the resource available.
        cs: Entita odpovědná za zpřístupnění zdroje.
      help:
        en: Provide the name of the organization or individual that published the dataset. This may differ from the creators or contributors.
        cs: Uveďte název organizace nebo jednotlivce, který publikoval datovou sadu. To se může lišit od autorů nebo přispěvatelů.

    additional_titles:
      type: RDMAdditionalTitles
      label:
        en: Additional titles
        cs: Další názvy záznamu

    additional_descriptions:
      type: RDMAdditionalDescriptions
      label:
        en: Additional descriptions
        cs: Další popisy záznamu

    identifiers:
      label:
        en: Identifiers
        cs: Identifikátory
      hint:
        en: Alternate identifiers for the record.
        cs: Alternativní identifikátory záznamu.
      help:
        en: Include any identifiers that reference this record, such as DOIs, Handles, or other scheme-based IDs.
        cs: Uveďte jakékoliv identifikátory, které odkazují na tento záznam, jako jsou DOI, Handle nebo jiné identifikátory založené na schématu.
      type: RDMRecordIdentifiers

    locations:
      type: RDMLocations
      label:
        en: Locations
        cs: Lokace
      hint:
        en: Spatial coverage or place references.
        cs: Prostorové pokrytí či odkazy na místa.
      help:
        en: Specify where the dataset applies or was collected. Use bounding boxes, geometries, and place names.
        cs: Uveďte, čeho se data prostorově týkají nebo kde byla sbírána. Použijte ohraničující boxy, geometrie a názvy míst.

    creators:
      label:
        en: Creators
        cs: Autoři
      type: RDMCreators

    contributors:
      label:
        en: Contributors
        cs: Přispěvatelé
      type: RDMContributors

    dates:
      type: RDMDates
      label:
        en: Dates
        cs: Data
      hint:
        en: Important dates or periods relating to the dataset.
        cs: Důležité datumy nebo období vztahující se k datové sadě.
      help:
        en: Provide coverage periods, collection dates, or other temporal aspects, using instants or intervals.
        cs: Uveďte období pokrytí, datumy sběru nebo jiné časové aspekty pomocí okamžiků či intervalů.

    subjects:
      label:
        en: Subjects
        cs: Předměty
      type: RDMSubjects

    funding:
      type: RDMFundings
      label:
        en: Funding references
        cs: Financování
      hint:
        en: Information about grants or other funding sources supporting this research.
        cs: Informace o grantech nebo jiných zdrojích financování podporujících tento výzkum.
      help:
        en: Include details of funding bodies, grant numbers, and related information.
        cs: Uveďte podrobnosti o financujících institucích, číslech grantů a související informace.

    rights:
      type: RDMRights
      label:
        en: Rights
        cs: Práva
      hint:
        en: License, access rights, and usage conditions.
        cs: Licence, přístupová práva a podmínky použití.
      help:
        en: Specify legal terms governing access and reuse. Include license documents and any restrictions.
        cs: Uveďte právní podmínky upravující přístup a opětovné použití. Zahrňte licenční dokumenty a případná omezení.

    resource_type:
      type: RDMResourceType
      label:
        en: Resource type
        cs: Typ záznamu

    languages:
      type: RDMLanguages
      label:
        en: Languages
        cs: Jazyky

    relation_type:
      type: vocabulary
      vocabulary-type: relationtypes
      label:
        en: Relation type
        cs: Typ vztahu

    imported_from:
      type: keyword
      label:
        en: Imported from
        cs: Importováno z
      hint:
        en: Source identifier URL this related resource was imported from (e.g. DOI URL). Empty for manual entries.
        cs: URL identifikátoru zdroje, ze kterého byl tento související zdroj importován (např. DOI URL). Prázdné pro ručně zadané záznamy.

    iri:
      type: keyword
      label:
        en: IRI
        cs: IRI
      hint:
        en: International Resource Identifier (IRI) of the related resource.
        cs: International Resource Identifier (IRI) souvisejícího zdroje.

    resource_url:
      type: keyword
      label:
        en: Resource URL
        cs: URL zdroje
      hint:
        en: URL of the related resource.
        cs: URL souvisejícího zdroje.

CCMMInvenioMetadataRecord:
  # ccmm metadata record (CCMMMetadataRecord) with the agents as RDM contributors
  type: object
  properties:
    iri:
      type: keyword
      label:
        en: IRI
        cs: IRI
    conforms_to_standards:
      type: array
      items:
        type: CCMMApplicationProfile
      label:
        en: Conforms to standards
        cs: Odpovídá standardům
    date_created:
      type: date
      label:
        en: Date created
        cs: Datum vytvoření
    date_updated:
      # 0..n in the ccmm xsd
      type: array
      items:
        type: date
      label:
        en: Dates updated
        cs: Data aktualizace
    languages:
      type: array
      items:
        type: CCMMLanguageSystem
      label:
        en: Languages
        cs: Jazyky
    original_repository:
      type: CCMMRepository
      required: true
      label:
        en: Original repository
        cs: Původní repozitář
    qualified_relations:
      # the agents with their roles (at least one Data Manager in ccmm), as RDM contributors
      type: RDMContributors
      required: true
      label:
        en: Agents
        cs: Agenti

CCMMDataset:
  type: object
  properties:
    iri:
      type: keyword
      label:
        en: IRI
        cs: IRI
      hint:
        en: International Resource Identifier (IRI) of the dataset.
        cs: International Resource Identifier (IRI) datasetu.

    # we use RDM publication date as it is, publication_year is derived from it
    publication_date:
      type: RDMPublicationDate
      required: true
      label:
        en: Publication date
        cs: Datum publikace

    # we use RDM version
    version:
      type: RDMRecordVersion
      label:
        en: Record Version
        cs: Verze záznamu

    # taken from RDM
    title:
      type: RDMTitle
      required: true
      label:
        en: Title
        cs: Název

    description:
      type: RDMDescription
      label:
        en: Description
        cs: Popis

    publisher:
      type: RDMPublisher
      label:
        en: Publisher
        cs: Vydavatel
      hint:
        en: The entity responsible for making the resource available.
        cs: Entita odpovědná za zpřístupnění zdroje.
      help:
        en: Provide the name of the organization or individual that published the dataset. This may differ from the creators or contributors.
        cs: Uveďte název organizace nebo jednotlivce, který publikoval datovou sadu. To se může lišit od autorů nebo přispěvatelů.

    # publisher in ccmm is in qualified relations, in RDM it is a separate field
    # in ccmm it is a complex structure (org, person, ...), in RDM it is just a string
    # we will use the string for now, in datacite 4.7 it will be a complex structure
    # and we migrate then.

    # alternate_titles:
    # we use RDM's additional_titles and re-format them for CCMM export
    additional_titles:
      type: RDMAdditionalTitles
      label:
        en: Additional titles
        cs: Další názvy záznamu

    # descriptions:
    # we use invenio's additional_descriptions and re-format them for CCMM export
    additional_descriptions:
      type: RDMAdditionalDescriptions
      label:
        en: Additional descriptions
        cs: Další popisy záznamu

    # the metadata records of a harvested (3rd party) dataset, stored as they came; a dataset
    # created here has none - its metadata record is made from the technical invenio metadata
    # on export. Not shown / edited in the UI yet.
    metadata_identifications:
      type: array
      items:
        type: CCMMInvenioMetadataRecord
      label:
        en: Metadata records
        cs: Metadatové záznamy
      hint:
        en: Identification of the original metadata record of a harvested dataset.
        cs: Identifikace původního metadatového záznamu sklizené datové sady.

    # identifiers:
    # invenio RDM identifiers are usede instead
    identifiers:
      label:
        en: Identifiers
        cs: Identifikátory
      hint:
        en: Alternate identifiers for the record.
        cs: Alternativní identifikátory záznamu.
      help:
        en: Include any identifiers that reference this record, such as DOIs, Handles, or other scheme-based IDs.
        cs: Uveďte jakékoliv identifikátory, které odkazují na tento záznam, jako jsou DOI, Handle nebo jiné identifikátory založené na schématu.
      type: RDMRecordIdentifiers

    locations:
      type: RDMLocations
      label:
        en: Locations
        cs: Lokace
      hint:
        en: Spatial coverage or place references.
        cs: Prostorové pokrytí či odkazy na místa.
      help:
        en: Specify where the dataset applies or was collected. Use bounding boxes, geometries, and place names.
        cs: Uveďte, čeho se data prostorově týkají nebo kde byla sbírána. Použijte ohraničující boxy, geometrie a názvy míst.

    # provenances:
    # not finalized in ccmm, therefore not stored

    # qualified_relations:
    # in Invenio, we have Creators and Contributors, not qualified relations
    creators:
      required: true
      label:
        en: Creators
        cs: Autoři
      type: RDMCreators

    contributors:
      label:
        en: Contributors
        cs: Přispěvatelé
      type: RDMContributors

    dates:
      # taken from the CCMM as it is, though some dates might come from invenio directly
      # and should not be duplicated here.
      # We can not use RDM "dates" here as they are missing multilingual labels and
      # optionality in interval start/end

      type: RDMDates
      label:
        en: Dates
        cs: Data
      hint:
        en: Important dates or periods relating to the dataset.
        cs: Důležité datumy nebo období vztahující se k datové sadě.
      help:
        en: Provide coverage periods, collection dates, or other temporal aspects, using instants or intervals.
        cs: Uveďte období pokrytí, datumy sběru nebo jiné časové aspekty pomocí okamžiků či intervalů.

    # taken from Invenio
    subjects:
      label:
        en: Subjects
        cs: Předměty
      type: RDMSubjects

    # validation_results:
    # not finalized in ccmm, therefore not stored

    distributions:
      # data services and downloadable files described by the source (a harvested dataset); the files
      # uploaded to the record are added as downloadable files on the ccmm export
      type: array
      items:
        type: CCMMDistribution
      label:
        en: Distributions
        cs: Distribuce
      help:
        en: Information about the available distributions of the dataset.
        cs: Informace o dostupných distribucích datové sady.

    # funding_references:
    # we use RDM funding
    funding:
      type: RDMFundings
      label:
        en: Funding references
        cs: Financování
      hint:
        en: Information about grants or other funding sources supporting this research.
        cs: Informace o grantech nebo jiných zdrojích financování podporujících tento výzkum.
      help:
        en: Include details of funding bodies, grant numbers, and related information.
        cs: Uveďte podrobnosti o financujících institucích, číslech grantů a související informace.

    # Can not be taken from RDM but we might to need a projection to RDM so that
    # some parts from invenio can be reused

    # TODO: maybe use better related resources such as nr-docs ones. The reason is
    # that CCMM is not capable of referencing an article in a journal correctly.
    # for now commented out
    # related_resources:
    #   # sawsdl:modelReference=https://model.ccmm.cz/vocabulary/ccmm#hasRelatedResource
    #   type: array
    #   items:
    #     type: Resource
    #   label:
    #     en: Related resources
    #     cs: Související zdroje
    #   hint:
    #     en: Links to related datasets, publications, or services.
    #     cs: Odkazy na související datové sady, publikace či služby.
    #   help:
    #     en: Add references to resources related by citation, derivation, supplement, or other relationships.
    #     cs: Přidejte odkazy na zdroje související citací, odvozením, doplněním či jiným vztahem.

    # taken from RDM
    resource_type:
      type: RDMResourceType
      required: true
      label:
        en: Resource type
        cs: Typ záznamu

    # other_languages:
    # primary_language:
    # RDM uses "languages", we adopt the same (and for CCMM serialization take the
    # first one as the primary language)
    languages:
      type: RDMLanguages
      label:
        en: Languages
        cs: Jazyky

    # not supported now:
    related_identifiers:
      type: RDMRelatedIdentifiers
      label:
        en: Related identifiers
        cs: Související identifikátory
      hint:
        en: Links to related datasets, publications, or services.
        cs: Odkazy na související datové sady, publikace či služby.
      help:
        en: Add references to resources related by citation, derivation, supplement, or other relationships.
        cs: Přidejte odkazy na zdroje související citací, odvozením, doplněním či jiným vztahem.

    related_resources:
      type: array
      items:
        type: CCMMInvenioRelatedResource
      label:
        en: Related resources
        cs: Související datové sady, publikace či služby
      hint:
        en: Links to related datasets, publications, or services.
        cs: Odkazy na související datové sady, publikace či služby.
      help:
        en: Add references to resources related by citation, derivation, supplement, or other relationships.
        cs: Přidejte odkazy na zdroje související citací, odvozením, doplněním či jiným vztahem.

    rights:
      # sawsdl:modelReference=https://model.ccmm.cz/vocabulary/datacite#hasVersion
      type: RDMRights
      label:
        en: Rights
        cs: Práva
      hint:
        en: License, access rights, and usage conditions.
        cs: Licence, přístupová práva a podmínky použití.
      help:
        en: Specify legal terms governing access and reuse. Include license documents and any restrictions.
        cs: Uveďte právní podmínky upravující přístup a opětovné použití. Zahrňte licenční dokumenty a případná omezení.
