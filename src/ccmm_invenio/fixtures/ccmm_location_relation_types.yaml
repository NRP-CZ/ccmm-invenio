- crosswalks: []
  description:
    cs: Jedná se o určení lokace, kde byla daná data zaznamenána (naměřena, sesbírána...).
    en: This is the determination of the location where the data was collected (measured,
      recorded, observed etc.).
  id: collected
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/locationrelationtypes/collected
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/LocationRelation/Collected
    scheme: https://vocabs.ccmm.cz/registry/codelist/LocationRelation/
  props:
    iri: https://nma.eosc.cz/vocabularies/locationrelationtypes/collected
  title:
    cs: Získáno v lokaci
    en: Collected in
- crosswalks: []
  description:
    cs: Jedná se o určení lokace, kde byla daná data po sběru či naměření dále zpracována.
    en: This is the determination of the location where the data was further processed
      after collection or measurement.
  id: processed
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/locationrelationtypes/processed
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/LocationRelation/Processed
    scheme: https://vocabs.ccmm.cz/registry/codelist/LocationRelation/
  props:
    iri: https://nma.eosc.cz/vocabularies/locationrelationtypes/processed
  title:
    cs: Zpracováno v lokaci
    en: Processed at location
- crosswalks: []
  description:
    cs: Jedná se o vztah k lokaci, které se týkají obsahově daná data. Dataset obsahuje
      data o dané lokaci.
    en: This is a relationship to a location that relates to the content of the data.
      The dataset contains data about the given location.
  id: refers
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/locationrelationtypes/refers
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/LocationRelation/Refers
    scheme: https://vocabs.ccmm.cz/registry/codelist/LocationRelation/
  props:
    iri: https://nma.eosc.cz/vocabularies/locationrelationtypes/refers
  title:
    cs: Týká se lokace
    en: Refers to the location
- crosswalks: []
  description:
    cs: Jedná se o určení lokace, kde byla daná data po sběru, naměření či zpracování
      uložena a jsou trvale uchovávána.
    en: This is the determination of the location where the data is permanently stored
      after collection, measurement or processing.
  id: stored
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/locationrelationtypes/stored
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/LocationRelation/Stored
    scheme: https://vocabs.ccmm.cz/registry/codelist/LocationRelation/
  props:
    iri: https://nma.eosc.cz/vocabularies/locationrelationtypes/stored
  title:
    cs: Uchováno v lokaci
    en: Stored at location
