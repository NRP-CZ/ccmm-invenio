    IANA_MT: application/vnd.ms-excel.sheet.macroEnabled.12
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/XLSM
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: xlsx
  title:
    en: Excel XLSX
  description:
    en: XLSX is the default file format for Excel 2007 and later workbook used for
      Microsoft Excel spreadsheet which features calculation, graphing tools, pivot
      tables and a macro programming language. XLSX is in reality a ZIP compressed
      archive with a directory structure of XML text documents.
  props:
    CELLAR_MANIFT: xlsx
    CELLAR_MT: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    FILE_EXT: .xlsx
    IANA_MT: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/XLSX
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: xml
  title:
    en: XML
  description:
    en: XML – Extensible Markup Language – is a markup language that defines a set
      of rules for encoding documents in a format that is both human-readable and
      machine-readable. The design goals of XML emphasize simplicity, generality and
      usability across the Internet.
  props:
    CELLAR_MANIFT: xml
    CELLAR_MT: application/xml
    FILE_EXT: .xml
    IANA_MT: application/xml
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/XML
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: xslfo
  title:
    en: XSL-FO
  description:
    en: XSL-FO – XSL Formatting Objects – is a markup language for XML document formatting
      that is most often used to generate PDF files. XSL-FO is part of XSL (Extensible
      Stylesheet Language), a set of W3C technologies designed for the transformation
      and formatting of XML data.
  props:
    FILE_EXT: .fo
    IANA_MT: application/xml
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/XSLFO
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: xslt
  title:
    en: XSLT
  description:
    en: XSLT – Extensible Stylesheet Language Transformations – is a language for
      transforming XML documents into other XML documents or other formats such as
      HTML for web pages, plain text or XSL Formatting Objects, which may subsequently
      be converted to other formats, such as PDF, PostScript and PNG.
  props:
    CELLAR_MANIFT: xslt
    CELLAR_MT: application/xslt+xml
    FILE_EXT: .xsl, .xslt
    IANA_MT: application/xslt+xml
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/XSLT
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: xyz
  title:
    en: XYZ Chemical File
  description:
    en: The XYZ file format is a chemical file format. There is no formal standard
      and several variations exist, but a typical XYZ format specifies the molecule
      geometry by giving the number of atoms with Cartesian coordinates that will
      be read on the first line, a comment on the second, and the lines of atomic
      coordinates in the following lines.
  props:
    CELLAR_MT: chemical/x-pdb
    FILE_EXT: .xyz
    IANA_MT: chemical/x-xyz
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/XYZ
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: xz
  title:
    en: xz
  description:
    en: Compressed file produced using XZ Utils (free software command-line lossless
      data compressors, including LZMA and xz).
  props:
    FILE_EXT: .xz
    IANA_MT: application/x-xz
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/XZ
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: yaml
  title:
    en: YAML
  description:
    en: YAML is a human-friendly, cross language, Unicode based data serialization
      language designed around the common native data types of dynamic programming
      languages. It is broadly useful for programming needs ranging from configuration
      files to internet messaging to object persistence to data auditing and visualization.
  props:
    FILE_EXT: .yaml, .yml
    IANA_MT: application/yaml
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/YAML
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: z
  title:
    en: Z
  description:
    en: Compressed file produced by Unix shell compression program based on the LZW
      (Lempel-Ziv-Welch) compression algorithm.
  props:
    FILE_EXT: .Z
    IANA_MT: application/x-compress
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/Z
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: zip
  title:
    en: ZIP
  description:
    en: ZIP is an archive file format that supports lossless data compression. A ZIP
      file may contain one or more files or directories that may have been compressed.
  props:
    CELLAR_MANIFT: zip
    CELLAR_MT: application/zip
    FILE_EXT: .zip
    IANA_MT: application/zip
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ZIP
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
