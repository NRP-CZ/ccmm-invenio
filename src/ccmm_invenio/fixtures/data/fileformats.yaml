    en: JSON-LD
  description:
    en: JSON-LD is a JSON-based format to serialize Linked Data. It is primarily intended
      to be a way to use Linked Data in Web-based programming environments, to build
      interoperable Web services, and to store Linked Data in JSON-based storage engines.
  props:
    FILE_EXT: .jsonld
    IANA_MT: application/ld+json
