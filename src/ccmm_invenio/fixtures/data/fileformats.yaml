      data objects consisting of attribute–value pairs and array data types (or any
      other serializable value). It is a very common data format used for asynchronous
      browser/server communication.
  props:
    FILE_EXT: .json
    IANA_MT: application/json
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/JSON
    scheme: http://publications.europa.eu/resource/authority/file-type/
