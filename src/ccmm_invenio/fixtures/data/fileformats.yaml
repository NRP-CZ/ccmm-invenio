    en: Archive file containing the content from (or destined for) an optical disk.
      Originally it was limited to data formatted to comply with the ISO 9660 standard
      (1988), hence the format name and the iso file extension. The ISO Disk Image
      File Format is typically used to package or bundle software, databases, authored
      DVD video programs, and the like. ISO image files, unlike normal files, are
      not opened but rather are mounted. ISO image files contain the data contents
