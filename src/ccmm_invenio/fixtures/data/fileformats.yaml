    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: jpeg
  title:
    en: JPEG
  description:
    en: JPEG – Joint Photographic Experts Group – is a commonly used method of lossy
      compression for digital images, particularly for those images produced by digital
      photography. The degree of compression can be adjusted, allowing a selectable
      tradeoff between storage size and image quality.
