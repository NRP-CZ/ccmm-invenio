- id: 7z
  title:
    en: 7z
  description:
    en: 7z is a compressed archive file format that supports several different data
      compression, encryption and pre-processing algorithms.
  props:
    FILE_EXT: .7z
    IANA_MT: application/x-7z-compressed
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/7Z
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: aab
  title:
    en: AAB
  description:
    en: An Android App Bundle (AAB) is a package file format used by the Android operating
      system. It includes an app’s compiled code and resources, and defers APK generation
      and signing to Google Play.
  props:
    FILE_EXT: .aab
    IANA_MT: application/x-authorware-bin
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/AAB
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: aac
  title:
    en: AAC
  description:
    en: Advanced Audio Coding (AAC) is an audio coding standard for lossy digital
      audio compression. Designed to be the successor of the MP3 format, AAC generally
      achieves higher sound quality than MP3 at the same bit rate.
  props:
    FILE_EXT: .aac, .adts, .ass, .loas
    IANA_MT: audio/aac
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/AAC
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: akn4eu
  title:
    en: AKN4EU file
  description:
    en: AKN4EU file is an Akoma Ntoso XML file conforming to the AKN4EU (Akoma Ntoso
      for European Union) specifications. One or more AKN4EU files can be part of
      an AKN4EU ZIP file. A special AKN4EU file called ‘main.xml’ is the entry point
      of an AKN4EU ZIP file.
  props:
    CELLAR_MANIFT: akn4eu
    CELLAR_MT: application/xml;type=akn4eu
    FILE_EXT: .akn, .xml
    IANA_MT: application/xml
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/AKN4EU
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: akn4eu_leg
  title:
    en: AKN4EU LEG
  description:
    en: ZIP archive containing an AKN4EU manifestation of a document in one linguistic
      variant issued in the legal decision-making process; it must contain at least
      an AKN4EU file starting with the prefix ‘main-’, which constitutes the entry
      point, and may contain other associated files and subfolders
  props:
    CELLAR_MANIFT: akn4eu
    CELLAR_MT: application/xml;type=akn4eu-main
    FILE_EXT: .leg
    IANA_MT: application/zip
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/AKN4EU_LEG
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: akn4eu_zip
  title:
    en: AKN4EU ZIP
  description:
    en: retired concept; replaced by AKN4EU_LEG
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/AKN4EU_ZIP
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: apk
  title:
    en: APK
  description:
    en: Android Package (APK) is the package file format used by the Android operating
      system for distribution and installation of mobile apps, mobile games and middleware.
  props:
    FILE_EXT: .apk, .xapk
    IANA_MT: application/vnd.android.package-archive
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/APK
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: appx
  title:
    en: AppX
  description:
    en: AppX is a file format used to distribute and install apps on Windows 8.x and
      10, Windows Phone 8.1, Windows 10 Mobile, Xbox One, Hololens and Windows 10
      IoT Core.
  props:
    FILE_EXT: .appx, .appxbundle
    IANA_MT: application/octet-stream
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/APPX
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: arc
  title:
    en: ARC
  description:
    en: ARC is the archive file format of Internet Archive. ARC files are large aggregate
      files.
  props:
    FILE_EXT: .arc
    IANA_MT: application/octet-stream
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ARC
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: arc_gz
  title:
    en: ARC GZ
  description:
    en: ARC is the archive file format of Internet Archive. ARC files are large aggregate
      files. ARC GZ is ARC compressed by GZIP.
  props:
    FILE_EXT: .arc.gz
    IANA_MT: application/gzip
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ARC_GZ
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: arcinfo_cov
  title:
    en: ArcInfo coverage
  description:
    en: An ESRI ArcInfo coverage is a georelational data model that stores vector
      data – it contains both the spatial (location) and attribute (descriptive) data
      for geographic features. Coverages use a set of feature classes to represent
      geographic features. Each feature class stores a set of points, lines (arcs),
      polygons, or annotation (text). Coverages can have topology, which determines
      the relationships between features. A coverage is stored as a directory within
      which each feature class is stored as a set of files.
  props:
    IANA_MT: multipart/mixed
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ARCINFO_COV
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: arff
  title:
    en: ARFF
  description:
    en: ASCII text file that describes a list of instances sharing a set of attributes
  props:
    FILE_EXT: .arff
    IANA_MT: text/plain
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ARFF
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: arj
  title:
    en: ARJ
  description:
    en: Compressed archive file produced by ARJ software. ARJ (Archived by Robert
      Jung) is a software tool designed by Robert K. Jung for creating high-efficiency
      compressed file archives.
  props:
    FILE_EXT: .arj
    IANA_MT: application/x-arj
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ARJ
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: arrow_file
  title:
    en: Arrow file
  description:
    en: Apache columnar format that includes a language-agnostic in-memory data structure
      specification, metadata serialisation, and a protocol for serialisation and
      generic data transport; file (random access) format is used for serialising
      a fixed number of record batches
  props:
    FILE_EXT: .arrow
    IANA_MT: application/vnd.apache.arrow.file
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ARROW_FILE
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: arrow_stream
  title:
    en: Arrow stream
  description:
    en: Apache columnar format that includes a language-agnostic in-memory data structure
      specification, metadata serialisation, and a protocol for serialisation and
      generic data transport; streaming format is used for sending an arbitrary length
      sequence of record batches
  props:
    FILE_EXT: .arrows
    IANA_MT: application/vnd.apache.arrow.stream
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ARROW_STREAM
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: atom
  title:
    en: Atom Feed
  description:
    en: The Atom Feed or Atom Syndication Format is an XML language used for web feeds.
      Web feeds allow software programs to check for updates published on a website.
  props:
    FILE_EXT: .atom, .xml
    IANA_MT: application/atom+xml
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ATOM
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: azw
  title:
    en: Amazon Kindle eBook
  description:
    en: AZW Kindle File Format is a proprietary e-book file format created by Amazon.com
      that can be downloaded and read on devices like smartphones, tablets, computers
      or e-readers that have Amazon's Kindle application.
  props:
    CELLAR_MANIFT: amz
    CELLAR_MT: application/vnd.amazon.ebook
    FILE_EXT: .azw
    IANA_MT: application/vnd.amazon.ebook
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/AZW
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: bin
  title:
    en: Binary Data
  description:
    en: A binary file is a computer file that is not a text file.
  props:
    CELLAR_MT: application/octet-stream
    FILE_EXT: .bin
    IANA_MT: application/octet-stream
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/BIN
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: bits
  title:
    en: BITS XML
  description:
    en: BITS – Book Interchange Tag Suite – is the ‘book version’ of Journal Article
      Tag Suite (JATS); an XML format used to describe books published online. BITS
      provides a common XML format in which publishers and archivists can describe
      textual and graphical content elements. In order to facilitate the reusability,
      BITS makes a tag set adequate for supporting interchange, archiving, format-conversion
      and publishing.
  props:
    FILE_EXT: .xml
    IANA_MT: application/xml
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/BITS
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: bmp
  title:
    en: Bitmap Image File
  description:
    en: The bitmap image (BMP) or device independent bitmap (DIB) is a raster graphics
      image file format used to store bitmap digital images, independently of the
      display device.
  props:
    CELLAR_MT: image/bmp
    FILE_EXT: .bm, .bmp, .dib
    IANA_MT: image/x-ms-bmp
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/BMP
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: bwf
  title:
    en: BWF
  description:
    en: BWF – Broadcast Wave Format – is an extension of the Microsoft WAV audio format
      and is the recording format of most file-based non-linear digital recorders
      used for motion picture, radio and television production. The purpose of this
      file format is the addition of metadata to facilitate the seamless exchange
      of sound data between different computer platforms and applications.
  props:
    FILE_EXT: .bwf, .wav
    IANA_MT: audio/vnd.wave
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/BWF
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: bzip2
  title:
    en: bzip2
  description:
    en: An open source, patent- and royalty-free compression format. The compression
      algorithm is a Burrows-Wheeler transform followed by a move-to-front transform
      and finally Huffman coding.
  props:
    FILE_EXT: .bz2
    IANA_MT: application/x-bzip2
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/BZIP2
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: css
  title:
    en: CSS
  description:
    en: CSS – Cascading Style Sheets – is a style sheet language used for describing
      the presentation of a document written in a markup language.
  props:
    CELLAR_MANIFT: css
    CELLAR_MT: text/css
    FILE_EXT: .css
    IANA_MT: text/css
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/CSS
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: csv
  title:
    en: CSV
  description:
    en: CSV – comma-separated values – files store tabular data (numbers and text)
      in plain text. Each line of the file is a data record. Each record consists
      of one or more fields, separated by commas.
  props:
    CELLAR_MANIFT: csv
    CELLAR_MT: text/csv
    FILE_EXT: .csv
    IANA_MT: text/csv
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/CSV
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dapk
  title:
    en: DAPK
  description:
    en: An Android Package (APK) with special features used by the Android operating
      system for the distribution and installation of Daydream mobile apps.
  props:
    FILE_EXT: .apk, .xapk
    IANA_MT: application/vnd.android.package-archive
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DAPK
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dbf
  title:
    en: DBF
  description:
    en: DBF – dBase database file – is supported by a number of database products.
      dBase was one of the first database management systems for microcomputers.
  props:
    FILE_EXT: .dbf
    IANA_MT: application/x-dbase
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DBF
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dcr
  title:
    en: DCR File
  description:
    en: DCR is a file type for Adobe Shockwave Media files. DCR files are used to
      create games and other highly interactive content.
  props:
    CELLAR_MT: application/x-director
    FILE_EXT: .dcr
    IANA_MT: application/x-director
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DCR
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: deb
  title:
    en: deb
  description:
    en: Debian package is a standard Unix ar archive that includes two tar archives.
      One archive holds the control information and another contains the installable
      data.
  props:
    FILE_EXT: .deb
    IANA_MT: application/vnd.debian.binary-package
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DEB
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dgn
  title:
    en: DGN
  description:
    en: A DGN file is a 2D/3D drawing created by various construction CAD software,
      such as MicroStation and Intergraph Interactive Graphics Design System. It may
      be saved in one of two formats, either the Intergraph Standard File Format (ISFF)
      or the newer V8 DGN standard. DGN files are typically used to save designs for
      construction projects for highways, bridges, and buildings.
  props:
    FILE_EXT: .dgn
    IANA_MT: application/octet-stream
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DGN
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dmg
  title:
    en: DMG
  description:
    en: Apple Disk Image is a disk image format commonly used by the macOS operating
      system.
  props:
    FILE_EXT: .dmg
    IANA_MT: application/x-apple-diskimage
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DMG
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dmp
  title:
    en: Oracle Dump
  description:
    en: DMP is the media type which shall be used for Oracle dumps. This media type
      is incomplete as it lacks a reference to the specification of the format.
  props:
    FILE_EXT: .dmp
    IANA_MT: application/x-oracledump
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DMP
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: doc
  title:
    en: Word DOC
  description:
    en: DOC is a proprietary binary Word document format used by Microsoft Word word
      processor.
  props:
    CELLAR_MANIFT: doc
    CELLAR_MT: application/msword
    FILE_EXT: .doc
    IANA_MT: application/msword
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DOC
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: docx
  title:
    en: Word DOCX
  description:
    en: DOCX is an Office Open XML international standard for Office documents. It
      is used by Microsoft Word and by a growing number of applications from other
      vendors in word processing programs.
  props:
    CELLAR_MANIFT: docx
    CELLAR_MT: application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml
    FILE_EXT: .docx
    IANA_MT: application/vnd.openxmlformats-officedocument.wordprocessingml.document
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DOCX
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dtd_sgml
  title:
    en: SGML DTD
  description:
    en: SGML – Standard Generalized Markup Language – is a standard for defining generalized
      markup languages for documents. DTD – document type definition – is a set of
      markup declarations that define a document type for an SGML-family markup language
      (SGML, XML, HTML). It defines the legal building blocks of an XML document,
      the document structure with a list of legal elements and attributes.
  props:
    CELLAR_MT: application/sgml-dtd
    FILE_EXT: .dtd
    IANA_MT: application/sgml
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DTD_SGML
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dtd_xml
  title:
    en: XML DTD
  description:
    en: XML – Extensible Markup Language – is a markup language that defines a set
      of rules for encoding documents in a format that is both human-readable and
      machine-readable. DTD – document type definition – is a set of markup declarations
      that define a document type for an SGML-family markup language (SGML, XML, HTML).
      It defines the legal building blocks of an XML document, the document structure
      with a list of legal elements and attributes. XML uses a subset of SGML DTD.
  props:
    CELLAR_MT: application/xml-dtd
    FILE_EXT: .dtd
    IANA_MT: application/xml-dtd
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DTD_XML
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dwca
  title:
    en: DwC-A
  description:
    en: biodiversity informatics data standard that makes use of the Darwin Core terms
      to produce a single, self contained dataset for sharing species-level (taxonomic),
      species-occurrence data, and sampling-event data; an archive is a set of text
      files, in standard comma- or tab-delimited format, with a simple descriptor
      file (called meta.xml) to inform others how the files are organized
  props:
    FILE_EXT: .tar.gz, .zip
    IANA_MT: application/gzip, application/zip
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DWCA
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dwg
  title:
    en: DWG
  description:
    en: A DWG file is a 2D or 3D drawing created with Autodesk AutoCAD, a professional
      CAD program. It contains vector image data and metadata that AutoCAD and other
      CAD applications use to load a drawing. DWG files are related to .DXF files,
      which are ASCII versions of DWG files.
  props:
    FILE_EXT: .dwg
    IANA_MT: application/dwg, image/vnd.dwg
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DWG
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: dxf
  title:
    en: DXF
  description:
    en: A DXF file is a data file saved in a format developed by Autodesk and used
      for CAD (computer-aided design) vector image files, such as AutoCAD documents.
      DXF files are similar to .DWG files, but are more compatible with other programs
      since they are ASCII (text) based.
  props:
    FILE_EXT: .dxf
    IANA_MT: image/vnd.dxf
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/DXF
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: e00
  title:
    en: E00
  description:
    en: E00 is an ArcInfo interchange file format. ArcInfo is a full-featured geographic
      information system produced by Esri.
  props:
    FILE_EXT: .e00
    IANA_MT: application/x-e00
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/E00
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: ear
  title:
    en: EAR
  description:
    en: EAR (Enterprise Application aRchive) is a file format used by Java EE for
      packaging one or more modules into a single archive.
  props:
    FILE_EXT: .ear
    IANA_MT: application/java-archive
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/EAR
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: ecw
  title:
    en: ECW
  description:
    en: ECW – Enhanced Compressed Wavelet – is the media type which shall be used
      for a proprietary wavelet compression image format optimized for aerial and
      satellite imagery.
  props:
    FILE_EXT: .ecw
    IANA_MT: application/x-ecw
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/ECW
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: eforms_xml
  title:
    en: eForms XML
  description:
    en: EU legislative XML standard for procurement data used by public buyers to
      publish notices on Tenders Electronic Daily (TED), the European public procurement
      advertising website. The standard forms (eForms) have been established by the
      Commission Implementing Regulation (EU) 2019/1780 of 23 September 2019, and
      need to be implemented in national eProcurement systems by being tailored to
      national needs.
  props:
    CELLAR_MANIFT: eforms_xml
    CELLAR_MT: application/xml
    FILE_EXT: .xml
    IANA_MT: application/xml
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/EFORMS_XML
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: eps
  title:
    en: Encapsulated Postscript
  description:
    en: EPS – Encapsulated PostScript – files are more-or-less self-contained, reasonably
      predictable PostScript documents that describe an image or drawing and can be
      placed within another PostScript document.
  props:
    CELLAR_MT: application/postscript
    FILE_EXT: .eps
    IANA_MT: application/postscript
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/EPS
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: epub
  title:
    en: EPUB
  description:
    en: EPUB – electronic publication – is an e-book file format that can be downloaded
      and read on devices like smartphones, tablets, computers or e-readers. It is
      a technical standard published by the International Digital Publishing Forum
      (IDPF).
  props:
    CELLAR_MANIFT: epub
    CELLAR_MT: application/epub+zip
    FILE_EXT: .epub
    IANA_MT: application/epub+zip
  mappings:
  - identifier: http://publications.europa.eu/resource/authority/file-type/EPUB
    scheme: http://publications.europa.eu/resource/authority/file-type/
    relation: exactMatch
- id: etsi_tsl
  title:
