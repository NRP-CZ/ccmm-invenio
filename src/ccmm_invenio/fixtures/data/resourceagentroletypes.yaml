  description:
    cs: Pracovní balíček je uznaný datový produkt, jehož celý obsah nemusí být zahrnut
      v publikaci. Balíček může však zahrnovat například poznámky, vyřazené dokumenty
      apod. Vedoucí pracovního balíčku je odpovědný za zajištění úplnosti obsahu,
      verzování a dostupnost pracovního balíčku během vývoje daného zdroje.
    en: ' A Work Package is a recognized data product, not all of which is included
