- id: 9dkx-ksaf
  title:
    en: utility model
  description:
    en: 'A special form of patent right granted by a state or jurisdiction to an inventor
      or the inventor’s assignee for a fixed period of time. The terms and conditions
      for granting a utility model are slightly different from those for normal patents
      (including a shorter term of protection and less stringent patentability requirements).
      The term can also describe what are known in certain countries as “petty patents,”
      “short-term patents” or “innovation patents.” [Source: https://www.wipo.int/edocs/pubdocs/en/wipo_pub_943_2018.pdf]'
  hierarchy:
    parent: publication-patent
  mappings:
  - identifier: http://purl.org/coar/resource_type/9DKX-KSAF
    scheme: http://purl.org/coar/resource_type/
    relation: exactMatch
  - identifier: https://sparontologies.github.io/fabio/current/fabio.html#d4e4175
    scheme: https://sparontologies.github.io/fabio/current/fabio.html#
    relation: broadMatch
- id: c53b-jcy5
  title:
    en: design patent
  description:
    en: 'A patent granted to any person who has invented any new and non-obvious ornamental
      design for an article of manufacture. The design patent protects only the appearance
      of an article, but not its structural or functional features. [Source: Adapted
      from https://www.uspto.gov/patents/basics/types-patent-applications/design-patent-application-guide#def]'
  hierarchy:
    parent: publication-patent
  mappings:
  - identifier: http://purl.org/coar/resource_type/C53B-JCY5
    scheme: http://purl.org/coar/resource_type/
    relation: exactMatch
  - identifier: https://sparontologies.github.io/fabio/current/fabio.html#d4e4551
    scheme: https://sparontologies.github.io/fabio/current/fabio.html#
    relation: broadMatch
- id: c_186u
  title:
    cs: zpráva k politice nebo strategii
    en: policy report
  description:
    en: 'A policy report presents what is known about a particular issue or problem.
      It assembles facts and evidence to help readers understand complex issues and
      form a response. It might aim to be neutral, or it might aim to persuade readers
      in a particular direction. [Source: https://www.uow.edu.au/student/learning-co-op/assessments/policy-report/#]'
  hierarchy:
    parent: publication-report
  mappings:
  - identifier: http://purl.org/coar/resource_type/c_186u
    scheme: http://purl.org/coar/resource_type/
    relation: exactMatch
  - identifier: http://purl.org/datacite/v4.4/Report
    scheme: http://purl.org/datacite/v4.4/
    relation: broadMatch
  - identifier: https://sparontologies.github.io/fabio/current/fabio.html#d4e4801
    scheme: https://sparontologies.github.io/fabio/current/fabio.html#
    relation: exactMatch
- id: c_18co
  title:
    cs: konferenční poster nezahrnutý ve sborníku
    en: conference poster not in proceedings
  description:
    en: 'A display poster, typically containing text with illustrative figures and/or
      tables, usually reporting research results or proposing hypotheses, submitted
      for acceptance to and/or presented at a conference, seminar, symposium, workshop
      or similar event. Use this label when the poster is not published in a proceeding.
      [Source: http://purl.org/spar/fabio/ConferencePoster]'
  hierarchy:
    parent: c_c94f
  mappings:
  - identifier: http://purl.org/coar/resource_type/c_18co
    scheme: http://purl.org/coar/resource_type/
    relation: exactMatch
  - identifier: http://purl.org/datacite/v4.4/ConferenceProceeding
    scheme: http://purl.org/datacite/v4.4/
    relation: relatedMatch
- id: c_18cp
  title:
    cs: konferenční příspěvek nezahrnutý ve sborníku
    en: conference paper not in proceedings
  description:
    en: 'A paper, typically the realization of a research paper reporting original
      research findings. Use this label when the paper is not published in a proceeding.
      [Source: Adapted from http://purl.org/spar/fabio/ConferencePaper]'
  hierarchy:
    parent: c_c94f
  mappings:
  - identifier: http://purl.org/coar/resource_type/c_18cp
    scheme: http://purl.org/coar/resource_type/
    relation: exactMatch
- id: c_18gh
  title:
    cs: technická zpráva
    en: technical report
  description:
    en: 'A document that describes the process, progress, or results of technical
      or scientific research or the state of a technical or scientific research problem.
      It might also include recommendations and conclusions of the research. [Source:
      http://guides.library.cornell.edu/ecommons/types]'
  hierarchy:
    parent: publication-report
  mappings:
  - identifier: http://purl.org/coar/resource_type/c_18gh
    scheme: http://purl.org/coar/resource_type/
    relation: exactMatch
  - identifier: https://sparontologies.github.io/fabio/current/fabio.html#d4e5659
    scheme: https://sparontologies.github.io/fabio/current/fabio.html#
    relation: exactMatch
- id: c_18ws
  title:
    cs: výzkumná zpráva
    en: research report
  description:
    en: 'It is publication that reports on the findings of a research project or alternatively
      scientific observations on or about a subject. [Source: Adapted from https://en.wikipedia.org/wiki/Research_report]'
  hierarchy:
    parent: publication-report
  mappings:
  - identifier: http://purl.bioontology.org/ontology/MESH/D058028
    scheme: http://purl.bioontology.org/ontology/MESH/
