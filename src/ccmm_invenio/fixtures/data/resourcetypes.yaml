    relation: exactMatch
- id: mw8g-3cr8
  title:
    en: software patent
  description:
    en: 'In order to obtain a patent, a software invention must not fall under other
      non-patentable subject matter (for example, abstract ideas or mathematical theories)
      and has to fulfill the other substantive patentability criteria (for example,
      novelty, inventive step [non-obviousness] and industrial applicability [usefulness]).
      [Source: https://www.wipo.int/patents/en/faq_patents.html]'
