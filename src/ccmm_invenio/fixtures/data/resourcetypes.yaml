- id: 1ytn-rjze
  title:
    en: court documents
  description:
    en: A set of judicial proceedings that record, physically or digitally, and in
      an orderly fashion, the development of a process or procedural actions so that
      they may be recorded and examined by the parties. This would include the set
      of judicial proceedings and any item within that set as a physical or electronic
