- description:
    cs: Odložené zpřístupnění označuje zdroj, který je do určitého data dostupný pouze
      v režimu přístupu k metadatům a teprve poté je uvolněn do otevřeného přístupu.
      Embargo může být vyžadováno politikami vydavatelů a poskytovatelů financování
      nebo stanoveno autorem (např. v případě závěrečných prací a disertací).
    en: Embargoed access refers to a resource that is metadata only access until released
      for open access on a certain date. Embargoes can be required by publishers and
      funders policies, or set by the author (e.g such as in the case of theses and
      dissertations).
  id: c_f1cf
