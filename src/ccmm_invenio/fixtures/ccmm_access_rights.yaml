- id: c_f1cf
  title:
    cs: odložené zpřístupnění
    en: embargoed access
  description:
    cs: Odložené zpřístupnění označuje zdroj, který je do určitého data dostupný pouze
      v režimu přístupu k metadatům a teprve poté je uvolněn do otevřeného přístupu.
      Embargo může být vyžadováno politikami vydavatelů a poskytovatelů financování
      nebo stanoveno autorem (např. v případě závěrečných prací a disertací).
    en: Embargoed access refers to a resource that is metadata only access until released
      for open access on a certain date. Embargoes can be required by publishers and
      funders policies, or set by the author (e.g such as in the case of theses and
      dissertations).
  props:
    iri: https://nma.eosc.cz/vocabularies/accessrights/c_f1cf
    skos:exactMatch:http://purl.org/coar/access_right: c_f1cf
    skos:exactMatch:info:eu-repo/semantics: embargoedaccess
- id: c_abf2
  title:
    cs: otevřený přístup
    en: open access
  description:
    cs: Otevřený přístup označuje zdroj, který je okamžitě a trvale dostupný online
      a volně přístupný všem na webu, bez finančních a technických překážek. Zdroj
      je buď uložen v repozitáři, nebo je na něj odkazováno v externím časopise či
      důvěryhodném archivu.
    en: Open access refers to a resource that is immediately and permanently online,
      and free for all on the Web, without financial and technical barriers.The resource
      is either stored in the repository or referenced to an external journal or trustworthy
      archive.
  props:
    iri: https://nma.eosc.cz/vocabularies/accessrights/c_abf2
    skos:exactMatch:http://purl.org/coar/access_right: c_abf2
    skos:exactMatch:info:eu-repo/semantics: openaccess
- id: c_14cb
  title:
    cs: pouze metadata
    en: metadata only access
  description:
    cs: Přístup pouze k metadatům označuje zdroj, u něhož je přístup omezen pouze
      na metadata. Samotný zdroj je popsán metadaty, není však přímo dostupný prostřednictvím
      systému nebo platformy ani na něj nelze odkazovat prostřednictvím otevřeně přístupné
      kopie v externím časopise nebo důvěryhodném archivu.
    en: Metadata only access refers to a resource in which access is limited to metadata
      only. The resource itself is described by the metadata, but neither is directly
      available through the system or platform nor can be referenced to an open access
      copy in an external journal or trustworthy archive.
  props:
    iri: https://nma.eosc.cz/vocabularies/accessrights/c_14cb
    skos:exactMatch:http://purl.org/coar/access_right: c_14cb
    skos:exactMatch:info:eu-repo/semantics: openaccess
- id: c_16ec
  title:
    cs: omezený přístup
    en: restricted access
  description:
    cs: 'Omezený přístup označuje zdroj, který je v systému dostupný, avšak s určitým
      omezením bránícím plnému otevřenému přístupu. Tento typ přístupu může nastat
      v řadě různých situací. Několik příkladů je uvedeno níže:


      Uživatel se musí pro přístup ke zdroji přihlásit do systému


      Uživatel musí pro přístup ke zdroji zaslat e-mail autorovi nebo správci systému


      Přístup ke zdroji je omezen na konkrétní komunitu (např. pouze na univerzitní
      komunitu)'
    en: 'Restricted access refers to a resource that is available in a system but
      with some type of restriction for full open access. This type of access can
      occur in a number of different situations. Some examples are described below:

      The user must log-in to the system in order to access the resource

      The user must send an email to the author or system administrator to access
      the resource

      Access to the resource is restricted to a specific community (e.g. limited to
      a university community)'
  props:
    iri: https://nma.eosc.cz/vocabularies/accessrights/c_16ec
    skos:exactMatch:http://purl.org/coar/access_right: c_16ec
    skos:exactMatch:info:eu-repo/semantics: restrictedaccess
