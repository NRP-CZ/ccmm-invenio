- description:
    cs: Přístup pouze k metadatům označuje zdroj, u něhož je přístup omezen pouze
      na metadata. Samotný zdroj je popsán metadaty, není však přímo dostupný prostřednictvím
      systému nebo platformy ani na něj nelze odkazovat prostřednictvím otevřeně přístupné
      kopie v externím časopise nebo důvěryhodném archivu.
    en: Metadata only access refers to a resource in which access is limited to metadata
      only. The resource itself is described by the metadata, but neither is directly
      available through the system or platform nor can be referenced to an open access
      copy in an external journal or trustworthy archive.
