      group of dataset, published in the form of a peer-reviewed article in a scholarly
      journal. The main purpose of a data paper is to describe data, the circumstances
      of their collection, and information related to data features, access and potential
      reuse. Adapted from https://en.wikipedia.org/wiki/Data_paper and http://www.gbif.org/publishing-data/data-papers
  hierarchy:
    parent: c_6501
  id: c_beb9
