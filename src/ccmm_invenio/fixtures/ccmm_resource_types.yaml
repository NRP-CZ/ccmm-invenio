    iri: https://nma.eosc.cz/vocabularies/resourcetypes/yz1n-zft9
    skos:exactMatch:http://purl.org/coar/resource_type: YZ1N-ZFT9
  title:
    cs: research protocol
    en: research protocol
- description:
    en: 'A patent granted to anyone who has invented or discovered and asexually reproduced
      any distinct and new variety of plant, including cultivated sports, mutants,
      hybrids, and newly found seedlings, other than a tuber-propagated plant or a
      plant found in an uncultivated state. [Source: Adapted from https://www.uspto.gov/patents/basics/types-patent-applications/general-information-about-35-usc-161#heading-1]'
  hierarchy:
    parent: c_15cd
