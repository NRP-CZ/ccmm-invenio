    en: 'The protocol is a detailed plan of the research study including a project
      summary, project description covering the rationale, objectives, methodology,
      data management and analysis, ethical considerations, gender issues and references.
      [Source: Adapted from https://www.who.int/publications/i/item/a-practical-guide-for-health-researchers]'
  hierarchy:
    parent: c_93fc
  id: yz1n-zft9
