      or exposures on biomedical or health-related outcomes. The two main types of
      clinical studies are interventional studies (clinical trials) and observational
      studies. While most clinical studies concern humans, this publication type may
      be used for clinical veterinary articles meeting the requisites for humans.
      [Source: https://www.ncbi.nlm.nih.gov/mesh/2009830]'
