    en: experimental data
- description:
    en: 'A written record of words spoken in court proceedings or in a speech, interview,
      broadcast, or sound recording. [Source: Adapted from https://products.abc-clio.com/ODLIS/odlis_t.aspx]'
  hierarchy:
