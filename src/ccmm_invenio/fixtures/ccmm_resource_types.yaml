    en: 'Data resulting from modeling or imitative representation of real-world processes,
      events, or systems, often using computer programs. For example, a program modeling
      household consumption responses to indirect tax changes; or a dataset on hypothetical
      patients and their drug exposure, background conditions, and known adverse events.
      [Source: Adapted from https://ddialliance.org/Specification/DDI-CV/ModeOfCollection_3.0.html]'
  hierarchy:
    parent: c_ddb1
