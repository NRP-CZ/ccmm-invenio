    skos:exactMatch:http://purl.org/datacite/v4.4: JournalArticle
  title:
    cs: článek o datové sadě
    en: data paper
- description:
    en: 'A visual representation other than text, including all types of moving image
      and still image. [Source: Adapted from  http://purl.org/dc/dcmitype/Image]'
  hierarchy:
    parent: mediaobject
