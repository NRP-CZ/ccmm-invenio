- description:
    en: 'Any material representing the whole or part of the earth or any celestial
      body at any scale. Cartographic materials include two- and three-dimensional
      maps and plans (including maps of imaginary places); aeronautical, navigational,
      and celestial charts; atlases; globes; block diagrams; sections; aerial photographs
      with a cartographic purpose; bird''s-eye views (map views), etc. [Source: http://www.loc.gov/marc/cfmap.html]'
  hierarchy:
