    skos:exactMatch:http://purl.org/coar/resource_type: c_18cc
  title:
    cs: zvuk
    en: sound
- description:
    en: 'Musical composition can refer to an original piece of music, the structure
      of a musical piece, or the process of creating a new piece of music. [Source:
      https://en.wikipedia.org/wiki/Musical_composition ]'
  hierarchy:
    parent: c_18cc
  id: c_18cd
