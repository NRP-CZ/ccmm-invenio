  title:
    cs: pohyblivý obraz
    en: moving image
- description:
    en: 'A report is a separately published record of research findings, research
      still in progress, policy developments and events, or other technical findings,
      usually bearing a report number and sometimes a grant number assigned by the
      funding agency. Also, an official record of the activities of a committee or
      corporate entity, the proceedings of a government body, or an investigation
      by an agency, whether published or private, usually archived or submitted to
      a higher authority, voluntarily or under mandate. In a more general sense, any
      formal account of facts or information related to a specific event or phenomenon,
      sometimes given at regular intervals. [Source: http://lu.com/odlis/odlis_R.cfm#report
      ]'
  hierarchy:
    parent: c_18cf
