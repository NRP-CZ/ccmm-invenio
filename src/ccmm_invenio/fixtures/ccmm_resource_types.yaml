      ideas or research results, for projection and viewing by an audience at a conference,
      symposium, seminar, lecture, workshop or other gatherings. [Source: Adapted
      from hhttps://sparontologies.github.io/fabio/current/fabio.html#d4e4880]'
  hierarchy:
    parent: c_c94f
