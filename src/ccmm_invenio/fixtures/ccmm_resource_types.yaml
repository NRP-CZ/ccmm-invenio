    en: collection
- description:
    en: 'Physical samples include biological specimens, rock or mineral specimens,
      soil or sediment cores, plants and seeds, water quality samples, archaeological
      artefacts, or DNA and human tissue samples. Samples may be used in analyses
      and can be destroyed in this process, whereas specimens are preserved curated
      objects that can be continuously studied.

      Source: 23 Things Physical Samples https://eprints.gla.ac.uk/309016/1/309016.pdf'
  hierarchy:
    parent: physicalobject
  id: s7r1-k5p0
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/s7r1-k5p0
    skos:exactMatch:http://purl.org/coar/resource_type: S7R1-K5P0
  title:
    cs: physical sample
    en: physical sample
- description:
    en: 'A patent application filed through the WIPO-administered Patent Cooperation
      Treaty (PCT), also known as an international application. [Source: Adapted from
      https://www.wipo.int/edocs/pubdocs/en/wipo_pub_943_2018.pdf]'
  hierarchy:
    parent: c_15cd
  id: sb3y-w4eh
  props:
