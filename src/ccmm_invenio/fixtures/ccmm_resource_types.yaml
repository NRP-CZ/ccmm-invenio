    skos:exactMatch:http://purl.org/coar/resource_type: DX5J-TA9R
  title:
    cs: knowledge synthesis protocol
    en: knowledge synthesis protocol
- description:
    en: 'Data that are used as primary sources to support technical or scientific
      enquiry, research, scholarship, or artistic activity, and that are used as evidence
      in the research process and/or are commonly accepted in the research community
      as necessary to validate research findings and results. [Source: https://casrai.org/term/research-data]'
  id: ehvm-h119
  props:
