  title:
    cs: hudební skladba
    en: musical composition
- description:
    en: 'A resource consisting primarily of words for reading. Examples include books,
      letters, dissertations, poems, newspapers, articles, archives of mailing lists.
      Note that facsimiles or images of texts are still of the genre Text. [Source:
      http://purl.org/dc/dcmitype/Text]'
  id: c_18cf
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18cf
    skos:exactMatch:http://purl.org/coar/resource_type: c_18cf
    skos:exactMatch:http://purl.org/datacite/v4.4: Text
    skos:exactMatch:http://purl.org/dc/dcmitype: Text
  title:
    cs: text
    en: text
- description:
    en: 'A display poster, typically containing text with illustrative figures and/or
      tables, usually reporting research results or proposing hypotheses, submitted
      for acceptance to and/or presented at a conference, seminar, symposium, workshop
      or similar event. Use this label when the poster is not published in a proceeding.
      [Source: http://purl.org/spar/fabio/ConferencePoster]'
  hierarchy:
    parent: c_c94f
  id: c_18co
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18co
    skos:exactMatch:http://purl.org/coar/resource_type: c_18co
  title:
    cs: konferenční poster nezahrnutý ve sborníku
    en: conference poster not in proceedings
- description:
    en: 'A paper, typically the realization of a research paper reporting original
      research findings. Use this label when the paper is not published in a proceeding.
      [Source: Adapted from http://purl.org/spar/fabio/ConferencePaper]'
  hierarchy:
    parent: c_c94f
  id: c_18cp
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18cp
    skos:exactMatch:http://purl.org/coar/resource_type: c_18cp
  title:
    cs: konferenční příspěvek nezahrnutý ve sborníku
    en: conference paper not in proceedings
- description:
    en: 'Symbols used to write music, as in a music score, and to express mathematical
      concepts.

      [Source: Adapted from https://products.abc-clio.com/ODLIS/odlis_n.aspx]'
  hierarchy:
    parent: c_18cf
  id: c_18cw
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18cw
    skos:exactMatch:http://purl.org/coar/resource_type: c_18cw
  title:
    cs: hudební zápis
    en: musical notation
- description:
    en: 'A document that describes the process, progress, or results of technical
      or scientific research or the state of a technical or scientific research problem.
      It might also include recommendations and conclusions of the research. [Source:
      http://guides.library.cornell.edu/ecommons/types]'
  hierarchy:
    parent: c_93fc
  id: c_18gh
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18gh
    skos:exactMatch:http://purl.org/coar/resource_type: c_18gh
    skos:exactMatch:https://sparontologies.github.io/fabio/current: fabio.html#d4e5659
  title:
    cs: technická zpráva
    en: technical report
- description:
    en: 'A report to a funding agency is a document written by beneficiaries of project
      grants. The reporting documents can be e.g. periodic reports about progress
      of scientific and technical work and final report. For deliverables use ‘Project
      deliverable’. [Source: http://ec.europa.eu/research/participants/fp7documents/funding-guide/6_projects/reports/reports_en.htm
      ]'
  id: c_18hj
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18hj
    skos:exactMatch:http://purl.org/coar/resource_type: c_18hj
  title:
    cs: zpráva pro poskytovatele podpory
    en: report to funding agency
- description:
    en: 'A document containing a project report, intended to be delivered to a customer
      or funding agency describing the results achieved within a specific project.
      [Source: https://sparontologies.github.io/fabio/current/fabio.html#d4e5183]'
  hierarchy:
    parent: c_93fc
  id: c_18op
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18op
    skos:exactMatch:http://purl.org/coar/resource_type: c_18op
  title:
    cs: výstup projektu
    en: project deliverable
- description:
    en: 'Other types of report may include Business Plans Technical Specifications,
      data management plans, recommendation reports, white papers, annual reports,
      auditor''s reports, workplace reports, census reports, trip reports, progress
      reports, investigative reports, budget reports, policy reports, demographic
      reports, credit reports, appraisal reports, inspection reports, military reports,
      bound reports, etc. [Source: https://en.wikipedia.org/wiki/Report]'
  id: c_18wq
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18wq
    skos:exactMatch:http://purl.org/coar/resource_type: c_18wq
  title:
    cs: jiná zpráva
    en: other type of report
- description:
    en: 'It is publication that reports on the findings of a research project or alternatively
      scientific observations on or about a subject. [Source: Adapted from https://en.wikipedia.org/wiki/Research_report]'
  hierarchy:
    parent: c_93fc
  id: c_18ws
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18ws
    skos:exactMatch:http://purl.org/coar/resource_type: c_18ws
  title:
    cs: výzkumná zpráva
    en: research report
- description:
    en: An internal report is a record of findings collected for internal use. It
      is not designed to be made public and may include confidential or proprietary
      information.
  id: c_18ww
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18ww
    skos:exactMatch:http://purl.org/coar/resource_type: c_18ww
  title:
    cs: interní zpráva
    en: internal report
- description:
    en: 'A formal note distributed internally to one or more persons in a company,
      agency, organization, or institution, with a header indicating the date it was
      sent and stating to whom it is addressed (To:), from whom it is sent (From:),
      and the subject of the text (Re:). Unlike a letter, a memo does not require
      a full salutation or signature at the end of the text--the sender may simply
      initial his or her name in the header. [Source: https://products.abc-clio.com/ODLIS/odlis_m.aspx#memorandum]'
  hierarchy:
    parent: c_93fc
  id: c_18wz
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/c_18wz
    skos:exactMatch:http://purl.org/coar/resource_type: c_18wz
  title:
    cs: memorandum
    en: memorandum
- description:
    en: 'A periodical is a serial publication with its own distinctive title, characterized
      by a variety of contents and contributors, and issued at regular intervals.
      (Adapted from ODLIS) [Source: http://www.abc-clio.com/ODLIS/odlis_p.aspx]'
  hierarchy:
    parent: text
