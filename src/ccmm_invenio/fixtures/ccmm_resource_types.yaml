    en: bibliography
- description:
    en: 'A moving display, either generated dynamically by a computer program or formed
      from a series of pre-recorded still images imparting an impression of motion
      when shown in succession. [Source: http://purl.org/spar/fabio/MovingImage]'
  hierarchy:
    parent: c_c513
