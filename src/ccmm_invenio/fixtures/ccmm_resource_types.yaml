    cs: kvalifikační práce
    en: thesis
- description:
    en: 'A letter addressed to the editor and comments on or discussed an item previously
      published by that periodical, or of interest to its readership. [Source: Adapted
      from hhttps://sparontologies.github.io/fabio/current/fabio.html#d4e3803]'
  hierarchy:
    parent: c_0640
