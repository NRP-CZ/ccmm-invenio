  title:
    cs: recorded data
    en: recorded data
- description:
    en: 'A commentary is a more in-depth analysis written to draw attention to a work
      already published. Commentaries are somewhat like “reviews” in that the author
      presents his or her analysis of a work and why it  would be of interest to a
      specific audience. [Source: https://www.enago.com/academy/perspective-opinion-and-commentary-pieces]'
  hierarchy:
    parent: c_efa0
