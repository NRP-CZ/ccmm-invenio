    en: An aggregation of resources, which may encompass collections of one resourceType
      as well as those of mixed types. A collection is described as a group; its parts
      may also be separately described. https://datacite-metadata-schema.readthedocs.io/en/4.5/appendices/appendix-1/resourceTypeGeneral/#collection
  id: rmp5-3gq6
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/rmp5-3gq6
