  title:
    cs: measurement and test data
    en: measurement and test data
- description:
    en: In the context of systematic reviews and meta-analyses, a protocol is a document
      that presents an explicit plan for a systematic review. The protocol details
      the rationale and a priori methodological and analytical approach of the review.
      https://www.bmj.com/content/349/bmj.g7647
  hierarchy:
    parent: c_93fc
