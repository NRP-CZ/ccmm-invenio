    en: peer review
- description:
    en: 'Industrial designs are applied to a wide variety of industrial products and
      handicrafts. They refer to the ornamental or aesthetic aspects of a useful article,including
      compositions of lines or colors or any three-dimensional forms that give a special
      appearance to a product or handicraft. [Source: https://www.wipo.int/edocs/pubdocs/en/wipo_pub_943_2018.pdf]'
  hierarchy:
    parent: 542x-3s04
