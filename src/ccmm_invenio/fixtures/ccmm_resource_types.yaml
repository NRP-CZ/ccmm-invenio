    en: 'A collection of related web pages containing text, images, videos and/or
      other digital assets that are addressed relative to a common Uniform Resource
      Locator (URL). A web site is hosted on at least one web server, accessible via
      a network such as the Internet or a private local area network.

      [Source: http://purl.org/spar/fabio/WebSite]'
