    en: 'Data registered by mechanical or electronic means, in a form that allows
      the information to be retrieved and/or reproduced. For example, images or sounds
      on disc or magnetic tape. [Source: Adapted from https://ddialliance.org/Specification/DDI-CV/ModeOfCollection_3.0.html]'
  hierarchy:
