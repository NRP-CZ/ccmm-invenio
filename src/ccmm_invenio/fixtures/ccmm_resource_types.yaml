    skos:exactMatch:http://purl.org/coar/resource_type: EHVM-H119
  title:
    cs: research data
    en: research data
- description:
    en: 'A work of visual arts and performing arts, including musical works; dramatic
      works; pantomimes and choreographic works; motion picture and other audiovisual
      works; pictorial, graphic, sculptural and architectural works. Adapted from
      Law Insider: https://www.lawinsider.com/dictionary/artistic-works'
  hierarchy:
    parent: creativework
  id: f8rt-tjk0
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/f8rt-tjk0
    skos:exactMatch:http://purl.org/coar/resource_type: F8RT-TJK0
  title:
    cs: artistic work
    en: artistic work
- description:
    en: 'Data resulting from observational research, which involves collecting observations
      as they occur (for example, observing behaviors, events, development of condition
      or disease, etc.), without attempting to manipulate any of the independent variables.
      [Source:  Adapted from https://ddialliance.org/Specification/DDI-CV/ModeOfCollection_3.0.html]'
  hierarchy:
    parent: c_ddb1
  id: ff4c-28rk
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/ff4c-28rk
    skos:exactMatch:http://purl.org/coar/resource_type: FF4C-28RK
  title:
    cs: observational data
    en: observational data
- description:
    en: 'Data collected or assembled from multiple, often heterogeneous sources that
      have one or more reference points in common, and at least one of the sources
      was originally produced for other purposes. The data are incorporated in a new
      entity. For example, providing data on the number of universities in the last
      150 years using a variety of available sources (e.g. finance documents, official
      statistics, university registers), combining survey data with information about
      geographical areas from official statistics (e.g. population density, doctors
      per capita, etc.), or using RSS to collect blog posts or tweets, etc. [Source:
      Adapted from https://ddialliance.org/Specification/DDI-CV/ModeOfCollection_3.0.html]'
  hierarchy:
    parent: c_ddb1
  id: fxf3-d3g7
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/fxf3-d3g7
    skos:exactMatch:http://purl.org/coar/resource_type: FXF3-D3G7
  title:
    cs: compiled data
    en: compiled data
- description:
    en: 'Plant variety protection, also called a "plant breeder''s right" (PBR), is
      a form of intellectual property right granted to the breeder of a new plant
      variety . According to this right, certain acts concerning the exploitation
      of the protected variety require the prior authorization of the breeder. Plant
      variety protection is an independent sui generis form of protection, tailored
      to protect new plant varieties and has certain features in common with other
      intellectual property rights. [Source: https://www.wipo.int/edocs/pubdocs/en/wipo_pub_943_2018.pdf]'
  hierarchy:
    parent: c_15cd
  id: gpq7-g5ve
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/gpq7-g5ve
    skos:exactMatch:http://purl.org/coar/resource_type: GPQ7-G5VE
  title:
    cs: plant variety protection
    en: plant variety protection
- description:
    en: All types of schemes for organizing information and promoting knowledge management.
      Knowledge organization systems include classification schemes that organize
      materials at a general level (such as books on a shelf), subject headings that
      provide more detailed access, and authority files that control variant versions
      of key information (such as geographic names and personal names). They also
      include less-traditional schemes, such as semantic artifacts, semantic networks
      and ontologies. https://www.clir.org/pubs/reports/pub91/1knowledge/
  id: gsza-y7v7
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/gsza-y7v7
    skos:exactMatch:http://purl.org/coar/resource_type: GSZA-Y7V7
  title:
    cs: knowledge organization system
    en: knowledge organization system
- description:
    en: 'A laboratory notebook (colloq. lab notebook or lab book) is a primary record
      of research. Researchers use a lab notebook to document their hypotheses, experiments
      and initial analysis or interpretation of these experiments. This label is used
      both for traditional and electronic laboratory notebook. [Source: Adapted from
      https://en.wikipedia.org/wiki/Lab_notebook]'
  hierarchy:
    parent: c_ddb1
  id: h41y-fw7b
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/h41y-fw7b
    skos:exactMatch:http://purl.org/coar/resource_type: H41Y-FW7B
  title:
    cs: laboratory notebook
    en: laboratory notebook
- description:
    en: 'A sign used to distinguish the goods or services of one undertaking from
      those

      of others. A trademark may consist of words and combinations of words (for

      instance, names or slogans), logos, figures and images, letters, numbers,

      sounds, or, in rare instances, smells or moving images, or a combination thereof.
      [Source: https://www.wipo.int/trademarks/en]'
  id: h6qp-sc1x
