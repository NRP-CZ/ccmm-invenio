    cs: layout design
    en: layout design
- description:
    en: 'A patent granted to any person who has invented any new and non-obvious ornamental
      design for an article of manufacture. The design patent protects only the appearance
      of an article, but not its structural or functional features. [Source: Adapted
      from https://www.uspto.gov/patents/basics/types-patent-applications/design-patent-application-guide#def]'
