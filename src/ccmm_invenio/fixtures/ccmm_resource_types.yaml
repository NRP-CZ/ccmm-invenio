    cs: encoded data
    en: encoded data
- description:
    en: "Layout-design (topography) means the three-dimensional disposition, however\
      \ expressed, of \nthe elements of an integrated circuit (at least one of which\
      \ is an active element) and of some or all of the interconnections of an integrated\
      \ circuit, or such a three-dimensional disposition prepared for \nan integrated\
      \ circuit intended for manufacture [Source: https://www.wipo.int/edocs/lexdocs/laws/en/hk/hk028en.pdf]"
