      text with illustrative figures and/or tables, usually reporting research results
      or proposing hypotheses, submitted for acceptance to and/or presented at a conference,
      seminar, symposium, workshop or similar event. [Source: Adapted https://sparontologies.github.io/fabio/current/fabio.html#d4e2648]'
