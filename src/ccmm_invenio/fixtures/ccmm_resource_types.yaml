  title:
    cs: industrial design
    en: industrial design
- description:
    en: 'In order to obtain a patent, a software invention must not fall under other
      non-patentable subject matter (for example, abstract ideas or mathematical theories)
      and has to fulfill the other substantive patentability criteria (for example,
      novelty, inventive step [non-obviousness] and industrial applicability [usefulness]).
      [Source: https://www.wipo.int/patents/en/faq_patents.html]'
  hierarchy:
    parent: c_15cd
  id: mw8g-3cr8
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/mw8g-3cr8
    skos:exactMatch:http://purl.org/coar/resource_type: MW8G-3CR8
  title:
    cs: software patent
    en: software patent
- description:
    en: 'Data resulting from a survey, which is defined as an investigation about
      the characteristics of a given population by means of collecting data from a
      sample of that population and estimating their characteristics through the systematic
      use of statistical methodology. Included are censuses, sample surveys, the collection
      of data from administrative records and derived statistical activities as well
      as questionnaires. [Source: Adapted from https://stats.oecd.org/glossary/detail.asp?ID=2620]'
  hierarchy:
    parent: c_ddb1
  id: nhd0-w6sy
  props:
    iri: https://nma.eosc.cz/vocabularies/resourcetypes/nhd0-w6sy
    skos:exactMatch:http://purl.org/coar/resource_type: NHD0-W6SY
  title:
    cs: survey data
    en: survey data
- description:
    en: 'Source code is any collection of code, with or without comments, written
      using a human-readable programming language, usually as plain text. [Source:
      https://en.wikipedia.org/wiki/Source_code]'
  hierarchy:
    parent: c_5ce6
