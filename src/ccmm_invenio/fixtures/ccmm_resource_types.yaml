    en: report part
- description:
    en: 'A research proposal is a document proposing a research project, generally
      in the sciences or academia, and generally constitutes a request for sponsorship
      of that research. [Source: https://en.wikipedia.org/wiki/Research_proposal]'
  hierarchy:
