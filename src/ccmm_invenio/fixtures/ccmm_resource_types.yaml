    skos:exactMatch:http://nmrML.org: nmrCV#NMR:1000221
    skos:exactMatch:http://purl.org/coar/resource_type: W2XT-7017
  title:
    cs: simulation data
    en: simulation data
- description:
    en: 'A collection of historical records and primary source documents. Documents
      may be tangible or digital. Adapted from “archive (groupings)” in Getty AAT:
      https://www.getty.edu/vow/AATFullDisplay?find=maiolica&logic=AND&note=&subjectid=300375748'
  hierarchy:
    parent: rmp5-3gq6
