  title:
    cs: zpráva k politice nebo strategii
    en: policy report
- description:
    en: 'A resource primarily intended to be heard. Examples include a music playback
      file format, an audio compact disc, and recorded speech or sounds. [Source:
      http://dublincore.org/documents/dcmi-terms/#dcmitype-Sound]'
  hierarchy:
    parent: mediaobject
