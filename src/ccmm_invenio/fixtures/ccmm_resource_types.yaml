    skos:exactMatch:http://purl.org/coar/resource_type: D97F-VB57
  title:
    cs: commentary
    en: commentary
- description:
    en: 'Data resulting from assessing specific properties (or characteristics) of
      beings, things, phenomena, (and/ or processes) by applying pre-established standards
      and/or specialized instruments or techniques. [Source: Adapted from  https://ddialliance.org/Specification/DDI-CV/ModeOfCollection_3.0.html]'
  hierarchy:
    parent: c_ddb1
