      Java Servlets, Java classes, XML files, tag libraries, static web pages and
      other resources that together constitute a web application.
  props:
    iri: https://nma.eosc.cz/vocabularies/filetypes/war
    skos:exactMatch:http://publications.europa.eu/resource/authority/file-type: WAR
