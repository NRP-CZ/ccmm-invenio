  description:
    en: An StL (‘StereoLithography’) file is a triangular representation of a 3-dimensional
      surface geometry. The surface is tessellated or broken down logically into a
      series of small triangles (facets). Each facet is described by a perpendicular
      direction and three points representing the vertices (corners) of the triangle.
      These data are used by a slicing algorithm to determine the cross sections of
      the 3-dimensional shape to be built by the fabber. The StL standard includes
      two data formats, ASCII and binary.
  id: stl
