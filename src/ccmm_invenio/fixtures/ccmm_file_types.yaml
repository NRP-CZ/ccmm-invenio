    iri: https://nma.eosc.cz/vocabularies/filetypes/xlsm
    skos:exactMatch:http://publications.europa.eu/resource/authority/file-type: XLSM
- id: swm
  title:
    cs: SWM
    en: SWM
  description:
    en: Split WIM file is a Windows Imaging Format file that has been split into multiple
      parts.
  props:
    iri: https://nma.eosc.cz/vocabularies/filetypes/swm
    skos:exactMatch:http://publications.europa.eu/resource/authority/file-type: SWM
- id: kmz
  title:
    cs: KMZ
    en: KMZ
  description:
    en: A KMZ file consists of a main KML file and zero or more supporting files that
      are packaged using a Zip utility into one unit, called an archive. The KMZ file
      can then be stored and emailed as a single entity. A NetworkLink can fetch a
      KMZ file from a web server. When the KMZ file is unzipped, the main .kml file
      and its supporting files are separated into their original formats and directory
      structure, with their original filenames and extensions. In addition to being
      an archive format, the Zip format is also compressed, so an archive can include
      only a single large KML file. Depending on the content of the KML file, this
      process typically results in 10:1 compression. Your 10 Kbyte KML file can be
      served with a 1 Kbyte KMZ file.
  props:
    iri: https://nma.eosc.cz/vocabularies/filetypes/kmz
    skos:exactMatch:http://publications.europa.eu/resource/authority/file-type: KMZ
- id: azw
  title:
    cs: Amazon Kindle eBook
    en: Amazon Kindle eBook
  description:
    en: AZW Kindle File Format is a proprietary e-book file format created by Amazon.com
      that can be downloaded and read on devices like smartphones, tablets, computers
      or e-readers that have Amazon's Kindle application.
  props:
    iri: https://nma.eosc.cz/vocabularies/filetypes/azw
    skos:exactMatch:http://publications.europa.eu/resource/authority/file-type: AZW
- id: mhtml
  title:
    cs: MHTML
    en: MHTML
  description:
    en: MHTML – MIME Encapsulation of Aggregate HTML Documents – is a web page archive
      format used to combine in a single document the HTML code and its companion
      resources that are otherwise represented by external links (such as images,
      Flash animations, Java applets and audio files). The content of an MHTML file
      is encoded as if it were an HTML e-mail message.
  props:
    iri: https://nma.eosc.cz/vocabularies/filetypes/mhtml
    skos:exactMatch:http://publications.europa.eu/resource/authority/file-type: MHTML
- id: txt
  title:
    cs: Plain text
    en: Plain text
  description:
    en: Plain text is the data (e.g. file contents) that represent only characters
      of readable material but not its graphical representation nor other objects.
      It may also include a limited number of characters that control simple arrangement
      of text, such as line breaks or tabulation characters. Plain text is different
      from formatted text, where style information is included, and from ‘binary files’
      in which some portions must be interpreted as binary objects (encoded integers,
      real numbers, images, etc.).
  props:
    iri: https://nma.eosc.cz/vocabularies/filetypes/txt
    skos:exactMatch:http://publications.europa.eu/resource/authority/file-type: TXT
- id: rdf_n_quads
  title:
    cs: RDF N-Quads
    en: RDF N-Quads
  description:
    en: N-Quads is a line-based, plain text format for encoding an RDF dataset. N-quads
      statements are a sequence of RDF terms representing the subject, predicate,
      object and graph label of an RDF Triple and the graph it is part of in a dataset.
  props:
    iri: https://nma.eosc.cz/vocabularies/filetypes/rdf_n_quads
    skos:exactMatch:http://publications.europa.eu/resource/authority/file-type: RDF_N_QUADS
- id: pps
  title:
    cs: PowerPoint Slide Show
    en: PowerPoint Slide Show
  description:
    en: PPS – PowerPoint 97–2003 binary slide show – is a binary filaname extension
      of Microsoft PowerPoint presentation program. PowerPoint was originally designed
      to provide visuals for group presentations within business organizations, but
      has come to be very widely used in many other communication situations, both
      in business and beyond.
  props:
    iri: https://nma.eosc.cz/vocabularies/filetypes/pps
    skos:exactMatch:http://publications.europa.eu/resource/authority/file-type: PPS
- id: lzo
