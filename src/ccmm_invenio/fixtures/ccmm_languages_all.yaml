  title:
    cs: Kimbundu
    en: Kimbundu
  description:
    en: Kimbundu is a narrow Bantu language spoken in the north-west of Angola. It
      is the second-most-widely-spoken Bantu language in Angola. Together with Mpinda
      (pnd) and Kibala (blv), it belongs to the Mbundu group, which is classified
      within the Volta-Congo primary branch. Like other Bantu languages, Mpinda has
      a noun class system, a characteristic feature of languages belonging to the
      Atlantic–Congo lineage, the largest demonstrated language family in Africa.
