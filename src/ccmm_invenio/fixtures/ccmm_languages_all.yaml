      of the Northwestern Iranian languages. The Shabaki language is spoken by the
      Shabak people in the Mosul region of northern Iraq. It is a subdialect of the
      Kurdish dialect Gorani alongside Hewrami, Sarli, and Bajalan. It also been influenced
      by Arabic, Turkish and Persian language.
