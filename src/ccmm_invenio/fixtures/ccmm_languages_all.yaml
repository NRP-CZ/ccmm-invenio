- description:
    en: Warungu, also known as Gudjal, is a dormant Australian Aboriginal language
      that was spoken by the Warungu people in the area around Townsville, Queensland.
      Its last native speaker was Alf Palmer, who died in 1981. One of the notable
      feature of the language is its syntactic ergativity. Warungu is closely related
      to Gugu Badhun (gdc), and both belong to the Maric group of languages within
      the Pama–Nyungan language family, the most widespread family of Australian Aboriginal
      languages, comprising over 300 of the approximately 400 Aboriginal languages
      of Australia.
