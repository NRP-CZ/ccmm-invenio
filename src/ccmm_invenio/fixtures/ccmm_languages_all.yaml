    en: Warungu
- description:
    en: Wiradjuri is an endangered Australian Aboriginal language traditionally spoken
      by the Wiradjuri people of New South Wales. A revival is under way, with the
      language being taught in schools, TAFE college, and at Charles Sturt University.
      Wiradjuri is closely related to Wangaaybuwan-Ngiyambaa (wyb). Together, they
      form the Wiradhuric sub-group within the Pama–Nyungan language family, the most
      widespread family of Australian Aboriginal languages, comprising over 300 of
      the approximately 400 Aboriginal languages of Australia.
