      century, roughly coinciding with the High and Late Middle Ages. The Middle English
      dialects displaced the Old English dialects under the influence of Anglo-Norman
      French and Old Norse, and were in turn replaced in England by Early Modern English.
      During the Middle English period, many Old English grammatical features either
      became simplified or disappeared altogether. Like English, Middle English is
      classified as a Western Germanic language within the Indo-European language
      family.
