    en: 'Ngyian (also known as Nghan, Hausa: Kamantan, Jju: Byrok, Tyap: Byoot), is
      a Plateau language of Nigeria. It is spoken by the Anghan people in Zangon Kataf
      and Kachia LGAs of southern Kaduna State, in the Middle Belt area of Nigeria.
      It belongs to the Volta-Congo sub-branch. Like related Bantu and Bantoid languages,
      Ngyian has a noun class system, a characteristic feature of languages belonging
      to the Atlantic–Congo lineage, the largest demonstrated language family in Africa.'
