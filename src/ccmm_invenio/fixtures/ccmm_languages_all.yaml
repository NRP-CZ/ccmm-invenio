- description:
    en: Dawik Kui is a South-Central Dravidian language spoken by the Kandhas in Gajapati
      district of Odisha in eastern India. It is mostly written in the Odia script.
      It is closely related to Kui (ULI). Together, According to data reported in
      the 1991 Indian census, Dawik Kui and Kui had approximately 940 000 native speakers,
      ranking among the thirty most widely spoken languages in India at the time.
      Like more closely related Kuvi and more distant Gondi and Telugu, it belongs
      to the Dravidian language family spoken by 250 million people, primarily in
      South India, north-east Sri Lanka, and south-west Pakistan.
