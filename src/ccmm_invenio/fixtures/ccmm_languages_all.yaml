      elderly people (2021), who live in and around Pine Creek, in the Katherine Region
      of the Northern Territory. The Wagiman language is notable for its complex system
      of verbal morphology, which remains under-investigated, its possession of a
      cross-linguistically rare part of speech called a coverb, its complex predicates
      and for its ability to derive verbs from coverb roots, which is a unique feature
      among Australian languages. Wagiman is a language isolate, but may still bear
      a remote relation with its neighbouring languages but this is yet to be demonstrated.
