      language historically spoken by the Klallam people at Beecher Bay on Vancouver
      Island in British Columbia and across the Strait of Juan de Fuca on the north
      coast of the Olympic Peninsula in Washington. The last native speaker of Klallam
      as a first language died in 2014, but there is a growing group of speakers of
      Klallam as a second language. Klallam is closely related to the Northern Straits
      Salish dialects, Sooke, Lekwungen, Saanich, Lummi, and Samish.
