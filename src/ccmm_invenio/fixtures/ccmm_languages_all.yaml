- id: oak
  title:
    cs: Noakhali
    en: Noakhali
  description:
    en: Noakhali is an Indo-Aryan language spoken by an estimated 7 million people,
      primarily in the Greater Noakhali region of Bangladesh, as well as in southern
      parts of Tripura in India. Unlike Standard Bengali (Bangla), it has no official
      recognition and is not used in courts or legislative bodies. Together with Bengali
      and other local varieties, Noakhali belongs to the Gauda–Banga sub-group, which
      is classified within the Indo-Aryan branch of the Indo-Iranian primary branch.
      As an Indo-Iranian language, it ultimately forms part of the Indo-European language
      family, the world’s largest by number of native speakers.
