      spoken by the Wanyi people of the lower gulf area of Northern Queensland. Although
      earlier thought to be extinct, as of the 2016 Australian census, there were
      16 speakers of the language. Together with the closely related Garrwa language,
      Wanyi and Garrwa are not currently classified within any larger Aboriginal language
      family; instead they form their own Garrwan language family.
  id: wny
