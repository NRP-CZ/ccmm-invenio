- description:
    en: Iron Ossetic or Iron Ossetian or simply Iron, Ossetic or Ossetian, is a member
      of the Iranian subgroup of the Indo-European languages, the world’s largest
      language family by number of native speakers. Iron Ossetic is spoken in Ossetia,
      a region on the northern Caucasus. The majority of Ossetians speak Iron, notably
      in the east, south and central parts of North Ossetia–Alania, while in the west
      the Digor dialect is more prevalent. The Iron dialect has been the basis of
      the Ossetian written language since the abolition of the Digor standard in 1939.
