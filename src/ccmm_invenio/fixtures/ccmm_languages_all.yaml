    en: Martu Wangka
  description:
    en: Martu Wangka is a variety of the Western Desert languages that emerged during
      the 20th century in Western Australia as several Indigenous communities shifted
      from their respective territories to form a single community. It is spoken around
      Jigalong and across the Gibson, Little Sandy and Great Sandy deserts. Martu
      Wangka is also a Wati language. The name Wati tends to be used when considering
      the various varieties to be distinct languages, Western Desert when considering
      them dialects of a single language. More broadly, Wati languages belong to the
      Pama–Nyungan languages, the most widespread family of Australian Aboriginal
      languages, comprising over 300 of Australia’s roughly 400 Aboriginal languages.
