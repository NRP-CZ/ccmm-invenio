- description:
    en: Taivoan, or Taivuan, is a dormant Formosan language under revitalisation.
      It was spoken in the Siraya region of Taiwan. Taivoan used to be regarded as
      a dialect of Siraya, but now more evidence has shown that they should be classified
      as separate languages. Taivoan belongs to the East Formosan primary branch of
      the Austronesian language family. Like many Austronesian languages, Taivoan
      is characterised by voice alternations in its clause structure and productive
      morphology, including affixation and reduplication to form new words.
