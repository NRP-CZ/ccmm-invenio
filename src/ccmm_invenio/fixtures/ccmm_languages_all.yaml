- id: dif
  title:
    cs: Dieri
    en: Dieri
  description:
    en: Dieri is a Pama-Nyungan language within the Karnic sub-branch. It is spoken
      by the Diyari people in the far north of South Australia, to the east of Lake
      Eyre. It was studied by German Lutheran missionaries who translated Christian
      works into the language in the late 19th and early 20th centuries, so that it
      developed an extensive written form. It also had a highly developed sign language,
      and one of the functions was to allow women to communicate during mourning,
      when a speech taboo prevailed. The Pama–Nyungan languages are the most widespread
      family of Australian Aboriginal languages, comprising over 300 of the approximately
      400 Aboriginal languages of Australia.
  props:
