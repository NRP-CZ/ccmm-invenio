    en: Dazaga
  description:
    en: Dazaga (also known as Daza) belongs to the Saharan primary branch of the putative
      Nilo-Saharan language family. It is spoken by the Daza people in northern Chad
      and eastern Niger. Within the Saharan branch – which also includes the Kanuri,
      Kanembu, and Tebu languages – Dazaga is classified as part of the Western Saharan
      subgroup. The constituent families of Nilo-Saharan are quite diverse. One characteristic
      feature is a tripartite singulative-collective-plurative number system.
