- description:
    en: The Sami languages, also rendered in English as Sámi and Saami, are a group
      of Uralic languages spoken by the indigenous Sami people of Northern Europe
      (in parts of northern Finland, Norway, Sweden, and the far northwest of Russia).
      There are, depending on the nature and terms of division, approximately nine
      living Sami languages, and much more if extinct varieties are included. The
      exonym Lappish is now often considered pejorative. The Sami languages form a
      dialect continuum in which the neighbouring languages are often intelligible
      to a fair degree, but two more widely separated varieties are not. There are,
      however, some sharp language boundaries, in particular between Northern Sami,
      Inari Sami and Skolt Sami whose traditional speech areas meet in Finland.
  id: smi
  props:
    ISO_639_2B: smi
    ISO_639_2T: smi
