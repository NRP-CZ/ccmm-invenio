- id: adt
  title:
    cs: Adnyamathanha
    en: Adnyamathanha
  description:
    en: Adnyamathanha is a Pama-Nyungan language spoken in the northern Flinders Ranges
      in South Australia. The ethnonym Adnyamathanha was an alternative name for the
      Wailpi but the contemporary grouping often includes the Guyani, Jadliaura, Pilatapa,
      and sometimes the Barngarla peoples. The origin of the name is in the words
      ’adnya’ (’rock’) and ’matha’ (’group’). Adnyamathanha is classified within the
      Arandic-Thura-Yura primary branch of the Pama–Nyungan language family, the most
      widespread family of Australian Aboriginal languages, comprising over 300 of
      the approximately 400 Aboriginal languages of Australia.
  props:
    iri: https://nma.eosc.cz/vocabularies/languages/adt
