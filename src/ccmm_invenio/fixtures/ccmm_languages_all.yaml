- description:
    en: Nganyaywana is an extinct Pama-Nyungan language, once spoken in the Macleay
      Valley in New South Wales, Australia. Nganyaywana is closely related to Dyangadi,
      and both have been called the Macleay Valley languages. The Pama–Nyungan languages
      are the most widespread family of Australian Aboriginal languages, comprising
      over 300 of the approximately 400 Aboriginal languages of Australia.
