- description:
    en: Rāziḥī is a possible descendant of Ancient South Arabian and is spoken by
      about 63 000 people in the vicinity of Mount Razih in the northwestern corner
      of Yemen. Along with Faifi and Rijal Alma, it is possibly one of the few surviving
      descendants of the Sayhadic branch and the Ancient South Arabian languages Hadrami,
