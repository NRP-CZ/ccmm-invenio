- description:
    en: Garrwa, also spelt Karawa, is an endangered Australian Aboriginal language
      spoken by the Garrwa people in the Northern Territory, whose traditional lands
      extended from east of the McArthur River at Borroloola to Doomadgee and the
      Nicholson River in Queensland. Together with the closely related Wanyi language,
      Garrwa and Wanyi are not currently classified within any larger Aboriginal language
