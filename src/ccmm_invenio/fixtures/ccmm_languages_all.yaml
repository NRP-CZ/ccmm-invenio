- description:
    en: Kuuk Thayorre, also known as Thayore, is a stable Pama-Nyungan language spoken
      in the settlement Pormpuraaw on the western part of the Cape York Peninsula
      in Queensland, Australia. It is thought to be related to the extinct Kuuk-Yak
      language. Kuuk Thayorre is classified within the Paman branch and more specifically
      within the Southwest Pama sub-branch. The Pama–Nyungan languages are the most
      widespread family of Australian Aboriginal languages, comprising over 300 of
      the approximately 400 Aboriginal languages of Australia.
