    en: Karelian
  description:
    en: 'Karelian (Livvi: karjala, Ludian: kard''al; Tver: kariela) is a Finnic language
      spoken mainly by the Karelian people in the Russian Republic of Karelia. Karelian
      is closely related to the Finnish dialects spoken in eastern Finland. Karelian
      is a group of two supradialects: Karelian Proper (which comprises Northern Karelian
      and Southern Karelian (including the Tver enclave dialects)) and Olonets Karelian
      (Livvi Karelian). The Ludic language is sometimes considered one more dialect
      of Karelian, sometimes a separate language. All variants are written with the
      Latin-based Karelian alphabet. Like all Finnic languages, Karelian belongs to
      the Uralic language family.'
