- description:
    en: Nyungar is a dormant Australian Aboriginal language spoken in the south-west
      corner of Western Australia, from Geraldton on the west coast to Esperance on
      the south coast. There are 14 different groups in the Nyungar cultural bloc.
      They descend from people who spoke several languages and dialects that were
      often mutually intelligible. What is now classified as the Nyungar language
      is a member of the large Pama–Nyungan language family. Contemporary Nyungar
      speak Australian Aboriginal English laced with Nyungar words and occasionally
      inflected by its grammar.
