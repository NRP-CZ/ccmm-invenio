      of Far North Queensland, Australia. Most of the speakers today live at the community
      of Hope Vale, not far from Cooktown. Guugu Yimithirr is the source language
      of the word kangaroo (gangurru). It is more closely related to Yalandyic and
      Yidinic languages. Pama–Nyungan language family is the most widespread family
