    en: Sami languages
- description:
    en: Lule Sami (julevsámegiella) is one of the Sami languages. It was originally
      only spoken around the Lule River, in Sweden. During the 18th century some Sami
      migrated to Nordland in Norway, and their descendants still live in Norway,
      and speak Lule Sami. In Norway, in Hamarøy Municipality, Lule Sami is one of
      the official languages. Like Baltic-Finnic languages, Sami languages are a branch
      of the Uralic language family.
