- description:
    en: Icelandic is an Indo-European language belonging to the North Germanic or
      Nordic branch of the Germanic languages. The vast majority of Icelandic speakers
      live in Iceland. Most Icelanders do not have surnames but patronymics. Forenames
      are followed by the genitive form of the father’s (or the mother’s) Christian
      name completed by son (son of …) or dóttir (daughter of …), e.g. Jónsson, Jónsdóttir
      if the name of the father is Jón.
