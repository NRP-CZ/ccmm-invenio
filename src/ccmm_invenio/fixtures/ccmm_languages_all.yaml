- description:
    en: Riang Lai is a Palaungic language of Myanmar. It belongs to the Austro-Asiatic
      language family. Speakers are culturally assimilated with the Karen, but are
      Palaung by ancestry and their language is unrelated. Riang Lai (Yinchia) and
      Riang Lang (Yinnet) are sometimes considered distinct languages, sometimes the
      same language. Like many Austroasiatic languages, Palaungic languages are characterised
      by prefixation in its clause structure and larger than average vowel inventories.
