- description:
    en: Bolo is a narrow Bantu language spoken in Angola. The only name for the language
      as a whole, 'Ngoya', was originally pejorative, though it is becoming increasingly
      accepted. 'Kibala' is the Umbundu name for the central dialect, Ipala. 'Bolo'
      is a peripheral dialect. Together with Mpinda (pnd) and Kimbundu (kmb), it belongs
      to the Mbundu group, which is classified within the Volta-Congo primary branch.
      Like other Bantu languages, Bolo has a noun class system, a characteristic feature
      of languages belonging to the Atlantic–Congo lineage, the largest demonstrated
      language family in Africa.
