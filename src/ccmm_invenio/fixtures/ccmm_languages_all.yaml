- id: zsm
  title:
    cs: standardní malajština
    en: Standard Malay
  description:
    en: Standard Malay is the official language of Malaysia and a standardised register
      of the Malacca dialect of Malay. It is a compulsory subject in primary and secondary
      school. The Malaysian name for the language is Bahasa Malaysia (literally ‘the
      language of Malaysia’). Standard Malay is normally written using a Latin alphabet
      called Rumi, though an Arabic alphabet called Jawi also exists. Malaysian is
      an Austronesian language that belongs to the Malayo-Polynesian branch. Austronesian
      languages often possess phoneme inventories smaller than the world average.
      Two salient morphological characteristics are a system of affixation and reduplication
      to form new words.
