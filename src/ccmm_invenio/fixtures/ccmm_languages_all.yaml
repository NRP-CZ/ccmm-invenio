    en: Oli-Bodiman is an Southern Bantoid language spoken in Yabassi commune in Cameroon.
      Together with Bengaic languages (BNG, BNM, NUI, YKO) and Dualaic languages (DUA,
      MZD, KME, ISU), it belongs to the Sawabantu group, which is classified within
      the Volta-Congo primary branch. Like other Bantu languages, Oli-Bodiman has
      a noun class system, a characteristic feature of languages belonging to the
      Atlantic–Congo lineage, the largest demonstrated language family in Africa.
