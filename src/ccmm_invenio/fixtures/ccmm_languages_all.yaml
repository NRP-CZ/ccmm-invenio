      Sami languages. It is spoken in the northern parts of Norway, Sweden and Finland.
      In Norway, Northern Sami is currently an official language in several municipalities
      in Finnmark and Troms counties. In Sweden, it is an official language in 18
      counties. Like neighbouring Baltic-Finnic languages, Sami languages are a branch
      of the Uralic language family.
