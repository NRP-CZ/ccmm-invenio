- id: djd
  title:
    cs: Djamindjung
    en: Djamindjung
  description:
    en: Djamindjung, or Jaminjung, is an endangered Australian Aboriginal language
      within the Yirram sub-branch, spoken around the Victoria River in the Northern
      Territory of Australia. There seems to be a steady increase in the number of
      speakers of the language with very few people speaking the language in 1967,
      about 30 speakers in 1991, and between 50 and 150 speakers in 2000. Djamindjung
      is not related to the Pama-Nyungan language family that spans the majority of
      Australia; however, it is a relative of Nungali. Both belong to the Mirndi language
      family.
  props:
    iri: https://nma.eosc.cz/vocabularies/languages/djd
