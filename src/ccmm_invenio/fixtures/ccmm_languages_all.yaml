    en: Swampy Cree (variously known as Maskekon, Maskegon and Omaškêkowak, and often
      anglicized as Omushkego) is a variety of the Cree macrolanguage. It is spoken
      in a series of Swampy Cree communities in northern Manitoba, central northeast
      of Saskatchewan along the Saskatchewan River and along the Hudson Bay coast
      and adjacent inland areas to the south and west, and Ontario along the coast
      of Hudson Bay and James Bay. Like other Cree varieties, Moose Cree is classified
      under the Algonquian branch of the Algic language family.
