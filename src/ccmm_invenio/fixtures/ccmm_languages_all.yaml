    en: Kui, also Kandha, Khondi, Khond, Khondo, Kanda, Kodu, Kodulu, Kuinga, is a
      South-Central Dravidian language spoken by the Kandhas in Odisha eastern India,
      and specifically in the Kandhamal district. It is mostly written in the Odia
      script. Kui is closely related to Dawik Kui. According to data reported in the
      1991 Indian census, Kui and Dawik Kui had approximately 940 000 native speakers,
      ranking among the thirty most widely spoken languages in India at the time.
      Like more closely related Kuvi and more distant Gondi and Telugu, it belongs
      to the Dravidian language family spoken by 250 million people, primarily in
      South India, north-east Sri Lanka, and south-west Pakistan.
