- description:
    en: Digor Ossetic (often simply referred to as Digor) is the less commonly spoken
      variety of the two Ossetic languages, with the other being Iron Ossetic. Digor
      is spoken in the western regions of the Republic of North Ossetia and in neighbouring
      Kabardino-Balkaria. Both Ossetic languages, along with Yaghnobi and the extinct
      Sogdian, are part of the Eastern Iranian subgroup within the Indo-European language
      family. Digor Ossetic uses the Cyrillic script.
