  description:
    en: Mirning (Mirniny) is a Pama–Nyungan language of Western Australia. Murunitja
      was apparently a dialect of either Mirning or of its sister language Ngadjunmaya.
      The Pama–Nyungan languages are the most widespread family of Australian Aboriginal
      languages, comprising 306 of the 400 Aboriginal languages of Australia. Like
      the vast majority of Australian languages, also Mirning is morphologically ergative,
      with the nominal in the agent role marked with an ergative suffix and the subject
      and object unmarked.
