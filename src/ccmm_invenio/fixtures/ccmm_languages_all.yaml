      with Ngul (also Ngwii), Lwel and Nzadi, it belongs to the West-Coastal Bantu
      group, which is classified within the Volta-Congo branch. Like other Bantu languages,
      Ding has a noun class system, a characteristic feature of languages belonging
      to the Atlantic–Congo lineage, the largest demonstrated language family in Africa.
