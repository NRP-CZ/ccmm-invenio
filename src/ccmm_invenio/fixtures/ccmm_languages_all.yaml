- description:
    en: The Manding languages are mutually intelligible dialects or languages in West
      Africa of the Mande family. Their best-known members are Bambara (bam), the
      most widely spoken language in Mali; Mandinka (mnk), the main language of Gambia;
      Maninka or Malinké, a major language of Guinea; and Dyula (dyu), a trade language
