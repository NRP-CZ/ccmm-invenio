- description:
    en: Oyster Bay Tasmanian (also known as Paredarerme, Paytirami or Poredareme)
      is an Aboriginal language of Tasmania in the reconstruction of Claire Bowern.
      It was spoken along the central eastern coast of the island by the Oyster Bay
      tribe, and in the interior by the Big River tribe. Big River Tasmanian is attested
      in a list of 268 words collected by George Augustus Robinson. Coastal vocabularies
      include the Oyster Bay list of Robinson (357 words), and a second collected
      by Joseph Milligan of 1 040 words published in 1857 and 1859. The last is the
      longest vocabulary of any variety of Tasmanian.
