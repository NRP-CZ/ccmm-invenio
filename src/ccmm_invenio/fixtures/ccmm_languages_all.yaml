      formerly spoken on the Cape York Peninsula of Queensland in Australia. It is
      thought to be related to Kuuk Thayorre (thd). If so, it is classified within
      the Paman branch and more specifically within the Southwest Pama sub-branch.
      The Pama–Nyungan languages are the most widespread family of Australian Aboriginal
