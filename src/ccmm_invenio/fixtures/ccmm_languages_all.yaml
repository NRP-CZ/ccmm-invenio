    en: Northern Tarahumara is a Southern Uto-Aztecan language spoken in northern
      Mexico. Together with Lowland Tarahumara (tac), Central Tarahumara (tar), Southeastern
      Tarahumara (tcu) and Southwestern Tarahumara (twr), it forms the Tarahumaran
      group. The native name of Tarahumara language is Rarámuri or Ralámuli ra'ícha.
