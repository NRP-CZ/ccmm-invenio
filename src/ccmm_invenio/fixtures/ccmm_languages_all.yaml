  title:
    cs: '!Xóõ'
    en: '!Xóõ'
  description:
    en: '!Xóõ is a Tuu language spoken in Botswana and Namibia. It is closely related
      to the extinct Lower-Nosop. Tuu languages were once accepted as a branch of
      the now-obsolete Khoisan language family. Khoisan languages are characterised
      by the presence of numerous click consonants, produced by snapping the tongue
      against the palate or teeth. The Tuu languages, along with neighboring ǂʼAmkoe,
      are known for being the only natural languages in the world to have bilabial
      clicks as distinctive speech sounds. Taa shares a number of characteristic features
      with West ǂʼAmkoe and Gǀui, which together are considered part of the Kalahari
      Basin sprachbund.'
