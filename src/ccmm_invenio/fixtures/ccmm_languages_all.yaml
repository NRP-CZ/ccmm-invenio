- description:
    en: Isu (Menchum Division) is an Southern Bantoid language spoken in Cameroon.
      Together with Bengaic languages (BNG, BNM, NUI, YKO) and other Dualaic languages
      (DUA, MZD, KME, OLB), it belongs to the Sawabantu group, which is classified
      within the Volta-Congo primary branch. Like other Bantu languages, Isu has a
      noun class system, a characteristic feature of languages belonging to the Atlantic–Congo
      lineage, the largest demonstrated language family in Africa.
