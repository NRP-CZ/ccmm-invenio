- id: asb
  title:
    cs: Assiniboine
    en: Assiniboine
  description:
    en: Assiniboine, also known as Assiniboin, Hohe, or Nakota, Nakoda, Nakon or Nakona,
      or Stoney, is a Nakotan Siouan language of the Northern Plains. The name Assiniboine
      comes from the term Asiniibwaan, from Ojibwe, meaning 'Stone Siouans'. The reason
      they were called this was that Assiniboine people used heated stone to boil
      their food. In Canada, Assiniboine people are known as Stoney Indians, while
      they called themselves Nakota or Nakoda, meaning 'allies'. Within the Siouan
      language family, the Dakotan group consists of the Sioux languages (Dakota,
      Lakota), while the Nakoda group covers Assiniboine and the closely related Stoney.
  props:
