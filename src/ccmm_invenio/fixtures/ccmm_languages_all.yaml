  title:
    cs: Wanyi
    en: Wanyi
- description:
    en: Kuwema, also known as Tyaraity, is a dormant Australian Aboriginal language
      traditionally spoken along the Daly River in the Northern Territory. Kuwema
      is related to Malak Malak. They were formerly classified as independent members
      of the Northern Daly languages, but are now considered a language isolate.
