- description:
    en: Nambya is a Bantu language spoken by the Nambya people. It is spoken in northwestern
      Zimbabwe, particularly in the town of Hwange with a few speakers in northeastern
      Botswana. It is either classified as a dialect of Kalanga or as a closely related
      language. The Zimbabwean constitution recognises Nambya and Kalanga as separate
      indigenous languages. Nambya is one of Zimbabwe‘s 16 official languages.
