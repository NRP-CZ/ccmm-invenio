    en: 'Plains Cree (endonym: nēhiyawēwin; alternatively: paskwâwinîmowin ‘language
      of the prairie people’) belongs to the Cree macrofamily of languages, which
      is the most populous Canadian indigenous language. Out of the 116 500 speakers
      of the Cree language, the Plains Cree dialect is spoken by about 34 000 people
      primarily in Saskatchewan and Alberta but also in Manitoba and Montana. Plains
      Cree is considered a dialect of the Cree language that is distinct from the
      Montagnais language or a dialect of the Montagnais language. Together, Cree–Montagnais–Naskapi
