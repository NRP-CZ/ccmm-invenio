- description:
    en: Bunuba is an endangered Australian Aboriginal language spoken by some 41 older
      Bunuba adults, most of whom live in Junjuwa, an Aboriginal community in Fitzroy
      Crossing in Kimberley, Western Australia. Bunuba is not related to the Pama-Nyungan
      language family that spans the majority of Australia; however, it is a relative
      of Gooniyandi. Both belong to the Bunuban language family. Language maintenance
