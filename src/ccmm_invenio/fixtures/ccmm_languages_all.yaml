- description:
    en: Tagish is an extinct Athabaskan language spoken by the Tagish or Carcross-Tagish,
      a First Nations people that historically lived in the Northwest Territories
      and Yukon in Canada. The Tagish people refer to themselves as /ta:gizi dene/,
      literally "Tagish people", where /ta:gizi/ is a place name meaning ‘it (spring
      ice) is breaking up’. Several linguists classify Tagish as a dialect of the
      same language as Kaska and Tahltan. Tagish belongs to the Athabaskan-Eyak-Tlingit
      language family. Edward Sapir originally constructed the term Na-Dene to refer
      to a combined family of Athabaskan, Tlingit, and Haida (the existence of the
      Eyak language was not known to him at the time). However, Haida is now generally
      considered a language isolate.
