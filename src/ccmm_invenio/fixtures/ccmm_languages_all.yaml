- description:
    en: Walungge language is spoken by Walungge people in Nepal and Tibet. It has
      71% lexical similarity with the Lhasa Tibetan. Clark (2019) places it in a group
      which he calls ‘WDT Bhote,’ where the three varieties are Walungge, Thudam,
      and Dhokpya. The speakers of these varieties reside in Taplejung and Sankhuwasabha
      in Province No. 1, Nepal, although some speakers reported areas outside of those
      districts, including in Tibet and in India, where the language is also spoken.
      In the classification, Walungge is placed in the Central Tibetan branch and
      more specifically in the South-Western Tibetic branch.
