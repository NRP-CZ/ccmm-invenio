    en: Faifi is a possible descendant of Ancient South Arabian and is spoken by about
      50 000 people in the vicinity of the Fifa Mountains in the southwestern corner
      of Saudi Arabia and across the border in Jebel Minabbih, Yemen. Along with the
      Razihi and Rijal Alma languages, it is possibly one of the few surviving descendants
      of the Sayhadic branch and the Ancient South Arabian languages Hadrami, Minaean,
      Sabaic and Qatrabanian. Along with Berber, Chadic, Cushitic and Egyptian branches,
      Arabic and other Semitic languages belong to the Afro-Asiatic language family,
      constituting the fourth-largest language family after Indo-European, Sino-Tibetan,
