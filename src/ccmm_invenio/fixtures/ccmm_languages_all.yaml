- description:
    en: 'Mòcheno (Italian pronunciation: ˈmɔːkeno) is an Upper German variety spoken
      in three towns of the Bersntol (Italian: Valle del Fersina), in Trentino, northeastern
      Italy. Mòcheno is closely related to Bavarian and is variously classified either
      as a Southern Bavarian variety or a separate language of its own. Mòcheno speakers
      reportedly partially understand Bavarian, Cimbrian, or Standard German. However,
      many essential differences in grammar, vocabulary, and pronunciation render
      it difficult for speakers of Standard German to understand. Like other Germanic
      languages, Mòcheno belongs to the Indo-European languages, the world’s largest
      language family by number of native speakers.'
