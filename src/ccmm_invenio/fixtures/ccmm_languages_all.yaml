      is an Aboriginal language or pair of languages of Tasmania in the reconstruction
      of Claire Bowern. It was spoken on Bruny Island, off the southeastern coast
      of Tasmania, by the Bruny tribe. The last speaker of Bruny Island was likely
      Truganini, who is also widely accepted as the last full-blooded Tasmanian Aboriginal
      person.
