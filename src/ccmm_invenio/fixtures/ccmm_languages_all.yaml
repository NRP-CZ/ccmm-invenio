    en: Chakavian
  description:
    en: Chakavian is a South Slavic supradialect or language spoken by Croats along
      the Adriatic coast; by the Burgenland Croats in southeastern Austria, northwestern
      Hungary and southwestern Slovakia; as well as few municipalities in southern
      Slovenia on the border with Croatia. Chakavian represents the basis for early
      literary standards in Croatia, and until the modern age was simply known and
      understood, along with the Kajkavian and Shtokavian idioms in Croatia, as the
      Croatian language (hrvatski jezik). Along with Bosnian, Montenegrin and Serbian,
      Croatian Standard language belongs to the Shtokavski branch. Chakavian is classified
      within the Slavic group of the Balto-Slavic branch of Indo-European languages,
      the world’s largest by number of native speakers.
