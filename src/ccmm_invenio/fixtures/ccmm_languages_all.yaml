- description:
    en: 'Katabangan (Catanauan ‘Ayta’) is an extinct Aeta language that was spoken
      in the Bondoc Peninsula of Quezon Province, southern Luzon in the Philippines.
      The Katabangan have completely switched to Filipino. The language was originally
      listed by Garvan (1963: 8). Katabaga is in fact a misspelling of Katabangan,
      the name that the people use to refer to themselves. Some people in the Bikol
      Region also use the term Katabangan to refer to mixed-blood Agta in the region.
      Lobel (2013: 92) reports from a 2006 visit that the Katabangan speak only Tagalog.'
