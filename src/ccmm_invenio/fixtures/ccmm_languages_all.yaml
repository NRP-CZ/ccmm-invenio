- id: jrt
  title:
    cs: Jakattoe
    en: Jakattoe
  description:
    en: Jakattoe is a West Chadic language spoken in Plateau State, Nigeria. It was
      identified by Roger Blench in 2016. It is spoken by about 500 people in one
      village, Dokan Tofa, which is located on the Jos-Shendam road in Plateau State.
      Blench (2017) suggests that Jakattoe may be related to spurious records of the
      Jorto language. Jakattoe speakers claim that their language is related to Goemai.
      Along with Berber, Cushitic, Egyptian and Semitic branches, Chadic belongs to
      the Afro-Asiatic language family, constituting the fourth-largest language family
      after Indo-European, Sino-Tibetan, and Niger–Congo.
