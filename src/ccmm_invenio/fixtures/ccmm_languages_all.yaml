    en: Thompson
  description:
    en: Thompson or nɬeʔkepmxcín (also known as Nlaka'pamuctsin, Nlaka'pamux, or Nthlakampx)
      is an Interior Salishan language spoken in the Fraser Canyon, Thompson Canyon,
      and Nicola Country of the Canadian province of British Columbia, and formerly
      in the North Cascades region of Whatcom and Chelan counties of the state of
      Washington in the United States. The Interior Salish languages have a higher
      degree of closeness to each other than the more distant Coast Salish languages.
  props:
