- description:
    en: Yola, more commonly and historically the Forth and Bargy dialect, is an extinct
      dialect of the Middle English language once spoken in the baronies of Forth
      and Bargy in County Wexford, Ireland. As such, it was probably similar to the
      Fingallian dialect of the Fingal area. Both became functionally extinct in the
      19th century when they were replaced by modern Hiberno-English. The word yola
      means 'old' in the dialect. In modern times, there have been efforts to revive
      the dialect. Like English, Yola is classified as a Western Germanic language
      within the Indo-European language family.
