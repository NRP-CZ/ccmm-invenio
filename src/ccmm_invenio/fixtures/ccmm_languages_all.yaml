- description:
    en: 'Kumarbhag Paharia is a North Dravidian language spoken by the Malto people
      of East India. It is spoken in Jharkhand and West Bengal states of India, and
      tiny pockets of Odisha state. There are two varieties of Malto: Kumarbhag Paharia
      and Sauria Paharia. The lexical similarity between the two is estimated to be
      80%. The most closely related language to Malto is Kurukh. Together with Brahui,
      all three languages form the North Dravidian branch of the Dravidian language
      family. Kurukh is written in Devanagari, a script also used to write Indo-Aryan
      languages.'
