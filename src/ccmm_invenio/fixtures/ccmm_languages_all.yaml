    cs: Durop
    en: Durop
  description:
    en: Durop, also known as Ododop or Erorop, is an Upper Cross River language of
      Nigeria. It is widely referred to as Korop, though this is actually an ethnonym.
      Durop is closely related to Kiong. It belongs to the Benue-Congo subgroup, which
      is classified within the Volta-Congo primary branch. Like Bantu and Bantoid
      languages, Durop has a noun class system, a characteristic feature of languages
      belonging to the Atlantic–Congo lineage, the largest demonstrated language family
      in Africa.
