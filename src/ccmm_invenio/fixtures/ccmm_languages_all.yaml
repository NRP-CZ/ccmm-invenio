- description:
    en: Hän (alternatively spelled as Haen) is a Northern Athabaskan language spoken
      by the Hän Hwëch'in (translated to people who live along the river, sometimes
      anglicized as Hankutchin). Hän is spoken and supported by the Hän nation across
      localized communities who have lived in what is today called the Upper Yukon
      region; the village of Eagle, Alaska, in the United States; the town of Dawson
      City, Yukon Territory, in Canada; as well as Fairbanks and Tanacross in Alaska.
      It is most closely related to Gwich'in and Upper Tanana. Edward Sapir originally
      constructed the term Na-Dene to refer to a combined family of Athabaskan, Tlingit,
      and Haida (the existence of the Eyak language was not known to him at the time).
      However, Haida is now generally considered a language isolate.
