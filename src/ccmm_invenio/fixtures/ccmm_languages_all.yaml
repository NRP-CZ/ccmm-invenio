  title:
    cs: Medefaidrin
    en: Medefaidrin
  description:
    en: Medefaidrin (Medefidrin), or Obɛri Ɔkaimɛ, is a constructed language and script
      created as a Christian sacred language by an Ibibio congregation in 1930s Nigeria.
      It has its roots in glossolalia ('speaking in tongues'). Speakers consider Medefaidrin
      to be a 'spirit language'. It was created by two leaders of the church, Michael
      Ukpong and Akpan Akpan Udofia. They state that the Holy Spirit revealed the
      words of the language to Ukpong, while Udofia wrote them down. At the time Ibibio
      was not a written language, and Udofia created a script to write Medefaidrin.
  props:
    iri: https://nma.eosc.cz/vocabularies/languages/dmf
