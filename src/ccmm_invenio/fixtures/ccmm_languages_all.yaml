- description:
    en: Dir-Nyamzak-Mbarimi, consisting of Dir, Nyamzak (or Langas) and Mbarimi (or
      Baram), is an Afro-Asiatic language group of Bauchi State, Nigeria. It is part
      of the Barawa cluster, which is in turn part of the West Chadic branch. Its
      closest related language varieties are Pesse, Zul, Buli and the extinct Luri.
      Together, they form the Polci-Luri group.
