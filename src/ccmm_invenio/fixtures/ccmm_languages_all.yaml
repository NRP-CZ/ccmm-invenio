    en: Nzadi is a Bantu language spoken in the Democratic Republic of the Congo.
      Together with Ngul (also Ngwii), Lwel and Ding, it belongs to the West-Coastal
      Bantu group, which is classified within the Volta-Congo primary branch. Like
      other Bantu languages, Nzadi has a noun class system, a characteristic feature
      of languages belonging to the Atlantic–Congo lineage, the largest demonstrated
      language family in Africa.
