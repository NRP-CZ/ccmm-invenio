    en: Sanskrit is a classical language belonging to the Indo-Aryan branch of the
      Indo-European languages. It arose in northwest South Asia after its predecessor
      languages had diffused there from the northwest in the late Bronze Age. Sanskrit
      is the sacred language of Hinduism, the language of classical Hindu philosophy,
      and of historical texts of Buddhism and Jainism. Upon transmission of Hindu
      and Buddhist culture to Southeast Asia, East Asia and Central Asia in the early
      medieval era, it became a language of religion and high culture, and of the
      political elites in some of these regions. Sanskrit generally connotes several
      Old Indo-Aryan language varieties and continues to be widely used as a ceremonial
      and ritual language in Hindu and Buddhist hymns and chants.
