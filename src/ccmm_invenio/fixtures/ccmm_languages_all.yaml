- description:
    en: Nǁng is an endangered Tuu language of South Africa within the Ghaap-Khalahari
      group. It was historically spoken north of the Orange River, between the Namibian
      border and the Vaal, as well as near the Molopo River by the southernmost point
      of Botswana. Tuu languages were once accepted as a branch of the now-obsolete
      Khoisan language family. Khoisan languages are characterised by the presence
      of numerous click consonants, produced by snapping the tongue against the palate
      or teeth. The Tuu languages, along with neighboring ǂʼAmkoe, are known for being
      the only natural languages in the world to have bilabial clicks as distinctive
      speech sounds.
