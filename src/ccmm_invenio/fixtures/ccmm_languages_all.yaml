- description:
    en: Tahltan, Tāłtān, also called Tałtan ẕāke (‘Tahltan people language’), dah
      dẕāhge (‘our language’) or didene keh (‘this people's way’) is a poorly documented
      and endangered Northern Athabaskan language spoken by Tahltan people (also 'Nahanni')
      who live in northern British Columbia around Telegraph Creek, Dease Lake, and
      Iskut. Tahltan is a critically endangered language. Several linguists classify
      Tahltan as a dialect of the same language as Tagish and Kaska. Tahltan belongs
      to the Athabaskan-Eyak-Tlingit language family. Edward Sapir originally constructed
      the term Na-Dene to refer to a combined family of Athabaskan, Tlingit, and Haida
      (the existence of the Eyak language was not known to him at the time). However,
      Haida is now generally considered a language isolate.
