    ISO_639_2B: nya
    ISO_639_3: nya
- id: nyh
  title:
    cs: Nyikina
    en: Nyikina
  description:
    en: Nyikina is an endangered Australian Aboriginal language spoken by the Nyikina
      people in northern Western Australia. It is closely related to the extinct Warrwa
      language. Both belong to the small Nyulnyulan language family. Most languages
      in this family are extinct, with only three extant languages, all of which are
      almost extinct
  props:
    iri: https://nma.eosc.cz/vocabularies/languages/nyh
