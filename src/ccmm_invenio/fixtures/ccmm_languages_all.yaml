      Palaung by ancestry and their language is unrelated. Riang Lang (Yinnet) and
      Riang Lai (Yinchia) are sometimes considered distinct languages, sometimes the
      same language. Like many Austroasiatic languages, Palaungic languages are characterised
      by prefixation in its clause structure and larger than average vowel inventories.
