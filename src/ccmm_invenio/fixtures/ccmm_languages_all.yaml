- description:
    en: Chinese is a group of related but often mutually unintelligible language varieties,
      forming one of the two Sinitic branches within the Sino-Tibetan language family.
      It is often collectively referred to as zhōngwén, meaning the Chinese language
      or script. Hànyǔ refers to the Chinese language spoken by the Han ethnic group,
      the majority ethnicity in China. All varieties of Chinese are tonal and analytic.The
      written form of the standard language, wén, based on the logograms known as
      Chinese characters, is shared by literate speakers of otherwise unintelligible
      dialects.
