- id: nsb
  title:
    cs: Lower Nossob
    en: Lower Nossob
  description:
    en: 'Lower Nossob is an extinct Tuu language once spoken along the Nossob River
      on the border of South Africa and Botswana, near Namibia. It was closely related
      to the Taa language. There are two attested dialects: ǀʼAuni, or ǀʼAuo, recorded
      by Dorothea Bleek, and ǀHaasi, recorded by Robert Story. Tuu languages were
      once accepted as a branch of the now-obsolete Khoisan language family. Khoisan
      languages are characterised by the presence of numerous click consonants, produced
      by snapping the tongue against the palate or teeth. The Tuu languages, along
      with neighboring ǂʼAmkoe, are known for being the only natural languages in
      the world to have bilabial clicks as distinctive speech sounds.'
