  description:
    en: Kalaamaya, also spelled Karlamay, is a Pama–Nyungan language of Western Australia.
      Pama–Nyungan languages are the most widespread family of Australian Aboriginal
      languages, comprising 306 of the 400 Aboriginal languages of Australia. Kalaamaya
      is poorly attested, but appears to be a close relative of Noongar. As of 2015,
      a single fluent speaker, Kaprun elder Brian Champion who learned the language
      as an adult, and several partial speakers remain. Kalaamaya is closely related
      to Mirning. Like the vast majority of Australian languages, also Kalaamaya is
      morphologically ergative, with the nominal in the agent role marked with an
      ergative suffix and the subject and object unmarked.
