    en: Nepali or Nepalese is an Indo-Aryan language. It is the official language
      and de facto lingua franca of Nepal and is also spoken in India, Bhutan, Myanmar,
      Hong Kong and United Kingdom. Nepali developed in proximity to a number of Indo-Aryan
