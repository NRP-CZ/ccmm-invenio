- id: djj
  title:
    cs: Djeebbana
    en: Djeebbana
  description:
    en: Djeebbana, also spelled Ndjébbana, is an endangered Australian Aboriginal
      language spoken by the Gunavidji (Ndjebbana) people of North-central Arnhem
      Land in the Northern Territory of Australia. It is closely related to Na-kara
      (nck), and both belong to the Maningrida group of languages. This group is sometimes
      classified with the Gunwinyguan languages in a proposed Macro-Gunwinyguan family,
      which is distinct from the Pama–Nyungan language family.
  props:
    iri: https://nma.eosc.cz/vocabularies/languages/djj
