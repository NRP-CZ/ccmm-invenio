    en: Karakalpak is a Turkic language spoken by Karakalpaks in Karakalpakstan. It
      is divided into two dialects, Northeastern Karakalpak and Southwestern Karakalpak.
      It developed alongside Nogai and neighbouring Kazakh languages, being markedly
      influenced by both. Typologically, Karakalpak belongs to the Kipchak branch
      of the Turkic languages, thus being closely related to and highly mutually intelligible
      with Kazakh and Nogai.
