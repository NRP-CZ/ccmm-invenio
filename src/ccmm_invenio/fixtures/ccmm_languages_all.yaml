- description:
    en: Southwestern Tasmanian, or Toogee, is a possible Aboriginal language of Tasmania.
      It is the most poorly attested known variety of Tasmanian, and it is not clear
      how distinct it was. It was apparently spoken along the west coast of the island,
      south of Macquarie Harbour. Southwestern Tasmanian is attested from a single
      word list, collected in Port Davey by George Augustus Robinson from the Ninenee
      Tribe of the Bathurst Harbour area. There are 131 words, but some of these may
      be from Southeastern Tasmanian languages.
