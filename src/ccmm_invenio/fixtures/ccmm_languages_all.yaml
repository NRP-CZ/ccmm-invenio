- description:
    en: Khalaj is a Turkic language classified within the Common Turkic branch. It
      is spoken mainly in Markazi Province in Iran. Although it contains many old
      Turkic elements, it has become widely Persianized. The conservative character
      of Khalaj can be seen by comparing the same words across different Turkic varieties.
      For example, in Khalaj, the word for 'foot' is hadaq, while the cognate word
      in nearby Oghuz languages is ayaq (compare Turkish ayak). Because of the preservation
      of these archaic features, it has been presumed that the Khalaj people are the
      descendants of the Arghu Turks.
