- description:
    en: Malay, endonym Bahasa Melayu, is an Austronesian macrolanguage within the
      Malayo-Polynesian branch spoken primarily on islands in maritime Southeast Asia
      and Malay Peninsula in mainland Asia. It is an official language of Brunei,
      Malaysia, Singapore and Indonesia. Malay is pluricentric, i.e., a group of mutually
      intelligible speech varieties, or dialect continuum, that have no traditional
      name in common, and which may be considered distinct languages by their speakers.
      Several varieties of it are standardised as the national language (bahasa kebangsaan
      or bahasa nasional) of several nation states with various official names. Classical
      Malay, also called Court Malay, was the literary standard of the pre-colonial
      Malacca and Johor Sultanates. Austronesian languages often possess phoneme inventories
      smaller than the world average. Two salient morphological characteristics are
      a system of affixation and reduplication to form new words.
