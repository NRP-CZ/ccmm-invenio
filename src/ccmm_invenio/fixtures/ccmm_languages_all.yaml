- description:
    en: Shaetlan, also known as Shetland or Shetlandic, is a mixed language spoken
      in Shetland, an archipelago to the north of mainland Scotland. It emerged through
      the prolonged and stable bilingualism of Norn (the language of the previous
      settlers) and Lowlands Scots (mainly the varieties from Fife and Lothian) brought
      to Shetland from the early 15th century onward. It has been recognised as a
      highly distinct variety for centuries, and is now officially acknowledged as
      a language by ISO. It is classified within the North Germanic group of the Scandinavian
      branch of Indo-European languages.
