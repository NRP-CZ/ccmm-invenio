- description:
    en: Kurukh, also Kurux, Oraon or Uranw, is a North Dravidian language spoken by
      the Kurukh (Oraon) and Kisan people of East India. It is spoken by about two
      million people in the Indian states of Jharkhand, Chhattisgarh, Odisha, West
      Bengal, Assam and Tripura, as well as by 65 000 in northern Bangladesh, 28 600
      of a dialect called Uranw in Nepal and about 5 000 in Bhutan. The most closely
      related language to Kurukh is Malto. Together with Brahui, all three languages
      form the North Dravidian branch of the Dravidian language family. Kurukh is
      written in Devanagari, a script also used to write Indo-Aryan languages.
