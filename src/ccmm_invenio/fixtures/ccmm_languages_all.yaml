      to the Bau Bidayuh (sne), Biatah Bidayuh (bth) and Tringgus-Sembaan Bidayuh
      (trx) languages. Bukar-Sadung Bidayuh belongs to the Malayo-Polyneasian primary
      branch of the Austronesian language family. Two main morphological characteristics
      of the Malayo-Polynesian languages are a system of affixation and reduplication
      to form new words.
