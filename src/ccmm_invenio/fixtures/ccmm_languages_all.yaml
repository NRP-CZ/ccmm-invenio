    en: Judeo-Persian refers to both a group of Jewish dialects spoken by the Jews
      living in Iran and Judeo-Persian texts (written in Hebrew alphabet). As a collective
      term, Judeo-Persian refers to a number of Judeo-Iranian languages spoken by
      Jewish communities throughout the formerly extensive Persian Empire. The language
      is part of the Persian group of the southwestern family of the Indo-Iranian
      languages.
