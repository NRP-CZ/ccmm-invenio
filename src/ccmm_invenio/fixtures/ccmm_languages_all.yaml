- description:
    en: Tedaqa (also known as Teda) belongs to the Saharan primary branch of the disputed
      Nilo-Saharan language family. It is spoken by the Teda, a northern subgroup
      of the Toubou people, in Libya, Chad and eastern Niger. Within the Saharan branch
      – which also includes the Kanuri, Kanembu, and Tebu languages – Tedaqa is classified
      as part of the Western Saharan subgroup. The constituent families of the putative
      Nilo-Saharan family are quite diverse, but one characteristic feature is a tripartite
