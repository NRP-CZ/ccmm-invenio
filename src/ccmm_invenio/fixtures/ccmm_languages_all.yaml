  description:
    en: 'Atikamekw (endonym: Atikamekw Nehiromowin, literally ‘Atikamekw native language’)
      is the language of the Atikamekw people of southwestern Quebec, Canada. It is
      spoken by nearly all the Atikamekw, and therefore it is among the indigenous
      languages least threatened with extinction, according to some studies. Atikamekw
      is a language belonging to the Cree–Montagnais–Naskapi linguistic continuum,
      which is part of the Central branch of the Algonquian languages of the Algic
      family of languages. It is sometimes classified as a dialect of Cree.'
