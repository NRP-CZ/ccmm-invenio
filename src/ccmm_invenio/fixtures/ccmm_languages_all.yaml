      of the small islands of Mer (Murray Island), Waier and Dauar, Erub (Darnley
      Island), and Ugar (Stephens Island) in the eastern Torres Strait, Queensland,
      Australia. In the Western Torres Strait language, Kalaw Lagaw Ya, it is called
      Mœyam or Mœyamau Ya. It is the only Papuan language in Australian territory.
