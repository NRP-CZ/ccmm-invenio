- description:
    en: Kaska is an endangered Athabaskan language. Traditionally, Kaska was an oral
      aboriginal language used by the Kaska Dena people. The Kaska Dene region consists
      of a small area in the Southwestern part of the Northwest Territories, the Southeastern
      part of Yukon Territory, and the Northern part of British Columbia. Several
      linguists classify Kaska as a dialect of the same language as Tagish and Tahltan.
      Kaska belongs to the Athabaskan-Eyak-Tlingit language family. Edward Sapir originally
      constructed the term Na-Dene to refer to a combined family of Athabaskan, Tlingit,
      and Haida (the existence of the Eyak language was not known to him at the time).
      However, Haida is now generally considered a language isolate.
