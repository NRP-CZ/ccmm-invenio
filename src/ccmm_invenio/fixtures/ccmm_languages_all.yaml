      of Australia. It is one of the Wati languages. The name Wati tends to be used
      when considering the various varieties to be distinct languages, Western Desert
      when considering them dialects of a single language. Yankunytjatjara is most
      closely related to Ngaanyatjarra (ntj) and to Pitjantjatjara (pjt). The Pama–Nyungan
      languages are the most widespread family of Australian Aboriginal languages,
      comprising over 300 of the approximately 400 Aboriginal languages of Australia.
