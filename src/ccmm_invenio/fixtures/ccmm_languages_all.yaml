- description:
    en: Dyangadi, also known as Dhanggatti, is a Pama-Nyungan language, once spoken
      by the Djangadi of the Macleay Valley and surrounding high country of the Great
      Dividing Range in New South Wales, Australia. There is an ongoing program of
      language-revival. Dyangadi is related to the extinct Nganyaywana language. Both
      have been called the Macleay Valley languages. The Pama–Nyungan languages are
      the most widespread family of Australian Aboriginal languages, comprising over
      300 of the approximately 400 Aboriginal languages of Australia.
