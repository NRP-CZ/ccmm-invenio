- description:
    en: 'The Slavic or Slavonic languages, a group of closely related languages of
      the Slavic peoples and a subgroup of Indo-European languages, have speakers
      in most of eastern Europe, much of the Balkans, parts of central Europe, and
      the northern part of Asia.Slavic languages are usually divided on the basis
      of geographical and genealogical principle into three main branches: East, West
      and South Slavic branchs.The Slavic languages are a relatively homogeneous and
      conservative family, compared with other families of Indo-European languages.
