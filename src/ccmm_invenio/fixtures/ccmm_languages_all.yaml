  description:
    en: Ngadjunmaya is a Pama–Nyungan language of Western Australia that is located
      in the Goldfields-Esperance region. Murunitja was apparently a dialect of either
      Ngadjumaya or of Mirning. Pama–Nyungan languages are the most widespread family
      of Australian Aboriginal languages, comprising 306 of the 400 Aboriginal languages
      of Australia. Ngadjunmaya is closely related to Mirning and Kalaamaya. Like
      the vast majority of Australian languages, also Ngadjunmaya is morphologically
      ergative, with the nominal in the agent role marked with an ergative suffix
      and the subject and object unmarked.
