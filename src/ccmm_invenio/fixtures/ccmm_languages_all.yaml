- id: xpw
  title:
    cs: Northwestern Tasmanian
    en: Northwestern Tasmanian
  description:
    en: 'Northwestern Tasmanian, or Peerapper, is an Aboriginal language of Tasmania
      in the reconstruction of Claire Bowern. It was spoken along the west coast of
      the island, from Macquarie Harbour north to Circular Head and Robbins Island.
      Northwestern Tasmanian is poorly attested from four word lists: The ‘west coast’
      vocabularies of Charles Robinson and George Augustus Robinson, with 246 words
      combined; the Robbins Island list of George Augustus Robinson, with 162 words;
      and the Macquarie Harbour vocabularies of Allan Cunningham (222 words), collected
      in 1819.'
