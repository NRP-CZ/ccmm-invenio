    en: Semandang
  description:
    en: Semandang, or Onya Darat is a Malayo-Polynesian language spoken in Kalimantan,
      the Indonesian part of Borneo. The Malayo-Polynesian languages are a subgroup
      of the Austronesian languages encompassing approximately 390 million speakers.
      All major Austronesian languages belong to the Malayo-Polynesian subgroup. Together
      with closely related Jangkang (djo), Ribun (rir), Sanggau (scg) and Kembayan
      (xem) languages, Semandang belongs to the Southern Land Dayak sub-branch. Austronesian
      languages often possess phoneme inventories smaller than the world average.
      Two salient morphological characteristics are a system of affixation and reduplication
      to form new words.
