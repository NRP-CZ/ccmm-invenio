- description:
    en: 'Swedish is a North Germanic language, spoken mainly in Sweden and parts of
      Finland. It is largely mutually intelligible with Norwegian and Danish.Swedish
      uses two genders: neutrum and utrum which unifies the old masculin and femenin.'
    fr: 'Le suédois est une langue germanique septentrionale, parlée principalement
      en Suède et dans certaines parties de la Finlande. Il est en grande partie mutuellement
      intelligible avec le norvégien et le danois.Le suédois utilise deux genres:
      le neutrum et l’utrum qui rassemble les anciens genres masculin et féminin.'
