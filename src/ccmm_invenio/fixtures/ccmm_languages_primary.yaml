- description:
    en: Azerbaijani or Azeri is a member of the Oghuz group of Turkic languages, spoken
      primarily in the Caucasus region. Azerbaijani and Turkish closely resemble each
      other.Azeri was written in the Arabic-Persian script, a modified Latin script
      and with a form of the Cyrillic alphabet. After the collapse of the Soviet Union
      the Latin writing was introduced.
    fr: L’azéri ou azerbaïdjanais est une langue appartenant au groupe oghuz des langues
      turques, parlée principalement dans la région du Caucase. L’azéri et le turc
      sont assez similaires.L’azéri a été écrit dans l’alphabet arabo-persan, un alphabet
      latin modifié et avec une forme de l’alphabet cyrillique. Après la chute de
      l’Union soviétique, l’écriture latine est introduite.
