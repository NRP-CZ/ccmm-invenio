- description:
    en: Kyrgyz is a Turkic language spoken in Kyrgyzstan as well as China, Afghanistan,
      Kazakhstan, Tajikistan, Turkey, Uzbekistan, Pakistan and Russia. Kyrgyz is a
      member of the Kyrgyz–Kipchak subgroup of the Kypchak languages, and modern-day
      language convergence has resulted in a mutual intelligibility between Kyrgyz
      and Kazakh.In 1940 a Cyrillic alphabet eventually became common and has remained
      so to this day, though some Kyrgyz still use the Arabic alphabet. There was
      a popular idea among some Kyrgyz people to make a transition to the Latin alphabet,
      but the plan has not been implemented yet.
    fr: Le kirghiz ou kirghize est une langue appartenant au groupe des langues turques
      de la famille des langues altaïques. Il est parlé en Asie centrale, principalement
      au Kirghizstan (où il est la langue nationale), au Tadjikistan, au Xinjiang
      et en Afghanistan.On l’écrit au moyen de l’alphabet cyrillique, auquel trois
      lettres sont ajoutées, mais le kirghiz est parfois écrit en utilisant l’alphabet
      arabe, lui aussi complété. Le kirghiz est très proche du kazakh. Il est habituellement
      classé avec celui-ci ainsi que le tatar et le karakalpak au sein du groupe des
      langues kiptchak (ou branche turque occidentale).
  id: kir
