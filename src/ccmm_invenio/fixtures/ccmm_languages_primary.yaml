- description:
    en: Arabic is a name for what are traditionally considered the descendants of
      the Classical Arabic language of the 6th century. This includes both the literary
      language and varieties of Arabic spoken in a wide arc of territory, stretching
      across the Middle East, North Africa, the Horn of Africa. Arabic belongs to
      the Semitic branch of the Afro-Asiatic family. The literary language is called
      Modern Standard Arabic or Literary Arabic, which is a pluricentric, fusional
      language. It is currently the only official form of Arabic, used in most written
      documents as well as in formal spoken occasions, such as lectures and news broadcasts.Arabic
      is written using the Arabic script.
    fr: Parlée d’abord par les Arabes, cette langue sémitique qui se déploie géographiquement
      sur plusieurs continents s’étend sociologiquement à des peuples non arabes et
      est aujourd’hui la langue officielle de plusieurs organismes internationaux.
      L’arabe est aussi une des six langues officielles de l’Organisation des Nations
      unies.La diglossie est un caractère de la langue arabe, qui permet de distinguer
      l’arabe vernaculaire de l’arabe littéraire. Le niveau de langue littéraire comprend
      l’arabe classique (pré-coranique, coranique et post-coranique) et l’arabe standard
      moderne. Le niveau de langue vernaculaire comprend toutes les variantes des
      dialectes arabes régionaux.L’arabe utilise l’écriture arabe.
