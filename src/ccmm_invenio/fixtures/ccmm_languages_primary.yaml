- description:
    en: Kazakh is a Turkic language belonging to the Kipchak (or North-Western Turkic)
      branch. Kazakh is primarily a Central Asian language and is spoken in Europe
      in the region between the lower Volga and the frontier of Kazakhstan.Today,
      Kazakh is written in Cyrillic in Kazakhstan and Mongolia, while the Kazakh-speakers
      in China use an Arabic-derived alphabet similar to that used to write Uyghur.
    fr: 'Le kazakh est une langue appartenant à la famille des langues turques. Il
      est parlé en Asie centrale, principalement au Kazakhstan, où il est la langue
      nationale, et au Xinjiang.Le kazakh est écrit de différentes manières: en utilisant
      une variante de l’alphabet latin proche de celle utilisée en turc, l’alphabet
      arabe modifié (en Chine, en Iran, dans une petite partie de la Mongolie, en
      Afghanistan) et le cyrillique agrémenté de 9 lettres supplémentaires, qui est
      l’écriture officielle au Kazakhstan.Le kazakh est particulièrement proche du
      kirghiz.'
  id: kaz
