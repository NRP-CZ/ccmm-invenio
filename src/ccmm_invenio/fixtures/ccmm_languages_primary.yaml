- description:
    en: Greek is an independent branch of the Indo-European family of languages, native
      to the southern Balkans, the Aegean Islands, western Asia Minor and Cyprus.
      It has the longest continuous recorded history of any European language.Its
      writing system has been the Greek alphabet for the majority of its history.Greek
      roots are often used to coin new words for other languages; Greek and Latin
      are the predominant sources of international scientific vocabulary.
    fr: Le grec fait partie de la branche indépendante de la famille indo-européenne
      des langues, principalement parlé dans le sud des Balkans, sur les îles de la
      mer Égée, en Asie Mineure occidentale et à Chypre. Il a la plus longue histoire
      enregistrée en continu de toutes les langues européennes.Son système d’écriture
      a été l’alphabet grec pour la majorité de son histoire.Les racines grecques
      sont souvent utilisées pour créer de nouveaux mots dans d’autres langues; le
      grec et le latin sont les principales sources de vocabulaire scientifique international.
