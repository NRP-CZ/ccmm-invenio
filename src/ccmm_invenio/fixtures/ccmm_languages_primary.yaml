- description:
    en: Portuguese is a member of the Ibero-Romance subgroup of the Romance languages.
      It is spoken in Portugal, Brazil, Mozambique, Angola, Cape Verde, Guinea-Bissau,
      São Tomé and Príncipe, Macau (China), Equatorial Guinea and East Timor.Portuguese
      is the major language of the southern hemisphere.
    fr: Le portugais est une langue appartenant au sous-groupe ibéro-roman des langues
      romanes. Il est parlé au Portugal, au Brésil, au Mozambique, en Angola, au Cap-Vert,
      en Guinée-Bissau, à Sao Tomé-et-Principe, à Macao (Chine), en Guinée équatoriale
      et au Timor-Oriental.Le portugais est la langue la plus parlée de l’hémisphère
      Sud.
