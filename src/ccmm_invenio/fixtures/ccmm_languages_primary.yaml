- description:
    en: Lithuanian is one of the two living members of the Baltic languages, the other
      being Latvian. It is the official language of Lithuania.The Lithuanian language
      is often said to be the most conservative living Indo-European language, retaining
      many features of Proto-Indo-European now lost in other Indo-European languages.
    fr: Le lituanien est l’un des deux membres vivants des langues baltes, l’autre
      étant le letton. C’est la langue officielle de la Lituanie.Le lituanien est
      souvent dit la langue indo-européenne vivante la plus conservatrice, gardant
      de nombreuses caractéristiques de l’indo-européen aujourd’hui perdues dans d’autres
      langues indo-européennes.
