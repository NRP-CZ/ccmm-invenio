- description:
    en: Breton is a member of the Brittonic subgroup of the Celtic languages, spoken
      in Brittany, in western France. It is most closely related to Cornish.Breton
      is classified as ‘severely endangered’ by the Unesco Atlas of the World’s Languages
      in Danger.
    fr: Le breton est une langue du sous-groupe brittonique des langues celtiques,
      parlée en Bretagne, dans l’ouest de la France. Il est très proche du cornique.Le
      breton est reconnu comme langue régionale ou minoritaire de France et comme
      langue de la région de la Bretagne. Il est classé comme «langue sérieusement
      en danger» selon l’Unesco.
