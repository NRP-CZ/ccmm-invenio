- description:
    en: Uzbek is an Eastern Turkic language and is spoken by the Uzbeks in Uzbekistan
      and elsewhere in Central Asia.Until 1992, Uzbek continued to be written using
      a Cyrillic alphabet almost everywhere, but now in Uzbekistan the Latin script
      has been officially re-introduced, although the use of Cyrillic is still widespread.
    fr: L’ouzbek est une langue appartenant au groupe des langues turques de la famille
      des langues altaïques. Il est surtout utilisé en Asie centrale, principalement
      en Ouzbékistan.L’alphabet ouzbek fut perso-arabe, latin, cyrillique et, à partir
      de 1992, à nouveau latin mais remanié. De nos jours, l’écriture en ouzbek cyrillique
      reste encore très largement employée. Les Ouzbeks de Chine utilisent un alphabet
      arabe modifié.
