- description:
    en: Serbo-Croatian, also called Serbo-Croat, Serbo-Croat-Bosnian (SCB), or Bosnian-Croatian-Serbian
      (BCS), is a South Slavic language and the primary language of Serbia, Croatia,
      Bosnia and Herzegovina, and Montenegro. It is a pluricentric language with four
      mutually intelligible standard varieties. The term Serbo-Croatian was widely
      used in former Yougoslavia.To write Serbo-Croatian, Cyrillic and Latin scripts
      were equally used and easily interchangeable.
    fr: Le serbo-croate, aussi appelé «serbo-croate-bosniaque» (SCB) ou «bosniaque-croate-serbe»
      (BCS), est une langue slave du Sud et la principale langue de la Serbie, de
      la Croatie, de la Bosnie-Herzégovine et du Monténégro. C’est une langue pluricentrique
      avec quatre variantes standards mutuellement intelligibles. Le terme «serbo-croate»
      a été largement utilisé dans l’ex-Yougoslavie.Pour écrire en serbo-croate, les
      alphabets latin et cyrillique sont indifféremment utilisés et facilement interchangeables.
  id: hbs
