- description:
    en: Latin is an extinct Indo-European language which was spoken in the ancient
      city of Rome and its empire. Modern Romance languages are continuations of dialectal
      forms (vulgar Latin) of the language.Additionally many students, scholars, and
      some members of the Christian clergy speak it fluently, and it is still taught
      in some educational institutions around the world. Latin is still used in the
      creation of new words in modern languages of many different families, and largely
      in biological taxonomy.
    fr: Le latin est une langue indo-européenne, souvent considérée comme une langue
      morte, qui a été parlée dans la Rome antique et son empire. Les langues romanes
      modernes sont des continuations des formes dialectales (latin vulgaire) de la
      langue.De nombreux étudiants, des chercheurs et des membres du clergé chrétien
      parlent encore couramment le latin, et il est toujours enseigné dans certains
      établissements d’enseignement à travers le monde. Le latin est encore utilisé
      dans la création de nouveaux mots dans les langues modernes de nombreuses familles,
      en particulier dans la taxonomie biologique.
  id: lat
