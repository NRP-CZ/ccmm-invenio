      biélorusse. Le russe est une langue officielle ou non mais parlée dans certains
      pays qui étaient auparavant des républiques de l’Union soviétique.C’est la langue
      de l’Eurasie la plus étendue géographiquement et la langue slave la plus parlée.Le
