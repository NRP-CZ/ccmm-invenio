- description:
    en: Moldavian or Moldovan is a name of the Romanian language in the Republic of
      Moldova. The identity between the mother tongues of the Moldovans and Romanians
      has been officially acknowledged since the reintroduction of the Latin script
      in 1989; the 1991 Declaration of Independence of Moldova thereupon called the
      official language ‘Romanian’. Nevertheless, the 1994 Constitution only provided
      official status to ‘Moldovan’. In the early 2000s the Parliament of the Republic
      of Moldova adopted a law defining ‘Moldovan’ and ‘Romanian’ as designations
      for the same language (glottonyms). The breakaway region of Transnistria continues
      to recognise ‘Moldovan’ as one of its official languages.
    fr: Le moldave est, selon l’article 13 de sa Constitution, la langue officielle
      de la République de Moldavie. C’est une dénomination politique; du point de
      vue strictement linguistique et en termes de sociolinguistique, le roumain et
      le moldave sont une seule et même langue, dont les anciens dialectes et les
      formes actuelles présentent assez de traits structurels communs scientifiquement
      établis pour constituer une langue unitaire. Les locuteurs se comprennent spontanément
      et complètement sans traducteur ni dictionnaire. Les différences entre parler
      savant (langue littéraire moderne) et parlers populaires sont les mêmes en Moldavie
      et en Roumanie. Le nom scientifique de cette langue, adopté par tous les linguistes,
      est «daco-roumain» ou «daco-roman».
  id: mol
