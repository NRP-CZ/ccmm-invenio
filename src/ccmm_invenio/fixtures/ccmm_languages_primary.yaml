- description:
    en: Hausa is a Chadic language spoken by the Hausa people, mainly within the northern
      half of Nigeria and the southern half of Niger, and with significant minorities
      in Chad, Benin and Cameroon. Hausa is a member of the Afroasiatic language family
      and is the most widely spoken language within the Chadic branch of that family.
      Hausa’s modern official orthography is a Latin-based alphabet called boko. Hausa
      has also been written in Ajami, an Arabic alphabet.
