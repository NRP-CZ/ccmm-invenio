- description:
    en: Zulu is the language of the Zulu people, the vast majority of whom live in
      South Africa. Zulu is the second most widely spoken Bantu language after Shona.Like
      many other Bantu languages, it is written using the Latin alphabet.Standard
      Zulu as it is taught in schools (deep Zulu), differs in various respects from
      the language spoken by people living in cities (urban Zulu).
    fr: Le zoulou est une langue appartenant au groupe nguni des langues bantoues
      (qui comprend également le xhosa et le ndébélé). C’est l’une des langues les
      plus répandues en Afrique.Le zoulou, comme toutes les langues indigènes d’Afrique
      du Sud, était une langue orale jusqu’à l’arrivée de missionnaires européens,
      qui l’ont transcrit en utilisant l’alphabet latin.
