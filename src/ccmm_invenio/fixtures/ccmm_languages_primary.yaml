- description:
    en: Thai, or more precisely Siamese or Central Thai, is a member of the Tai group
      of the Tai–Kadai language family. It is a tonal and analytic language. Thai
      also has a complex orthography and relational markers. Thai is mutually intelligible
      with Lao.The Thais adopted and modified the Khmer script to create their own
      writing system. It is an abugida script.
    fr: Le thaï ou siamois ou Thai-An est une langue du groupe taï de la famille des
      langues taï-kadaï.Le thaï utilise un alphasyllabaire particulier (alphabet thaï)
      dérivé de l’alphabet khmer issu de l’alphabet pâli, adapté pour pouvoir transcrire
      le système tonal de la langue.
