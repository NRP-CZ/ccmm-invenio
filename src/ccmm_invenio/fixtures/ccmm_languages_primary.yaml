- description:
    en: Turkmen or Turkoman is spoken in Asia. Turkmen is a member of the East Oghuz
      branch of the Turkic family of languages; its closest relatives being Anatolian
      Turkish and Azerbaijani, with which it shares a relatively high degree of mutual
      intelligibility.Officially, Turkmen currently is rendered in the ‘Täze Elipbiý’,
      or ‘New Alphabet’, which is based on the Latin alphabet. However, the old ‘Soviet’
      Cyrillic alphabet is still in wide use.
    fr: Le turkmène est une langue appartenant au groupe des langues turques, parlée
      en Asie centrale, principalement au Turkménistan.Le turkmène a été écrit avec
      un alphabet arabe adapté, puis un alphabet latin jusqu’en 1940. L’État soviétique
      force alors l’adoption d’une variante de l’alphabet cyrillique pour l’écriture
      du turkmène. Depuis 1997, l’alphabet officiel est une variante de l’alphabet
      latin avec quelques diacritiques, proche de celui du turc.
