- description:
    en: English is a member of the West Germanic group of the Germanic languages.
      It is an official language of almost 60 sovereign states and is now a global
      lingua franca.It is the third-most-common native language in the world and it
      is widely learned as a second language.
    fr: L’anglais est une langue appartenant au groupe occidental des langues germaniques.
      C’est la langue officielle de près de 60 États souverains. De nos jours, l’anglais
      est une lingua franca mondiale (langue véhiculaire).L’anglais est la troisième
      langue maternelle la plus parlée dans le monde et la langue la plus étudiée
      comme deuxième langue.
