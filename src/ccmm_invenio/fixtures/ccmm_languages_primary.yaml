- description:
    en: Cree macrolanguage, also known as Cree–Montagnais–Naskapi, is a dialect continuum
      of Algonquian languages spoken by approximately 86 475 people across Canada
      in 2021, from the Northwest Territories to Alberta to Labrador. If considered
      one language, it is the aboriginal language with the highest number of speakers
      in Canada. The only region where Cree has any official status is in the Northwest
      Territories, alongside eight other aboriginal languages.
