- description:
    en: Kalaallisut, also known as West Greenlandic, is the official language of Greenland.
      It is spoken by the majority of the inhabitants of Greenland, as well as by
      thousands of Greenlandic Inuit in Denmark. The standard form of Greenlandic
      is based on Kalaallisut, which is one of three Inuit varieties in Greenland
      (the other two being Tunumiisut (East Greenlandic) and Inuktun (North Greenlandic
      or Polar Inuit)). All three belong to the Inuit branch of the Eskaleut language
      family, which stretches across the Arctic from Siberia via Canada to Greenland.
      Eskaleut languages are polysynthetic, allowing the creation of long words by
      stringing together roots and suffixes so that a whole sentence can be rendered
      as a single word.
    fr: Le kalaallisut, également connu sous le nom de «groenlandais occidental»,
      est la langue officielle du Groenland. Il est parlé par la majorité des habitants
      du Groenland, ainsi que par des milliers d’Inuits groenlandais au Danemark.
      Le groenlandais standard est basé sur le kalaallisut, qui est l’une des trois
      variétés inuites présentes au Groenland [les deux autres étant le tunumiisut
      (groenlandais oriental) et l’inuktun (groenlandais septentrional ou inuit polaire)].
      Tous trois appartiennent à la branche inuite de la famille des langues inuito-aléoutes,
      qui s’étend sur tout l’Arctique, de la Sibérie au Groenland en passant par le
      Canada. Les langues inuito-aléoutes sont polysynthétiques, et permettent la
      création de mots longs en réunissant les racines et les suffixes afin qu’une
      phrase entière puisse être rendue en un seul mot.
