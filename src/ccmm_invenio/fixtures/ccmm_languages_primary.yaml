- description:
    en: Danish is a North Germanic language spoken principally in Denmark and as a
      second language in the Faroe Islands and Greenland. Danish is largely mutually
      intelligible with Norwegian and Swedish.Danish has a relatively large vowel
      inventory and is distinguished by the many pharyngealised sounds.
    fr: Le danois est une langue germanique du Nord, parlée principalement au Danemark,
      et est la deuxième langue dans les Îles Féroé et au Groenland. Le danois est
      en grande partie mutuellement intelligible avec le norvégien et le suédois.Il
      possède un inventaire de voyelles relativement vaste et se distingue par ses
      nombreux sons pharyngalisés.
