- description:
    en: The Swahili language is a Bantu language and the mother tongue of the Swahili
      people. It is spoken by various communities inhabiting the African Great Lakes
      region and other parts of south-east Africa, mainly as a lingua franca. The
      closely related Comorian language, spoken in the Comoros Islands, is sometimes
      considered a Swahili dialect.
    fr: Les langues swahilies (souahélies) sont un groupe de langues bantoues de l’Afrique
      de l’Est. Elles possèdent des caractéristiques communes et surtout un vocabulaire
      commun qui permet à un de leurs locuteurs de se faire plus ou moins comprendre
      des divers locuteurs de ce groupe de langues; on ne peut parler d’intercompréhension
      pour toutes ces formes tant la variété linguistique est grande. La plus utilisée
      et populaire de ces langues est le kiswahili, une version standardisée.
