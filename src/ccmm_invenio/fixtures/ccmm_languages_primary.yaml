- description:
    en: Italian is a member of the Romance language group, spoken mainly in south
      Europe. Among the Romance languages, Italian is the closest to Latin in terms
      of vocabulary. The Italian language adopted by the state after the unification
      of Italy is based on Tuscan.Many Italian speakers are native bilinguals of both
      standardised Italian and other regional variants.
    fr: L’italien est une langue appartenant au groupe des langues romanes, parlée
      principalement en Europe du Sud. Parmi les langues romanes, l’italien est très
      proche du latin en termes de vocabulaire. La langue italienne adoptée par l’État
      après l’unification de l’Italie est fondée sur le dialecte de la Toscane.De
      nombreux locuteurs italiens sont bilingues et parlent aussi bien l’italien standard
      que les autres variantes régionales.
