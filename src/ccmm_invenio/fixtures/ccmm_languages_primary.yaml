- description:
    en: Khmer, or Cambodian, is the second most widely spoken Austroasiatic language
      (after Vietnamese). It is the language of the Khmer people and the official
      language of Cambodia.Khmer is primarily an analytic, isolating language which
      is not tonal.The Khmer language is written with an abugida ‘Khmer script’.
    fr: Le khmer est une langue appartenant au groupe des langues môn-khmères de la
      famille des langues austro-asiatiques. Langue des populations khmères, il est
      principalement parlé au Cambodge et dans les régions limitrophes de Thaïlande
      par les Khmers Surin (du Nord) et au Viêt Nam par les Khmers Krom, ce qui s’explique
      par l’histoire de ces pays.C’est une langue non tonale, contrairement au vietnamien,
      l’autre grande langue môn-khmère.Le système d’écriture du khmer est alphasyllabique.
