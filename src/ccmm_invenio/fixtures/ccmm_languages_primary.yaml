- description:
    en: Basque (euskara) is a non Indo-European language of uncertain origin; the
      only living language of Europe that has no known linguistic relatives. It is
      spoken by the Basque people, indigenous to and mainly inhabiting the Basque
      Country, a region spanning an area in north-eastern Spain and south-western
      France.
    fr: Le basque (euskara) est une langue non indo-européenne d’origine incertaine
      et la seule langue vivante de l’Europe qui n’a pas de parents linguistiques
      connus. Il s’agit de la langue parlée par le peuple basque, qui est indigène
      et habite principalement au Pays basque, région couvrant une zone dans le nord-ouest
      de l’Espagne et le sud-ouest de la France.
