- description:
    en: Nepali or Nepalese is an Indo-Aryan language. It is the official language
      and de facto lingua franca of Nepal and is also spoken in India, Bhutan, Myanmar,
      Hong Kong and United Kingdom. Nepali developed in proximity to a number of Indo-Aryan
      languages, most notably Pahari and Magahi, and shows Sanskrit influences. Nepali
      language shares important lexical similarity with the Bengali language.The language
      is written by devanagari.
    fr: Le népalais est une langue de la famille indo-iranienne, parlée au Népal,
      en Inde et au Bhoutan. C’est la plus orientale des langues pahari, un groupe
      de langues et de dialectes parlés au pied de l’Himalaya depuis l’est du Népal
      jusqu’aux États indiens de l’Uttaranchal et de l’Himachal Pradesh.Le népalais
      s’écrit en devanagari.
