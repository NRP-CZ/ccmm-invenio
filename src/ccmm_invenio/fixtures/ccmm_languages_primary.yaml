- description:
    en: Esperanto is the most widely spoken constructed international auxiliary language.
      Its name derives from Doktoro Esperanto (‘Esperanto’ translates as ‘one who
      hopes’), the pseudonym under which Ludwig Zamenhof published the first book
      detailing Esperanto, in 1887.This artificial language is Indo-European based,
      both in its lexicon and in the grammatical categories with which it operates.
    fr: L’espéranto est la langue auxiliaire construite internationale la plus parlée.
      Son nom dérive de «Doktoro Esperanto» («espéranto» se traduit par «celui qui
      espère»), le pseudonyme sous lequel Ludwig Zamenhof a publié le premier livre
      détaillant l’espéranto, en 1887.Cette langue artificielle a des bases indo-européennes,
      à la fois dans son lexique et dans les catégories grammaticales avec lesquels
      elle opère.
