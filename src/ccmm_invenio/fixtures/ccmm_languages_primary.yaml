- description:
    en: 'Albanian (shqip) forms a separate branch of the Indo-European family. It
      is the official language of Albania and also spoken in Kosovo, North Macedonia,
      Italy and Greece.Albanian is divided into two major dialects: Gheg (spoken in
      north) and Tosk (spoken in south).'
    fr: 'L’albanais (shqip) forme une branche distincte de la famille indo-européenne.
      C’est la langue officielle de l’Albanie et il est également parlé au Kosovo,
      en Macédoine du Nord, en Italie et en Grèce. À la suite de la diaspora moderne,
      on rencontre aussi des albanophones dans d’autres parties du monde.L’albanais
      se subdivise en deux dialectes principaux: le Gheg (parlé au nord) et le Tosk
      (parlé au sud).'
