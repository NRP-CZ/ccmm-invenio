- description:
    en: Dhivehi or Maldivian is an Indo-Aryan language predominantly spoken in the
      Maldives, where it is the national language. Maldivian is a descendent of Maharashtri
      Prakrit and is closely related to Marathi, Konkani and Sinhalese languages,
      but not mutually intelligible with them. Maldivian is written in the Thaana
      script. Like other Indo-Iranian languages, Dhivehi belongs to the Indo-European
      languages, the world’s largest language family by number of native speakers.
    fr: Le dhivehi ou maldivien est une langue indo-aryenne principalement parlée
      aux Maldives, où il s’agit de la langue nationale. Le maldivien descend du prâkrit
      maharashtri et est étroitement apparenté aux langues marathi, konkani et singhalaise,
      mais sans intelligibilité mutuelle. Le maldivien est écrit en alphabet thaana.
      À l’instar d’autres langues indo-iraniennes, le dhivehi fait partie des langues
      indo-européennes, la plus grande famille de langues au monde en nombre de locuteurs
      natifs.
