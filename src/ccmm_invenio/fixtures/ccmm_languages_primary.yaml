- description:
    en: Iron Ossetic or Iron Ossetian or simply Iron, Ossetic or Ossetian, is a member
      of the Iranian subgroup of the Indo-European languages, the world’s largest
      language family by number of native speakers. Iron Ossetic is spoken in Ossetia,
      a region on the northern Caucasus. The majority of Ossetians speak Iron, notably
      in the east, south and central parts of North Ossetia–Alania, while in the west
      the Digor dialect is more prevalent. The Iron dialect has been the basis of
      the Ossetian written language since the abolition of the Digor standard in 1939.
    fr: L’ossète iron, ou tout simplement l’iron, ou l’ossète, fait partie du sous-groupe
      iranien des langues indo-européennes, la plus grande famille de langues au monde
      en nombre de locuteurs natifs. L’ossète iron est parlé en Ossétie, une région
      du Caucase du Nord. La majorité des Ossétiens parle l’iron, notamment dans les
      parties orientale, méridionale et centrale de l’Ossétie du Nord-Alanie, tandis
      qu’à l’occident, le digor est le dialecte le plus répandu. Le dialecte iron
      est à la base de la langue ossète écrite depuis la suppression du digor normalisé
      en 1939.
