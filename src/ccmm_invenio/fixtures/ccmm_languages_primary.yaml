- description:
    en: Bulgarian is a member of the Southern subgroup of the Slavic languages, spoken
      mainly in Bulgaria.Modern Bulgarian has several striking differences from other
      Slavic languages. e.g. nouns are no longer declined; however, there is a definite
      article suffixed to the noun.Bulgarian is written with the Cyrillic alphabet.
    fr: Le bulgare est une langue du sous-groupe sud des langues slaves. Il est parlé
      principalement en Bulgarie.Le bulgare a plusieurs caractéristiques qui le distinguent
      de toutes les autres langues slaves, par exemple l’absence de déclinaison ou
      l’existence d’un article défini suffixé au nom.Il est écrit avec l’alphabet
      cyrillique.
