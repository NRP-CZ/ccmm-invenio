- description:
    en: Romansh is a group of Rhaeto-Romance dialects spoken predominantly in the
      south-eastern Swiss canton of Grisons.Romansh has a strong dialectal fragmentation.
      Almost every village has its own vernacular, and five different regional dialects
      own standardised written form.
    fr: Le romanche fait partie du groupe de dialectes rhéto-romans parlés principalement
      dans le canton des Grisons (sud-est de la Suisse).Le romanche a une forte fragmentation
      dialectale. Presque chaque village a sa propre langue vernaculaire, et on dénombre
      cinq dialectes régionaux différents ayant chacun sa forme écrite standardisée.
