- description:
    en: Chinese is a group of related but often mutually unintelligible language varieties,
      forming one of the two Sinitic branches within the Sino-Tibetan language family.
      It is often collectively referred to as zhōngwén, meaning the Chinese language
      or script. Hànyǔ refers to the Chinese language spoken by the Han ethnic group,
      the majority ethnicity in China. All varieties of Chinese are tonal and analytic.The
      written form of the standard language, wén, based on the logograms known as
      Chinese characters, is shared by literate speakers of otherwise unintelligible
      dialects.
    fr: Le chinois est un groupe de variétés linguistiques apparentées, mais souvent
      mutuellement inintelligibles, formant l’une des deux branches du sinitique au
      sein de la famille linguistique sino-tibétaine. Il est souvent dénommé collectivement
      «zhōngwén», c’est-à-dire la langue ou l’écriture chinoise. Hànyǔ désigne la
      langue chinoise parlée par le groupe ethnique Han, l’ethnie majoritaire en Chine.
      Toutes les variétés de chinois sont tonales et analytiques. La forme écrite
      de la langue standard, wén, basée sur les logogrammes connus sous le nom de
      caractères chinois, est partagée par les locuteurs sachant lire et écrire de
      dialectes par ailleurs incompréhensibles.
