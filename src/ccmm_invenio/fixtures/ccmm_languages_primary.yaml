- description:
    en: Kurdish is a member of the Iranian subgroup of the Indo-European languages,
      spoken by the Kurdish people in Iran, Iraq, Turkey and Syria. The term ‘Kurdish
      languages’ is also used instead of ‘Kurdish language’ because the dialects are
      not mutually intelligible without acquired bilingualism and the languages spoken
      by Kurds do not form a linguistic group. The principal Northern dialect, Kurmanji
      is written in the Latin alphabet while others use the Arabic script.
    fr: Le kurde est une langue appartenant au sous-groupe iranien des langues indo-européennes,
      parlée par le peuple kurde en Iran, en Iraq, en Turquie et en Syrie. Le terme
      «langues kurdes» est également utilisé à la place de «langue kurde», parce que
      les dialectes ne sont pas mutuellement intelligibles sans bilinguisme acquis
      et les langues parlées par les Kurdes ne forment pas un groupe linguistique.Le
      principal dialecte du Nord, Kurmanjo, est écrit avec l’alphabet latin, tandis
      que d’autres utilisent l’alphabet arabe.
  id: kur
