- description:
    en: Lao or Laotian is a tonal language of the Tai–Kadai language family. It is
      the official language of Laos, and also spoken in the north-east of Thailand.Lao,
      like many languages in Laos, is written in the Lao script, which is an abugida
      script.Although there is no official standard, the Vientiane dialect has become
      the de facto standard.
    fr: Le lao ou laotien est une langue du groupe taï de la branche dite «kam-taï»
      de la famille des langues taï-kadaï. C’est la langue officielle du Laos. La
      langue lao peut être divisée en cinq dialectes différents selon la région. Le
      lao de Vientiane est en général bien compris dans tout le pays.L’alphabet laotien
      est basé sur l’alphabet siamois ancien, comme pour l’alphabet thaï.
