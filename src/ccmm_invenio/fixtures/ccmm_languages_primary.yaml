- description:
    en: Maltese is a Semitic language, historically a dialect of Arabic, spoken in
      Malta. About half of the vocabulary is derived from standard Italian and Sicilian;
      English words also make up an important part of the Maltese vocabulary.It is
      the only Semitic language written in the Latin script in its standard form.
    fr: Le maltais est une langue sémitique, historiquement un dialecte de l’arabe,
      parlé à Malte. Environ la moitié du vocabulaire est dérivé de l’italien standard
      et de Sicile; les mots anglais constituent également une partie importante du
      vocabulaire maltais.Il est la seule langue sémitique écrite en alphabet latin
      dans sa forme standard.
