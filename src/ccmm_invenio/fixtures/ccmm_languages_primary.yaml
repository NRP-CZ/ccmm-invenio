    en: The Armenian language (hayeren) forms an independent branch of the Indo-European
      family. It is spoken in the Republic of Armenia (where it is the official language),
      in Nagorno-Karabakh, in north-western Iran and in the Armenian diaspora.Armenian
      has its own unique script, the Armenian alphabet, invented by Mesrop Mashtots
      in the 5th century AD.
    fr: L’arménien (hayeren) constitue une branche indépendante de la famille indo-européenne.
      Il est parlé dans la République d’Arménie (où il est la langue officielle),
      dans le Haut-Karabakh, dans le nord-ouest de l’Iran et dans la diaspora arménienne.L’arménien
      a son propre système d’écriture unique, l’alphabet arménien, inventé par Mesrop
      Maštoc’ au Ve siècle.
