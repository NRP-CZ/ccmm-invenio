- description:
    en: German is a West Germanic language, most closely related to Dutch and Yiddish.
      German is a pluricentric language, with multiple countries having their own
      standardised variants as well as many dialects. There is also one variant referred
      to as Standard German.
    fr: L’allemand est une langue germanique occidentale, proche du néerlandais et
      du yiddish. L’allemand est une langue pluricentrique, avec plusieurs pays ayant
      leurs propres variantes normalisées ainsi que de nombreux dialectes. Il existe
      aussi une variante dénommée «allemand standard».
