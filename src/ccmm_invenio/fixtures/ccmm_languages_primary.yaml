- description:
    en: Urdu is a standardised register of the Hindustani language. Urdu is historically
      associated with the Muslims of the region of Hindustan.Urdu is written right-to-left
      in an extension of the Persian alphabet, which is itself an extension of the
      Arabic alphabet. Urdu is associated with the Nastaʿlīq style of Persian calligraphy.
    fr: L’ourdou ou urdu est une langue appartenant au groupe indo-iranien de la famille
      des langues indo-européennes.En Inde, il est connu sous le nom de «hindi» et
      s’écrit en caractères sanskrits, mais ses locuteurs musulmans le nomment «ourdou»
      et l’écrivent en caractères arabes, comme au Pakistan.
