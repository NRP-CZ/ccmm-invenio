- description:
    en: Korean is the official language of South Korea and North Korea. For over a
      millennium, Korean was written with adapted Chinese characters called hanja,
      complemented by phonetic systems like hyangchal, gugyeol, and idu. In the 15th
      century, a national writing system called hangul was commissioned by Sejong
      the Great, but it only came into widespread use in the 20th century.Most historical
      linguists classify Korean as a isolate language with no known relationship to
      any other languages.
    fr: Le coréen est une langue utilisée en Corée du Nord et en Corée du Sud. La
      classification du coréen est encore controversée. La plupart des linguistes
      le considèrent comme un isolat, tandis que d’autres le regroupent dans une hypothétique
      famille altaïque.L’alphabet qui sert à écrire le coréen est le hangeul; les
      hanja (sinogrammes employés dans cette langue) sont également utilisés, une
      assez grande partie du lexique étant d’origine chinoise.
  id: kor
