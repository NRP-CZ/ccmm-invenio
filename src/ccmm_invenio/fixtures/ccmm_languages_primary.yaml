- description:
    en: Irish, Irish Gaelic, or Gaelic (Gaeilge) belongs to the Gaelic branch of the
      Celtic family of languages, originating in Ireland and historically spoken by
      the Irish people.Irish is spoken as a first language by a small minority of
      Irish people, and as a second language by a rather larger group. Irish enjoys
      constitutional status as the national and first official language of the Republic
      of Ireland, and is an officially recognised minority language in Northern Ireland.
    fr: L’irlandais, gaélique irlandais ou gaélique (Gaeilge) appartient à la branche
      gaélique de la famille des langues celtiques, originaires de l’Irlande et historiquement
      parlées par le peuple irlandais.L’irlandais est utilisé comme première langue
      par une minorité irlandaise et comme deuxième langue par un groupe beaucoup
      plus large. L’irlandais bénéficie d’un statut constitutionnel comme langue officielle
      nationale et première langue de la République d’Irlande, et est une langue minoritaire
      officiellement reconnue en Irlande du Nord.
