- description:
    en: Spanish is a member of the Romance language family. It is spoken in Spain
      and in the continents of North and South America.Spanish is second after Mandarin
      in terms of its number of native speakers worldwide. From the last decades of
      the 20th century, the study of Spanish as a foreign language has grown significantly.
    fr: L’espagnol fait partie de la famille des langues romanes. Il est parlé en
      Espagne et en Amérique du Nord et du Sud.L’espagnol est la deuxième langue après
      le mandarin en termes de nombre de locuteurs natifs dans le monde entier. Depuis
      les dernières décennies du XXe siècle, l’étude de l’espagnol comme langue étrangère
      a augmenté de façon significative.
