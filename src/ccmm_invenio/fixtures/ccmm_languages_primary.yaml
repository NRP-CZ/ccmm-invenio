- description:
    en: Nynorsk is one of the two official written standards of the Norwegian language,
      the other being Bokmål. The name Nynorsk was introduced in 1929. After a series
      of reforms, it is still the written standard closer to Landsmål, Ivar Aasen's
      standard Norwegian language, whereas Bokmål is closer to Riksmål and Danish.
      Between 10 and 15 percent of Norwegians (primarily in the west around the city
      of Bergen) have Nynorsk as their official language form.
