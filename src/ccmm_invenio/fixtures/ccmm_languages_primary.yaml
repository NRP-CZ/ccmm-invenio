- description:
    en: Pashto, also known historically as Afghani and Pathani, is the native language
      of the Pashtun people of south-central Asia. Pashto is a member of the Eastern
      Iranian languages group.Pashto employs the Pashto alphabet, a modified form
      of the Persian alphabet, which in part is derived from the Arabic alphabet.
      It has extra letters for Pashto-specific sounds.
    fr: Le pachto est une langue appartenant au groupe indo-iranien de la famille
      des langues indo-européennes. Les locuteurs du pachto sont les Pachtounes.Cette
      langue s’écrit au moyen d’un alphabet arabe modifié.Le pachto est composé de
      deux dialectes principaux, celui de Kandahar et celui de Paktiyâ (ou de Peshawar).
