- description:
    en: Malagasy is an Austronesian language and the national language of Madagascar.
      Most people in Madagascar speak it as a first language as do some people of
      Malagasy descent elsewhere. The Malagasy language is the westernmost member
      of the Malayo-Polynesian branch of the Austronesian language family. It is related
      to the Malayo-Polynesian languages of Indonesia, Malaysia, and the Philippines,
      and more closely to the East Barito languages spoken in Borneo.
    fr: Le malgache ou malagasy est la langue nationale de Madagascar. C’est depuis
      toujours une langue normalisée, principalement dérivée du dialecte parlé sur
      les hauts plateaux centraux. Elle est la plus occidentale des langues malayo-polynésiennes
      et donc des langues austronésiennes. Plus précisément, elle appartient au rameau
      dit «Grand Barito». Dans cette région, la langue dominante est aujourd’hui le
      malais, qui appartient à un autre rameau malayo-polynésien. Le malgache est
      également utilisé à Mayotte sous le nom de «kibushi» ou «bushi».
  id: mlg
