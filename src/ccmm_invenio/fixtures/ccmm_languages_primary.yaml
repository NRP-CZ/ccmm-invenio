- description:
    en: Indonesian is the official language of Indonesia. It is a standardised register
      of Malay, an Austronesian language which has been used as a lingua franca in
      the Indonesian archipelago for centuries. Most Indonesians also speak one of
      more than 700 indigenous languages. Most formal education, and nearly all national
      media and other forms of communication, are conducted in Indonesian. The Indonesian
      name for the language is Bahasa Indonesia (literally ‘the language of Indonesia’).
    fr: L’indonésien (bahasa Indonesia, littéralement «langue de l’Indonésie») est
      la langue officielle de la République d’Indonésie. C’est aussi l’une des langues
      d’usage dans la République démocratique du Timor-Oriental. L’indonésien est
      l’une des formes du malais (bahasa Melayu). Pour une majorité d’Indonésiens,
      ce n’est pas leur langue maternelle. Ils ne l’apprennent à l’école que vers
      l’âge de 5 ans.
