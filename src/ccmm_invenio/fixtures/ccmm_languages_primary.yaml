- description:
    en: Hebrew is a North-Western Semitic language of the Afroasiatic language family,
      employed since biblical times by Jews. It was revived as a spoken and literary
      language in the 19th century. Modern Hebrew is one of the two official languages
      of Israel (the other being Arabic), while Classical Hebrew is used for prayer
      or study in Jewish communities around the world today.Hebrew has always employed
      a Hebrew script.
    fr: L’hébreu est une langue sémitique du Nord-Ouest de la famille des langues
      afro-asiatiques, utilisée depuis les temps bibliques par les Juifs. Il a été
      relancé en tant que langue parlée et littéraire au XIXe siècle. L’hébreu moderne
      est une des deux langues officielles d’Israël (l’autre étant l’arabe), tandis
      que l’hébreu classique est utilisé pour la prière ou l’étude au sein des communautés
      juives dans le monde d’aujourd’hui.L’hébreu a toujours utilisé un alphabet hébreu.
  id: heb
