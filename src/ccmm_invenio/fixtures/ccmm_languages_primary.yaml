- description:
    en: 'Welsh (Cymraeg) is a member of the Brittonic subgroup of the Celtic languages.
      It has the status of official language in Wales.Modern standard literary Welsh
      is a conservative form of the language: this makes it more difficult to learn
      but those who can read it can also read the early classics.'
    fr: 'Le gallois est une langue du sous-groupe brittonique des langues celtiques,
      parlée principalement au pays de Galles. Il a le statut de langue officielle
      au pays de Galles.Le gallois littéraire moderne standard est une forme conservatrice
      de la langue: cela le rend plus difficile à apprendre, mais ceux qui savent
      le lire peuvent également lire les premiers classiques.'
