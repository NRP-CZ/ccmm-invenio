- description:
    en: Catalan is a member of the Romance family of languages. It is spoken in Catalonia,
      north-eastern Spain and adjoining parts of France and it is the official language
      of Andorra. Catalan has a co-official status in the Spanish autonomous communities
      of Catalonia, the Balearic Islands, and the Valencian Community (where the language
      is known as Valencian). It is also the language of the city of Alghero on the
      Italian island Sardinia.
    fr: Le catalan est une langue latine. Il est parlé en Catalogne, en Espagne du
      Nord et dans des parties adjacentes de la France, et est la langue officielle
      de l’Andorre. Le catalan a un statut coofficiel dans les communautés autonomes
      espagnoles de Catalogne, les îles Baléares et la Communauté de Valence (où la
      langue est connue sous le nom de «valencien»). Il est aussi la langue de la
      ville d’Alghero sur l’île italienne de Sardaigne.
