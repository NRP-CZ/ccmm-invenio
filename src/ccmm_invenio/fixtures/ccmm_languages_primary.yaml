- description:
    en: Somali belongs to the Cushitic branch of the Afro-Asiatic languages, one of
      the largest language families in the world after Indo-European, Sino-Tibetan
      and Atlantic-Congo. It is spoken as a mother tongue by ethnic Somalis in Somalia
      and Ethiopia and in the Somali diaspora. It serves as a national language in
      Djibouti, and is also a recognised minority language in Kenya. A number of writing
      systems have been used for transcribing the language. Of these, the Somali Latin
      alphabet, officially adopted in 1972, is the most widely used.
    fr: Le somali appartient à la branche couchitique des langues afro-asiatiques,
      l’une des plus grandes familles linguistiques du monde après les langues indo-européennes,
      sino-tibétaines et atlantico-congolaises. Il est parlé comme langue maternelle
      par les Somalis en Somalie et en Éthiopie, ainsi que dans la diaspora somalienne.
      Il sert de langue nationale à Djibouti et est également une langue minoritaire
      reconnue au Kenya. Différents systèmes d’écriture ont été utilisés pour transcrire
      le somali. L’alphabet latin somali est aujourd’hui le système d’écriture du
      somali le plus répandu.
  id: som
