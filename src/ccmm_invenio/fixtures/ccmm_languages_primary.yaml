- description:
    en: Russian is an East Slavic language with a close relation to Ukrainian and
      Belarusian. It is an official or unofficial but widely spoken language in some
      countries that were once constituent republics of the Soviet Union.Russian is
      the most geographically widespread language of Eurasia and the most widely spoken
      of the Slavic languages.Russian is written by Cyrillic alphabet.
