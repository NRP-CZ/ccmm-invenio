- description:
    en: Dutch is a West Germanic language whose closest relative is German. It is
      spoken in the Netherlands, by about 60% of the population of Belgium, in Suriname
      and in the Caribbean island nations of Aruba, Curaçao, and Sint Maarten. The
      version of Dutch spoken in Southern Africa has been standardised into Afrikaans.
    fr: Le néerlandais est une langue germanique occidentale, dont le plus proche
      parent est l’allemand. Elle est parlée aux Pays-Bas, en Belgique (par environ
      60 % de la population), au Suriname et dans les pays insulaires des Caraïbes
      (Aruba, Curaçao et Sint-Maarten). La version du néerlandais parlé en Afrique
      du Sud a été normalisée comme l’afrikaans.
