- description:
    en: Bosnian is a South Slavic language, the standardised variety of the ‘Serbo-Croatian’
      used by Bosniaks, based on the Shtokavian dialect.Bosnian is written in both
      the Latin and the Cyrillic alphabet.
    fr: Le bosnien, parfois appelé «bosniaque», est une langue indo-européenne de
      la branche des langues slaves, groupe méridional de ces langues; il a pour base
      le dialecte chtokavien de l’entité linguistique appelée «langue serbo-croate».Le
      bosnien est écrit avec l’alphabet latin mais aussi avec l’alphabet cyrillique.
