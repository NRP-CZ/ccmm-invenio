- description:
    en: Hindi, or more precisely Modern Standard Hindi, is a standardised and Sanskritised
      register of the Hindustani language. Modern Standard Hindi is one of the official
      languages of India. Hindi is the fourth-most-widely spoken language in the world,
      but this includes not only Hindu speakers of Hindustani, but also people who
      identify as native speakers of related languages who consider their speech to
      be a dialect of Hindi, the Hindi belt.Hindi is written in Devanagari script.
    fr: Le hindi est la plus parlée des langues de l’Inde. Utilisée essentiellement
      dans le nord et le centre de l’Inde, c’est une langue indo-européenne de la
      branche des langues indo-aryennes, qui en est la plus vaste famille, dérivée
      du sanskrit et de divers prâkrits, écrite la plupart du temps au moyen de l’alphasyllabaire
      devanāgarī, qui se lit et s’écrit de gauche à droite. L’ourdou est le nom pakistanais
      du hindi. Le hindi et l’ourdou sont parfaitement intercompréhensibles et, avant
      la partition de 1947 entre l’Inde et le Pakistan, constituaient une seule et
      même langue, appelée «hindoustani».
  id: hin
