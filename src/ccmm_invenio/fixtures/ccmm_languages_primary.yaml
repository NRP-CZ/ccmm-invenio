- description:
    en: Occitan is the generic name for Romance idioms which are native mainly to
      southern France. There are polemics about the unity of the language, as some
      think that Occitan is a macrolanguage. There is no single written standard language
      called ‘Occitan’, and Occitan has no official status in France, home to most
      of Occitania.
    fr: L’occitan est le nom générique pour les idiomes romans originaires principalement
      du sud de la France. Il y a polémique sur l’unité de la langue, certains pensant
      que l’occitan est une macrolangue. Il n’y a pas de langue écrite standard intitulée
      «occitan», et l’occitan n’a pas de statut officiel en France, qui abrite la
      majeure partie de l’Occitanie.
