  description:
    en: Chichewa or Chewa or Chinyanja or Nyanja is a Bantu language spoken in Malawi
      and a recognised minority language in Eastern Zambia and Tete province of Mozambique.
      It is a minority language also in northeastern Zimbabwe. In Malawi, the name
      was officially changed from Chinyanja to Chichewa in 1968 at the insistence
      of President Hastings Kamuzu Banda, and is still the name most commonly used
      in Malawi today. In Zambia, Nyanja is still the preferred name, and Town Nyanja
      (Lusaka Nyanja) is rather divergent, under the influence of other languages
      in Lusaka. Chichewa belongs to the Narrow Bantu group, which is classified within
      the Volta-Congo branch. Like other Bantu languages, Chichewa has a noun class
      system, a characteristic feature of languages belonging to the Atlantic–Congo
      lineage, the largest demonstrated language family in Africa.
