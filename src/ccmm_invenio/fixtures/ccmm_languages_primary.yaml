- description:
    en: Chichewa or Chewa or Chinyanja or Nyanja is a Bantu language spoken in Malawi
      and a recognised minority language in Eastern Zambia and Tete province of Mozambique.
      It is a minority language also in northeastern Zimbabwe. In Malawi, the name
      was officially changed from Chinyanja to Chichewa in 1968 at the insistence
      of President Hastings Kamuzu Banda, and is still the name most commonly used
      in Malawi today. In Zambia, Nyanja is still the preferred name, and Town Nyanja
      (Lusaka Nyanja) is rather divergent, under the influence of other languages
      in Lusaka. Chichewa belongs to the Narrow Bantu group, which is classified within
      the Volta-Congo branch. Like other Bantu languages, Chichewa has a noun class
      system, a characteristic feature of languages belonging to the Atlantic–Congo
      lineage, the largest demonstrated language family in Africa.
    fr: Le chichewa, chewa, tchinyanja ou nyanja est une langue bantu parlée au Malawi
      et une langue minoritaire reconnue dans l’est de la Zambie et dans la province
      de Tete au Mozambique. Il s’agit également d’une langue minoritaire dans le
      nord-est du Zimbabwe. Au Malawi, le nom de tchinyanja a été officiellement changé
      en chichewa en 1968 à la demande insistante du président Hastings Kamuzu Banda
      et reste le nom le plus couramment utilisé au Malawi aujourd’hui. En Zambie,
      nyanja reste la dénomination privilégiée, et le nyanja urbain (nyanja de Lusaka)
      est plutôt divergent, influencé par les autres langues parlées à Lusaka. Le
      chichewa appartient au groupe du bantou dit «étroit», qui est classé dans la
      branche des langues voltaïco-congolaises. À l’instar d’autres langues bantoues,
      le chichewa possède un système de classes nominales, caractéristique des langues
      appartenant à la branche des langues atlantico-congolaises, la plus grande famille
      de langues dont la parenté est démontrée en Afrique.
