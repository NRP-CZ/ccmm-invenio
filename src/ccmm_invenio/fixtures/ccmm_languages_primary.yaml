- description:
    en: Northern or North Sami (davvisámegiella) is the most widely spoken of all
      Sami languages. It is spoken in the northern parts of Norway, Sweden and Finland.
      In Norway, Northern Sami is currently an official language in several municipalities
      in Finnmark and Troms counties. In Sweden, it is an official language in 18
      counties. Like neighbouring Baltic-Finnic languages, Sami languages are a branch
      of the Uralic language family.
    fr: Le same du Nord (davvisámegiella ou sámegiella) est la plus parlée des langues
      sames. Il est utilisé dans le nord de la Norvège, de la Suède et de la Finlande.
      En Norvège, le same du Nord est actuellement une langue officielle dans plusieurs
      municipalités des comtés du Finnmark et de Troms. En Suéde, c'est une langue
      officielle dans 18 comptés. Comme les langues balto-finnoises voisines, les
      langues sames constituent leur propre branche principale de la famille des langues
      ouraliennes.
  id: sme
