- description:
    en: Persian is an Iranian language within the Indo-Iranian branch of the Indo-European
      languages and the only South-Western Iranian language. Apart from being the
      majority language and the national language in Iran (Persia), a different dialect
      is spoken in Afghanistan (officially known as Dari since 1958 for political
      reasons) and in Tajikistan (officially known as Tajiki Persian since the Soviet
      era for political reasons), and in some other regions. Persian is a pluricentric
      language and its grammar is similar to that of many contemporary European languages.
      Modern Iranian Persian and Afghan Persian are written using a modified variant
      of the Arabic alphabet. Tajik Persian is typically written in a modified version
      of the Cyrillic alphabet.
    fr: Le persan est une langue iranienne de la branche indo-iranienne des langues
      indo-européennes et la seule langue iranienne du Sud-Ouest. Outre le fait qu’il
      s’agit de la langue majoritaire et de la langue nationale en Iran (Perse), un
      dialecte différent est parlé en Afghanistan (officiellement connu sous le nom
      de dari depuis 1958 pour des raisons politiques) et au Tadjikistan (officiellement
      connu sous le nom de tadjik depuis l’ère soviétique pour des raisons politiques),
      ainsi que dans d’autres régions. Le persan est une langue pluricentrique et
      sa grammaire est similaire à celle de nombreuses langues européennes contemporaines.
      Le persan iranien moderne et le persan afghan s’écrivent dans une variante modifiée
      de l’alphabet arabe. Le tadjik s’écrit généralement dans une version modifiée
      de l’alphabet cyrillique.
  id: fas
