- description:
    en: Georgian (Kartuli) is the most widely spoken of the Caucasian languages. It
      is the official language of Georgia.Georgian is written in its own unique writing
      system, the Georgian script.Georgian is the literary language for all regional
      subgroups of Georgians, including those who speak other Kartvelian languages.
    fr: Le géorgien (kartuli) est la plus parlée des langues caucasiennes. C’est la
      langue officielle de la Géorgie.Le géorgien a son propre système d’écriture
      unique, l’alphabet géorgien.Le géorgien est la langue littéraire pour tous les
      sous-groupes régionaux de Géorgiens, y compris ceux qui parlent d’autres langues
      kartvéliennes.
