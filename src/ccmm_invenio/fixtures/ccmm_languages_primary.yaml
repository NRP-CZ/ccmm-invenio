- description:
    en: The Mongolian language is the best-known member of the Mongolic language family.In
      Mongolia, the Khalkha dialect, written in Cyrillic, is predominant, while in
      Inner Mongolia, the language is dialectally more diverse and is written in the
      traditional Mongolian script.
    fr: Le mongol est une langue appartenant au groupe des langues mongoles. Il est
      parlé en Mongolie et en Chine (notamment en Mongolie-Intérieure), ainsi qu’en
      Russie (notamment en Bouriatie et en Kalmoukie).Le mongol est un ensemble de
      langues et de dialectes qui utilisent de nombreuses formes d’écritures. Différentes
      écritures ont été créées spécifiquement pour cette langue, mais d’autres ont
      également été utilisées pour retranscrire les langues mongoles, telles que les
      caractères chinois han, l’alphabet latin et l’alphabet cyrillique légèrement
      modifié.
