- description:
    en: Malay, endonym Bahasa Melayu, is an Austronesian macrolanguage within the
      Malayo-Polynesian branch spoken primarily on islands in maritime Southeast Asia
      and Malay Peninsula in mainland Asia. It is an official language of Brunei,
      Malaysia, Singapore and Indonesia. Malay is pluricentric, i.e., a group of mutually
      intelligible speech varieties, or dialect continuum, that have no traditional
      name in common, and which may be considered distinct languages by their speakers.
      Several varieties of it are standardised as the national language (bahasa kebangsaan
      or bahasa nasional) of several nation states with various official names. Classical
      Malay, also called Court Malay, was the literary standard of the pre-colonial
      Malacca and Johor Sultanates. Austronesian languages often possess phoneme inventories
      smaller than the world average. Two salient morphological characteristics are
      a system of affixation and reduplication to form new words.
    fr: Le malais, dont l’endonyme est bahasa melayu, est une macrolangue austro-polynésienne
      au sein de la branche malaisienne, principalement parlée dans plusieurs îles
      d’Asie du Sud-Est insulaire et de la péninsule malaise en Asie continentale.
      Il s’agit d’une langue officielle du Brunei, de la Malaisie, de Singapour et
      de l’Indonésie. Le malais est pluricentrique, c’est-à-dire qu’il s’agit d’un
      groupe de variétés de langues mutuellement intelligibles, ou gamme dialectale,
      qui n’ont pas de nom traditionnel en commun et qui peuvent être considérées
      comme des langues différentes par leurs locuteurs. Plusieurs de ses variétés
      sont normalisées en tant que langue nationale (bahasa kebangsaan ou bahasa nasional)
      de plusieurs États-nations sous différents noms officiels. Le malais classique,
      également appelé malais judiciaire, constituait la norme littéraire des sultanats
      précoloniaux de Malacca et de Johor. Les langues austronésiennes possèdent souvent
      des inventaires phonémiques plus réduits que la moyenne mondiale. Le système
      d’affixation et le redoublement permettant de former de nouveaux mots constituent
      deux caractéristiques morphologiques remarquables.
