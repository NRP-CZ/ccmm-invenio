- description:
    en: Vietnamese is the native language of Vietnamese people. It is part of the
      Austroasiatic language family of which it has, by far, the most speakers.The
      Vietnamese alphabet (quốc ngữ) in use today is a Latin alphabet with additional
      diacritics for tones, and certain letters.
    fr: Le vietnamien appartient à la branche môn-khmère des langues austro-asiatiques.
      Il est la langue austro-asiatique qui possède le plus de locuteurs. C’est une
      langue isolante et monosyllabique, dotée d’un système de 6 tons.Dans l’écriture
      latinisée utilisée actuellement, le Quốc ngữ, les mots figurent comme une succession
      de monosyllabes.
