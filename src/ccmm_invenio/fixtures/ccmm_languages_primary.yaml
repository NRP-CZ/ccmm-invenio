- description:
    en: The Tibetic or Tibetan languages (Bodish) are a cluster of mutually unintelligible
      Tibeto-Burman languages spoken primarily by Tibetan peoples who live across
      a wide area of eastern Central Asia bordering the Indian subcontinent, including
      the Tibetan Plateau and the northern Indian subcontinent in Baltistan, Ladakh,
      Nepal, Sikkim, and Bhutan. The classical written form is a major regional literary
      language, particularly for its use in Buddhist literature.Most Tibetic languages
      are written in an Indic script, with a historically conservative orthography
      (see below) that helps unify the Tibetan-language area. However, some Ladakhi
      and Balti speakers write with the Urdu script.
    fr: Le tibétain est une langue parlée par plusieurs millions de locuteurs dans
      l’ancien Tibet, c’est-à-dire la Région autonome du Tibet, les zones à population
      tibétaine du Qinghai (Amdo), du Gansu, du Sichuan et du Yunnan (Kham) en République
      populaire de Chine, et dans certaines régions des pays environnants, de l’Himalaya
      et de l’Asie centrale, comme le Ladakh et le Sikkim en Inde, le Baltistan pakistanais,
      le Bhoutan et le nord du Népal. Le tibétain est une langue appartenant à la
      famille des langues tibéto-birmanes. Il se subdivise en un grand nombre de dialectes.L’écriture
      Phagspa, alphasyllabaire, fut créée comme écriture unifiée pour toutes les langues
      de l’Empire mongol. Le lama Phagspa la dériva de son écriture natale, l’écriture
      tibétaine.
