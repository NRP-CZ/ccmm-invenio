- description:
    en: Icelandic is an Indo-European language belonging to the North Germanic or
      Nordic branch of the Germanic languages. The vast majority of Icelandic speakers
      live in Iceland. Most Icelanders do not have surnames but patronymics. Forenames
      are followed by the genitive form of the father’s (or the mother’s) Christian
      name completed by son (son of …) or dóttir (daughter of …), e.g. Jónsson, Jónsdóttir
      if the name of the father is Jón.
    fr: L’islandais est une langue indo-européenne appartenant à la branche nord germanique
      des langues germaniques. La grande majorité des locuteurs islandais vivent en
      Islande. La plupart des Islandais n’ont pas de noms de famille mais des patronymes.
      Les prénoms sont suivis par la forme au génitif du prénom du père (ou de la
      mère), complétée par «son» (fils de …) ou «dóttir» (fille de …), par exemple
      les enfants de Jón s’appellent ainsi Jónsson et Jónsdóttir.
