- description:
    en: 'Norwegian belongs to the Northern branch of Germanic languages. It is spoken
      primarily in Norway. Together with Swedish and Danish, Norwegian forms a continuum
      of more or less mutually intelligible local and regional variants. Germanic
      languages form a branch of the Indo-European language family, the largest language
      family in the world by number of native speakers. There are two official forms
      of written Norwegian: Bokmål (literally ‘book tongue’) and Nynorsk (literally
      ‘new Norwegian’).'
    fr: 'Le norvégien appartient à la branche nord des langues germaniques. Il est
      parlé principalement en Norvège. Avec le suédois et le danois, le norvégien
      forme un continuum de variantes locales et régionales plus ou moins mutuellement
      intelligibles. Les langues germaniques constituent une branche de la famille
      des langues indo-européennes, la plus grande famille linguistique du monde par
      le nombre de locuteurs natifs. Il existe deux formes officielles du norvégien
      écrit: le bokmål (littéralement «langue du livre») et le nynorsk (littéralement
      «nouveau norvégien»).'
