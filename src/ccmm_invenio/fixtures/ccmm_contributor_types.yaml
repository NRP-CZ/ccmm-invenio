    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/other
  title:
    cs: Jiná role
    en: Other
- description:
    en: 'Typically, a person or organisation responsible for the artistry and form
      of a media product.

      In the data industry, this may be a company “producing” DVDs that package data
      for future dissemination by a distributor.'
  hierarchy:
    parent: contributor
  id: producer
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/producer
    scheme: https://nma.eosc.cz/vocabularies/
