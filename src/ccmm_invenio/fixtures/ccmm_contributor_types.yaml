  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/ProjectLeader
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/projectleader
  title:
    cs: Vedoucí projektu
    en: Project Leader
- description:
    en: 'Person officially designated as manager of a project. Project may consist
      of one or many project teams and sub-teams.

      The manager of a project normally has more administrative responsibility than
      actual work involvement.'
  hierarchy:
    parent: contributor
  id: projectmanager
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/projectmanager
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/ProjectManager
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/ProjectManager
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/ProjectManager
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/projectmanager
  title:
    cs: Projektový manažer
    en: Project Manager
- description:
    en: 'Person on the membership list of a designated project/project team.

      This vocabulary may or may not indicate the quality, quantity, or substance
      of the person’s involvement.'
  hierarchy:
    parent: contributor
  id: projectmember
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/projectmember
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/ProjectMember
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/ProjectMember
