- id: contactperson
  title:
    cs: Kontaktní osoba
    en: Contact Person
  description:
    en: 'Person with knowledge of how to access, troubleshoot, or otherwise field
      issues related to the resource.

      May also be the “Point of Contact” in an organisation that controls access to
      the resource, if that organisation is different from the Publisher, Distributor,
      and Data Manager.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/contactperson
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: ContactPerson
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: contactperson
    skos:exactMatch:info:eu-repo/semantics: contactperson
- id: datacollector
  title:
    cs: Sběratel dat
    en: Data Collector
  description:
    en: 'Person/institution responsible for finding or gathering/collecting data under
      the guidelines of the author(s) or Principal Investigator (PI).

      May also be used when crediting survey conductors, interviewers, event or condition
      observers, or persons responsible for monitoring key instrument data.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/datacollector
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: DataCollector
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: datacollector
    skos:exactMatch:info:eu-repo/semantics: datacollector
- id: datacurator
  title:
    cs: Kurátor dat
    en: Data Curator
  description:
    en: 'Person tasked with reviewing, enhancing, cleaning, or standardizing metadata
      and the associated data submitted for storage, use, and maintenance within a
      data centre or repository.

      While the DataManager is concerned with digital maintenance, the DataCurator’s
      role encompasses quality assurance focused on content and metadata. DataCurator
      responsibilities include: checking completeness of the submitted dataset against
      the content as described by the submitter; verifying standard metadata according
      to the applicable system or schema; adding or verifying specialized metadata
      to add value and ensure access across disciplines; and determining how the metadata
      might map to search engines, database products, and automated feeds.


      Repository managers as well as data librarians working in the repository fall
      within this category.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/datacurator
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: DataCurator
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: datacurator
    skos:exactMatch:info:eu-repo/semantics: datacurator
- id: datamanager
  title:
    cs: Manažer dat
    en: Data Manager
  description:
    en: 'Person (or organisation with a staff of data managers, such as a data centre)
      responsible for maintaining the finished resource.

      The work done by this person or organisation ensures that the resource is periodically
      “refreshed” in terms of software/hardware support, is kept available or is protected
      from unauthorized access, is stored in accordance with industry standards, and
      is handled in accordance with the records management requirements applicable
      to it.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/datamanager
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: DataManager
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: datamanager
    skos:exactMatch:info:eu-repo/semantics: datamanager
- id: distributor
  title:
    cs: Distributor
    en: Distributor
  description:
    en: 'Institution tasked with responsibility to generate/disseminate copies of
      the resource in either electronic or print form.

      Works stored in more than one archive/repository may credit each as a distributor.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/distributor
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: Distributor
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: distributor
    skos:exactMatch:info:eu-repo/semantics: distributor
- id: editor
  title:
    cs: Editor
    en: Editor
  description:
    en: 'A person who oversees the details related to the publication format of the
      resource.

      Note: if the Editor is to be credited in place of multiple creators, the Editor’s
      name may be supplied as Creator, with “(Ed.)” appended to the name.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/editor
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: Editor
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: editor
    skos:exactMatch:info:eu-repo/semantics: editor
- id: hostinginstitution
  title:
    cs: Hostující instituce
    en: Hosting Institution
  description:
    en: 'Typically, the organisation allowing the resource to be available on the
      internet through the provision of its hardware/software/operating support.

      This role normally falls on the University, research center or organization
      where the data center/data repository belongs.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/hostinginstitution
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: HostingInstitution
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: hostinginstitution
    skos:exactMatch:info:eu-repo/semantics: hostinginstitution
- id: producer
  title:
    cs: Producent
    en: Producer
  description:
    en: 'Typically, a person or organisation responsible for the artistry and form
      of a media product.

      In the data industry, this may be a company “producing” DVDs that package data
      for future dissemination by a distributor.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/producer
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: Producer
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: producer
    skos:exactMatch:info:eu-repo/semantics: producer
- id: projectleader
  title:
    cs: Vedoucí projektu
    en: Project Leader
  description:
    en: 'Person officially designated as head of project team or sub- project team
      instrumental in the work necessary to development of the resource.

      The Project Leader is not “removed” from the work that resulted in the resource;
      he or she remains intimately involved throughout the life of the particular
      project team.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/projectleader
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: ProjectLeader
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: projectleader
    skos:exactMatch:info:eu-repo/semantics: projectleader
- id: projectmanager
  title:
    cs: Projektový manažer
    en: Project Manager
  description:
    en: 'Person officially designated as manager of a project. Project may consist
      of one or many project teams and sub-teams.

      The manager of a project normally has more administrative responsibility than
      actual work involvement.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/projectmanager
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: ProjectManager
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: projectmanager
    skos:exactMatch:info:eu-repo/semantics: projectmanager
- id: projectmember
  title:
    cs: Člen projektového týmu
    en: Project Member
  description:
    en: 'Person on the membership list of a designated project/project team.

      This vocabulary may or may not indicate the quality, quantity, or substance
      of the person’s involvement.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/projectmember
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: ProjectMember
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: projectmember
    skos:exactMatch:info:eu-repo/semantics: projectmember
- id: registrationagency
  title:
    cs: Registrační agentura
    en: Registration Agency
  description:
    en: 'Institution/organisation officially appointed by a Registration Authority
      to handle specific tasks within a defined area of responsibility.

      DataCite is a Registration Agency for the International DOI Foundation (IDF).
      One of DataCite’s tasks is to assign DOI prefixes to the allocating agents who
      then assign the full, specific character string to data clients, provide metadata
      back to the DataCite registry, etc.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/registrationagency
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: RegistrationAgency
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: registrationagency
    skos:exactMatch:info:eu-repo/semantics: registrationagency
- id: registrationauthority
  title:
    cs: Registrační autorita
    en: Registration Authority
  description:
    en: 'A standards-setting body from which Registration Agencies obtain official
      recognition and guidance.

      The IDF serves as the Registration Authority for the International Standards
      Organisation (ISO) in the area/domain of Digital Object Identifiers.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/registrationauthority
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: RegistrationAuthority
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: registrationauthority
    skos:exactMatch:info:eu-repo/semantics: registrationauthority
- id: relatedperson
  title:
    cs: Související osoba
    en: Related Person
  description:
    en: 'A person without a specifically defined role in the development of the resource,
      but who is someone the author wishes to recognize.

      Usage Notes: This person could be an author’s intellectual mentor, a person
      providing intellectual leadership in the discipline or subject domain, etc.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/relatedperson
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: RelatedPerson
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: relatedperson
    skos:exactMatch:info:eu-repo/semantics: relatedperson
- id: researcher
  title:
    cs: Výzkumník
    en: Researcher
  description:
    en: 'A person involved in analysing data or the results of an experiment or formal
      study. May indicate an intern or assistant to one of the authors who helped
      with research but who was not so “key” as to be listed as an author.

      Should be a person, not an institution. Note that a person involved in the gathering
      of data would fall under the contributorType “DataCollector.” The researcher
      may find additional data online and correlate it to the data collected for the
      experiment or study, for example.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/researcher
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: Researcher
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: researcher
    skos:exactMatch:info:eu-repo/semantics: researcher
- id: researchgroup
  title:
    cs: Výzkumná skupina
    en: Research Group
  description:
    en: 'Typically refers to a group of individuals with a lab, department, or division
      that has a specifically defined focus of activity.

      May operate at a narrower level of scope; may or may not hold less administrative
      responsibility than a project team.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/researchgroup
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: ResearchGroup
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: researchgroup
    skos:exactMatch:info:eu-repo/semantics: researchgroup
- id: rightsholder
  title:
    cs: Majitel práv
    en: Rights Holder
  description:
    en: Person or institution owning or managing property rights, including intellectual
      property rights over the resource.
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/rightsholder
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: RightsHolder
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: rightsholder
    skos:exactMatch:info:eu-repo/semantics: rightsholder
- id: sponsor
  title:
    cs: Sponzor
    en: Sponsor
  description:
    en: 'Person or organisation that issued a contract or under the auspices of which
      a work has been written, printed, published, developed, etc.

      Includes organisations that provide in-kind support, through donation, provision
      of people or a facility or instrumentation necessary for the development of
      the resource, etc.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/sponsor
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: Sponsor
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: sponsor
    skos:exactMatch:info:eu-repo/semantics: sponsor
- id: supervisor
  title:
    cs: Supervizor
    en: Supervisor
  description:
    en: Designated administrator over one or more groups/teams working to produce
      a resource, or over one or more steps of a development process.
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/supervisor
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: Supervisor
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: supervisor
    skos:exactMatch:info:eu-repo/semantics: supervisor
- id: translator
  title:
    cs: Překladatel
    en: Translator
  description:
    en: 'A person, organization, or automated system responsible for converting the
      content of a resource from one language into another, preserving its meaning
      and intended message.

      This contributor type should be applied to DOI metadata for a resource which
      has been translated from another resource.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/translator
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: Translator
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: translator
- id: workpackageleader
  title:
    cs: Vedoucí pracovního balíku
    en: Work Package Leader
  description:
    en: A Work Package is a recognized data product, not all of which is included
      in publication. The package, instead, may include notes, discarded documents,
      etc. The Work Package Leader is responsible for ensuring the comprehensive contents,
      versioning, and availability of the Work Package during the development of the
      resource.
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/workpackageleader
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: WorkPackageLeader
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: workpackageleader
    skos:exactMatch:info:eu-repo/semantics: workpackageleader
- id: other
  title:
    cs: Jiná role
    en: Other
  description:
    en: 'Any person or institution making a significant contribution to the development
      and/or maintenance of the resource, but whose contribution is not adequately
      described by any of the other values for contributorType.

      Could be a photographer, artist, or writer whose contribution helped to publicize
      the resource (as opposed to creating it), a reviewer of the resource, someone
      providing administrative services to the author (such as depositing updates
      into an online repository, analysing usage, etc.), or one of many other roles.'
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/other
    skos:exactMatch:https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor: Other
    skos:exactMatch:https://schema.datacite.org/meta/kernel-4/contributorType: other
    skos:exactMatch:info:eu-repo/semantics: other
