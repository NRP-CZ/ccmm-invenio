  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/editor
  title:
    cs: Editor
    en: Editor
- description:
    en: 'Typically, the organisation allowing the resource to be available on the
      internet through the provision of its hardware/software/operating support.

      This role normally falls on the University, research center or organization
      where the data center/data repository belongs.'
  hierarchy:
    parent: contributor
  id: hostinginstitution
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/hostinginstitution
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/HostingInstitution
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/HostingInstitution
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/HostingInstitution
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/hostinginstitution
  title:
    cs: Hostující instituce
    en: Hosting Institution
- description:
    en: 'Any person or institution making a significant contribution to the development
      and/or maintenance of the resource, but whose contribution is not adequately
      described by any of the other values for contributorType.

      Could be a photographer, artist, or writer whose contribution helped to publicize
      the resource (as opposed to creating it), a reviewer of the resource, someone
      providing administrative services to the author (such as depositing updates
      into an online repository, analysing usage, etc.), or one of many other roles.'
  hierarchy:
    parent: contributor
  id: other
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/other
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/Other
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
