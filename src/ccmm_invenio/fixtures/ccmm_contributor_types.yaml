  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/producer
  title:
    cs: Producent
    en: Producer
- description:
    en: 'Person officially designated as head of project team or sub- project team
      instrumental in the work necessary to development of the resource.

      The Project Leader is not “removed” from the work that resulted in the resource;
      he or she remains intimately involved throughout the life of the particular
      project team.'
  hierarchy:
    parent: contributor
  id: projectleader
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/projectleader
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/ProjectLeader
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/ProjectLeader
