  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/ProjectMember
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/projectmember
  title:
    cs: Člen projektového týmu
    en: Project Member
- description:
    en: 'Institution/organisation officially appointed by a Registration Authority
      to handle specific tasks within a defined area of responsibility.

      DataCite is a Registration Agency for the International DOI Foundation (IDF).
      One of DataCite’s tasks is to assign DOI prefixes to the allocating agents who
      then assign the full, specific character string to data clients, provide metadata
      back to the DataCite registry, etc.'
  hierarchy:
    parent: contributor
  id: registrationagency
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/registrationagency
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/RegistrationAgency
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/RegistrationAgency
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/RegistrationAgency
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/registrationagency
  title:
    cs: Registrační agentura
    en: Registration Agency
- description:
    en: 'A standards-setting body from which Registration Agencies obtain official
      recognition and guidance.

      The IDF serves as the Registration Authority for the International Standards
      Organisation (ISO) in the area/domain of Digital Object Identifiers.'
  hierarchy:
    parent: contributor
  id: registrationauthority
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/registrationauthority
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/RegistrationAuthority
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/RegistrationAuthority
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/RegistrationAuthority
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/registrationauthority
  title:
    cs: Registrační autorita
    en: Registration Authority
- description:
    en: 'A person without a specifically defined role in the development of the resource,
      but who is someone the author wishes to recognize.

      Usage Notes: This person could be an author’s intellectual mentor, a person
      providing intellectual leadership in the discipline or subject domain, etc.'
  hierarchy:
    parent: contributor
  id: relatedperson
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/relatedperson
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/RelatedPerson
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/RelatedPerson
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/RelatedPerson
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/relatedperson
  title:
    cs: Související osoba
    en: Related Person
- description:
    en: 'A person involved in analysing data or the results of an experiment or formal
      study. May indicate an intern or assistant to one of the authors who helped
      with research but who was not so “key” as to be listed as an author.

      Should be a person, not an institution. Note that a person involved in the gathering
      of data would fall under the contributorType “DataCollector.” The researcher
      may find additional data online and correlate it to the data collected for the
      experiment or study, for example.'
  hierarchy:
    parent: contributor
  id: researcher
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/researcher
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/Researcher
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/Researcher
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/Researcher
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/researcher
  title:
    cs: Výzkumník
    en: Researcher
- description:
    en: 'Typically refers to a group of individuals with a lab, department, or division
      that has a specifically defined focus of activity.

      May operate at a narrower level of scope; may or may not hold less administrative
      responsibility than a project team.'
  hierarchy:
    parent: contributor
  id: researchgroup
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/researchgroup
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/ResearchGroup
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/ResearchGroup
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/ResearchGroup
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/researchgroup
  title:
    cs: Výzkumná skupina
    en: Research Group
- description:
    en: Person or institution owning or managing property rights, including intellectual
      property rights over the resource.
  hierarchy:
    parent: contributor
  id: rightsholder
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/rightsholder
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/RightsHolder
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/RightsHolder
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/RightsHolder
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/rightsholder
  title:
    cs: Majitel práv
    en: Rights Holder
- description:
    en: 'Person or organisation that issued a contract or under the auspices of which
      a work has been written, printed, published, developed, etc.

      Includes organisations that provide in-kind support, through donation, provision
      of people or a facility or instrumentation necessary for the development of
      the resource, etc.'
  hierarchy:
    parent: contributor
  id: sponsor
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/sponsor
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/Sponsor
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/Sponsor
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/Sponsor
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/sponsor
  title:
    cs: Sponzor
    en: Sponsor
- description:
    en: Designated administrator over one or more groups/teams working to produce
      a resource, or over one or more steps of a development process.
  hierarchy:
    parent: contributor
  id: supervisor
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/supervisor
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/Supervisor
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/Supervisor
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/Supervisor
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/supervisor
  title:
    cs: Supervizor
    en: Supervisor
- description:
    en: 'A person, organization, or automated system responsible for converting the
      content of a resource from one language into another, preserving its meaning
      and intended message.

      This contributor type should be applied to DOI metadata for a resource which
      has been translated from another resource.'
  hierarchy:
    parent: contributor
  id: translator
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/translator
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/Translator
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/Translator
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/translator
  title:
    cs: Překladatel
    en: Translator
- description:
    en: A Work Package is a recognized data product, not all of which is included
      in publication. The package, instead, may include notes, discarded documents,
      etc. The Work Package Leader is responsible for ensuring the comprehensive contents,
      versioning, and availability of the Work Package during the development of the
      resource.
  hierarchy:
    parent: contributor
  id: workpackageleader
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/workpackageleader
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/WorkPackageLeader
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/WorkPackageLeader
    scheme: info:eu-repo/semantics/
  - identifier: https://schema.datacite.org/meta/kernel-4/contributorType/WorkPackageLeader
    scheme: https://schema.datacite.org/meta/kernel-4/contributorType/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/workpackageleader
  title:
    cs: Vedoucí pracovního balíku
    en: Work Package Leader
