- description:
    en: The institution or person responsible for collecting, managing, distributing,
      or otherwise contributing to the development of the resource. To supply multiple
      contributors, repeat this property.
  id: contributor
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/contributor
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/
  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/contributor
  title:
    en: Contributor
- description:
    en: 'Person with knowledge of how to access, troubleshoot, or otherwise field
      issues related to the resource.

      May also be the “Point of Contact” in an organisation that controls access to
      the resource, if that organisation is different from the Publisher, Distributor,
      and Data Manager.'
  hierarchy:
    parent: contributor
  id: contactperson
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/contactperson
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/ContactPerson
