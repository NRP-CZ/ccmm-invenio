  props:
    iri: https://nma.eosc.cz/vocabularies/contributorsroles/distributor
  title:
    cs: Distributor
    en: Distributor
- description:
    en: 'A person who oversees the details related to the publication format of the
      resource.

      Note: if the Editor is to be credited in place of multiple creators, the Editor’s
      name may be supplied as Creator, with “(Ed.)” appended to the name.'
  hierarchy:
    parent: contributor
  id: editor
  identifiers:
  - identifier: https://nma.eosc.cz/vocabularies/contributorsroles/editor
    scheme: https://nma.eosc.cz/vocabularies/
  - identifier: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/Editor
    scheme: https://vocabs.ccmm.cz/registry/codelist/AgentRole/Contributor/
  - identifier: info:eu-repo/semantics/Editor
